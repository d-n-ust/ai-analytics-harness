# A local Langfuse, so `bench publish` can be tried without an account and without sending a
# question, an answer or a price to anyone else's server.
#
# WHY SELF-HOSTED IS THE DEFAULT HERE. The rows carry the full question, the full answer, the
# tool calls and the measured cost of every run. That is the material the published articles are
# built from. Sending it to a hosted service by default would be a decision this repository makes
# on the reader's behalf; pointing LANGFUSE_HOST at the cloud is one line for whoever wants it.
#
#   docker compose -f observability/docker-compose.yml up -d
#   export LANGFUSE_HOST=http://localhost:3100
#   export LANGFUSE_PUBLIC_KEY=pk-lf-local-harness LANGFUSE_SECRET_KEY=sk-lf-local-harness
#   ./bench publish --run runs/latest
#   open http://localhost:3100        # sign in as local@harness.test / localdevpassword
#
# The keys below are development placeholders and are safe to read: this stack binds to localhost
# and holds nothing but runs that are already in the repository. Do not reuse them anywhere else.

name: harness-observability

services:
  langfuse:
    image: langfuse/langfuse:3
    depends_on: {postgres: {condition: service_healthy}, clickhouse: {condition: service_healthy}, minio: {condition: service_healthy}, redis: {condition: service_healthy}}
    # 3000 is the default for too many dev servers to claim it. Override: LANGFUSE_PORT=…
    ports: ["${LANGFUSE_PORT:-3100}:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3100}
      NEXTAUTH_SECRET: dev-only-not-a-secret-0000000000
      SALT: dev-only-not-a-secret-1111111111
      ENCRYPTION_KEY: "8873744736665cc5c7409bf6ba28942be5e940aa9d3f63395aaf1d8cbd8ee75e"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      # Single node: without this the migrations emit ON CLUSTER / ReplicatedMergeTree
      # DDL, which needs a Keeper quorum that a one-container stack does not have.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # Provisioned on first boot, so the stack is usable without clicking through a sign-up
      # form. The two keys below are what `bench publish` reads; they are fixed on purpose, so
      # the instructions at the top of this file are copy-pasteable and stay true.
      LANGFUSE_INIT_ORG_ID: harness
      LANGFUSE_INIT_ORG_NAME: Harness
      LANGFUSE_INIT_PROJECT_ID: evals
      LANGFUSE_INIT_PROJECT_NAME: Evaluations
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-harness
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-harness
      LANGFUSE_INIT_USER_EMAIL: local@harness.test
      LANGFUSE_INIT_USER_NAME: Local
      LANGFUSE_INIT_USER_PASSWORD: localdevpassword
      AUTH_DISABLE_SIGNUP: "true"
      TELEMETRY_ENABLED: "false"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on: {postgres: {condition: service_healthy}, clickhouse: {condition: service_healthy}, minio: {condition: service_healthy}, redis: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      SALT: dev-only-not-a-secret-1111111111
      ENCRYPTION_KEY: "8873744736665cc5c7409bf6ba28942be5e940aa9d3f63395aaf1d8cbd8ee75e"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      # Single node: without this the migrations emit ON CLUSTER / ReplicatedMergeTree
      # DDL, which needs a Keeper quorum that a one-container stack does not have.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"

  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: postgres}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20}
    volumes: ["postgres:/var/lib/postgresql/data"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment: {CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: clickhouse, CLICKHOUSE_DB: default}
    healthcheck: {test: ["CMD-SHELL", "wget -qO- localhost:8123/ping || exit 1"], interval: 3s, retries: 30}
    volumes: ["clickhouse:/var/lib/clickhouse"]

  minio:
    # quay.io, not Docker Hub: `minio/minio` there now refuses anonymous pulls.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address ":9001"'
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret}
    healthcheck: {test: ["CMD-SHELL", "mc ready local"], interval: 3s, retries: 30}
    volumes: ["minio:/data"]

  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}

volumes: {postgres: {}, clickhouse: {}, minio: {}}
