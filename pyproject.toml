[project]
# A coordination shell, not a package. It exists so `uv sync` at the root resolves both members
# into one environment and one lockfile, and so there is exactly one place that configures ruff
# for the whole repository.
#
# The real packages are engine/ (ships) and harness/ (measures the engine, never ships). troodos/
# is deliberately OUTSIDE the workspace: it is the product, it wants its own environment and its
# own lockfile, and uv's own documentation sends that case to a path dependency rather than a
# workspace member.
name = "ai-analytics-workspace"
version = "0.0.0"
description = "Workspace root for the AI-analyst engine and its measurement harness."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Ustimov" }]

dependencies = [
    "ai-analytics-engine",
    "ai-analytics-harness",
    "ai-analytics-warehouse",
]

[tool.uv]
# Nothing to build here. The root is a shell; `uv sync` installs the members.
package = false

[tool.uv.workspace]
members = ["engine", "harness", "warehouse"]
# preflight/ is excluded for the same reason as troodos/: it is a standalone, extraction-ready
# package with a heavier dependency closure (sentence-transformers pulls torch) that must not land
# in the shared engine+harness environment. It keeps its own lockfile and is consumed as a path
# dependency where needed.
exclude = ["troodos", "preflight"]

[tool.uv.sources]
ai-analytics-engine = { workspace = true }
ai-analytics-harness = { workspace = true }
ai-analytics-warehouse = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
]
# Mirrored from harness/pyproject.toml. Every command in this repository runs from the root, and
# a group defined only on a member is not reachable from here — `uv run --group metricflow` at the
# root failed outright, which silently excused two MetricFlow adapter tests from ever running.
metricflow = [
    "metricflow>=0.211.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# Historical audit scripts and generated run artifacts are not part of the live surface.
extend-exclude = ["harness/experiments", "results", "runs"]

# Where first-party code lives. Ruff resolves `src` against THIS FILE'S directory and defaults to
# [".", "src"], so once the packages move under engine/src and harness/ it would classify every
# one of them as third-party — isort then reshuffles every import block in the repo, and the
# migration diff disappears into the noise. Set structurally here; the known-first-party list
# below is the belt to the same braces.
src = [".", "engine/src", "harness", "preflight/src", "warehouse/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Many governed prompts and docstrings are intentionally long single strings; length isn't the
# signal here. Keep the correctness rules (F/B), import order (I), and modern-Python (UP).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "semantic", "warehouse", "evidence",
                     "cli", "evals", "experiments", "scratchpad", "harness_paths", "preflight"]
