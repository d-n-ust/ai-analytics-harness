[project]
name = "ai-analytics-harness"
version = "0.1.0"
description = "A controlled lab experiment: how much does structure (a schema, a semantic layer, a knowledge base, a metric tree) improve an LLM analyst's answers over messy data?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Ustimov" }]
dependencies = [
    "duckdb>=1.1",
    "anthropic>=0.40",
    "openai>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "faker>=30",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "rich>=13",
]

[dependency-groups]
# The structural guarantees are claimed to hold for ANY call, not just the handful a human
# thought to enumerate. Hypothesis generates the call space so that claim is tested rather
# than asserted; pytest is what CI already invokes the suite through.
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
]
metricflow = [
    "metricflow>=0.211.0",
]

# The harness is still a runnable app first. It is made installable only so that the product
# package in `troodos/` can depend on it as an EDITABLE path dependency during development.
#
# Editable is not a preference, it is a requirement: `agent/prompts.py` resolves `context/`
# relative to the package's parent directory, and `semantic/` reads its YAML from beside its
# own source. A normal wheel install relocates those and both break. An editable install
# leaves every file where it is, so the path arithmetic keeps working.
#
# This is the ONE concession to the product living in the same tree. Nothing here is for the
# product's benefit beyond making imports resolve; the harness's behaviour is unchanged.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "semantic", "warehouse", "cli", "evals"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Historical audit scripts and generated run artifacts are not part of the live surface.
extend-exclude = ["experiments", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Many governed prompts and docstrings are intentionally long single strings; length isn't the
# signal here. Keep the correctness rules (F/B), import order (I), and modern-Python (UP).
ignore = ["E501"]
