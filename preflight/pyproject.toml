# preflight — a standalone, extraction-ready package.
#
# Deliberately OUTSIDE the workspace (like troodos/): it carries a different, heavier dependency
# closure than the engine and harness (sentence-transformers pulls torch), and it is meant to be
# liftable out of this repository as-is. Kept as its own package with its own lockfile so that
# closure never lands in the shared engine+harness environment; extraction later is a `git mv`.

[project]
# Distribution name (the bare `preflight` is taken on PyPI by an unrelated project). The import
# package and the CLI command both stay `preflight` — only what you `pip install` differs.
name = "preflight-analytics"
version = "0.1.0"
description = "Static, cross-layer ambiguity detection for governed analytics grounding: find confusable metric, column, and term definitions before an agent queries them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Ustimov" }]

# The core is intentionally light and pure-Python: parse governed definitions, compare their
# meaning and scope structurally, report the dangerous confusions. No model is required.
dependencies = [
    "sqlglot>=25",
    "pyyaml>=6",
]

[project.scripts]
preflight = "preflight.cli:main"

[project.optional-dependencies]
# The confusability GATE only. Structural detection runs without these on a built-in lexical gate;
# embeddings sharpen which name-pairs are worth comparing and are the validated path. Kept optional
# so a base install stays light and torch does not ride along.
embeddings = ["sentence-transformers>=3", "numpy>=1.26"]

[dependency-groups]
# The suite runs core-only (no embeddings), which is the proof that detection needs no heavy deps.
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.13", "ruff>=0.16", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout, for distribution correctness: it forces an installed import rather than an accidental
# relative one, so a missing module fails in the test suite rather than on a stranger's machine.
[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM"]
ignore = ["E501"]   # long lines are almost all aligned comments; format handles code width

[tool.mypy]
python_version = "3.11"
files = ["src/preflight"]
ignore_missing_imports = true   # sqlglot / sentence_transformers ship partial or no stubs
