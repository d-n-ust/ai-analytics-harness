# Fast feedback before a commit lands: lint (with autofix) and type-check.
# `ruff format` is deliberately NOT run here — the source is hand-aligned for readability
# (aligned comments, multi-line literals), and the formatter would fight that. Lint enforces
# correctness/imports/modern-syntax; formatting stays a human choice. Run: `pre-commit run -a`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^src/preflight/
        args: [--ignore-missing-imports]
        additional_dependencies: [types-PyYAML]
