# Composite GitHub Action: run preflight as a build gate on an analytics repo.
# Referenced today as a subdirectory action (uses: d-n-ust/ai-analytics-harness/preflight@<ref>);
# once preflight is extracted to its own repo it becomes uses: d-n-ust/preflight-analytics@v1 unchanged.
name: preflight ambiguity scan
description: Fail the build when governed analytics definitions collide (cross-layer ambiguity).
branding:
  icon: alert-triangle
  color: orange

inputs:
  path:
    description: Directory holding semantic/, warehouse/, docs/ artifacts.
    required: false
    default: "."
  gate:
    description: "Confusability gate: auto | lexical | embeddings. Best results: embeddings."
    required: false
    default: embeddings
  fail-on:
    description: "Exit non-zero if any finding is at least this dangerous: high | medium | low | none."
    required: false
    default: high
  format:
    description: "Output format: text | json."
    required: false
    default: text
  spec:
    description: >-
      pip install spec for preflight, extras included. Defaults to the PyPI name with the embeddings
      extra. Until published, pass a VCS spec, e.g.
      'preflight-analytics[embeddings] @ git+https://github.com/d-n-ust/ai-analytics-harness@master#subdirectory=preflight'.
    required: false
    default: "preflight-analytics[embeddings]"
  python-version:
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install preflight
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "${{ inputs.spec }}"
    - name: Scan
      shell: bash
      run: >-
        preflight scan '${{ inputs.path }}'
        --gate '${{ inputs.gate }}'
        --fail-on '${{ inputs.fail-on }}'
        --format '${{ inputs.format }}'
