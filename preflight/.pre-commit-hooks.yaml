# pre-commit hook definition. Usable once preflight is its own repo:
#   repos:
#     - repo: https://github.com/d-n-ust/preflight-analytics
#       rev: v0.1.0
#       hooks: [{ id: preflight }]
# Defaults to the lexical gate so a local commit does not download torch; add the embeddings extra
# via additional_dependencies + `args: [--gate, embeddings]` when you want the validated gate.
- id: preflight
  name: preflight — analytics ambiguity scan
  description: Fail the commit when governed analytics definitions collide (cross-layer ambiguity).
  entry: preflight scan
  args: [".", "--gate", "lexical", "--fail-on", "high"]
  language: python
  pass_filenames: false
  require_serial: true
