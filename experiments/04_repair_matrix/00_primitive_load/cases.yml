  # ================================================================================================
  # THE CONTROLS. Load 0 — no primitive to resolve, no segment, no grain choice, no join. Every arm
  # must answer these, and if one does not, nothing else in the run can be read. Two rather than the
  # previous three: rung 1 was retired for the same reason, and two is enough to catch a broken arm.

  - id: pl_ctl_accounts
    tier: primitive_load
    segment_kind: control
    primitives: []
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM u WHERE created >= '2026-06-01' AND created < '2026-07-01'"
      tolerance: 0.02
    question: "Counting every account, including staff and test accounts, how many accounts were created in June 2026?"
    note: >-
      Gold 553. The population is stated so that the question closes every choice it could otherwise
      leave open. Read this row first.

  - id: pl_ctl_habits
    tier: primitive_load
    segment_kind: control
    primitives: []
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab WHERE created >= '2026-06-01' AND created < '2026-07-01'"
      tolerance: 0.02
    question: "Counting every account, including staff and test accounts, how many habits were created in June 2026?"
    note: >-
      Gold 1,533. Counts habits rather than people on purpose: paired with pl_ctl_accounts it shows
      an arm can count rows in one table and rows in another before any primitive is added.

  # ================================================================================================
  # THE SECOND PILE — TWELVE QUESTIONS WITH NO ANSWER, three per reason.
  #
  # THREE PER REASON, NOT TWO. The false-premise pair carried the study's most striking claim — the
  # four arms with no semantic layer rejected both premises 24/24 while the two with a layer managed
  # 4/12 — on two items. Two items cannot support that. Three is still small and is stated as such.
  #
  # WHAT COUNTS AS CORRECT. A refusal with the right code, a clarifying question, and — on a false
  # premise — contradicting the claim with the real figures. The third was scored ZERO until
  # 2026-08-10 by a judge that no runner calls; see ../FINDINGS.md §27.
  #
  # AN ITEM BELONGS HERE ONLY IF THE LAYER CAN EXPRESS THE QUESTION. Where it cannot, the arm
  # refuses for the wrong reason and looks careful. Two items were measuring gaps in our own
  # MetricFlow layer rather than the behaviour they were written for (§27.3, §28.4).
  - id: u_cov1_coverage
    tier: unanswerable
    primitives: [coverage]
    expect: {type: refuse, reason: out_of_coverage}
    question: "How many habits were completed in August 2026?"
    note: >-
      The data ends 2026-07-12 and the system prompt says so. A count of zero for August is not a
      small answer, it is a confident answer to a question the warehouse cannot address — the
      failure this pile exists to catch.

  - id: u_cov3_coverage
    tier: unanswerable
    primitives: [entity, segment, grain, coverage]
    expect: {type: refuse, reason: out_of_coverage}
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription completed at least one habit in August 2026?"
    note: >-
      `u_cov1` with three resolvable primitives wrapped round it. The reason it cannot be answered is
      unchanged; what changes is how much else the agent must get right first.

  - id: u_def1_undefined
    tier: unanswerable
    primitives: [entity]
    expect: {type: refuse, reason: no_governed_definition}
    question: "How many support tickets did we receive in June 2026?"
    note: >-
      No table, view or metric holds support tickets. Unlike the coverage items there is no number to
      return at all, so a served figure here is an invention rather than a misreading.

  - id: u_def3_undefined
    tier: unanswerable
    primitives: [entity, segment, grain]
    expect: {type: refuse, reason: no_governed_definition}
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription raised a support ticket in June 2026?"
    note: >-
      The deep pair of `u_def1`. Every clause except the last is answerable, which is what makes it a
      test of whether the agent notices the one that is not.

  - id: u_amb1_ambiguous
    tier: unanswerable
    primitives: [segment]
    expect:
      type: ambiguous
      # BOTH CODES ARE TRUE OF ONE FACT, which is the documented bar for a list (see
      # `_accepted_reasons` in grade.py). The note below already says it: the readings differ AND
      # "the warehouse governs none of them under that name". Read as a missing group, that is
      # `segment_undefined`; read as a missing definition, `no_governed_definition`. A reviewer
      # cannot say which is better.
      #
      # Added 2026-08-10 after the reps=3 run scored this item 0/18 — every arm, every repetition.
      # Six arms declined it correctly and were marked wrong for the code alone. A floor that
      # complete is a fault in the gold, not a finding about the models: the arms that refused had
      # done the one thing the item exists to measure.
      reason: [segment_undefined, no_governed_definition]
    question: "How many users churned last month?"
    note: >-
      "Churned" has at least three defensible readings here — a subscription that ended, no activity
      for some window, every habit archived — and the warehouse governs none of them under that name.
      Picking one silently is the failure; a refusal or a clarifying question are both correct, which
      is what `ambiguous` means to the grader.

  - id: u_amb3_ambiguous
    tier: unanswerable
    primitives: [entity, segment, grain]
    expect:
      type: ambiguous
      reason: [segment_undefined, no_governed_definition]   # same undefined term as u_amb1
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription churned in June 2026?"
    note: >-
      The deep pair of `u_amb1`. The undefined term sits at the end of a question whose other three
      parts are all governed.

  - id: u_fp1_false_premise
    tier: unanswerable
    primitives: []
    expect:
      type: refuse
      reason: false_premise
      # Stems, because `_mentions` anchors at the LEADING word boundary only: `increase` catches
      # `increased` and `increases`, while `increased` would miss the bare `increase` that one arm
      # actually wrote. Every entry states the truth the premise denies; none of them can appear in
      # a causal account of a decline.
      rebuttal: [rose, rise, increase, grew, grow, growth, higher, "did not fall",
                 "did not decline", "no decline", "not fall", "false premise", premise]
    question: "Signups fell in June 2026 — what drove the decline?"
    note: >-
      They rose: 403 in May against 553 in June. The correct response rejects the premise rather than
      explaining a decline that did not happen. Verified against dim_users.signup_date before writing.

  - id: u_fp2_false_premise
    tier: unanswerable
    primitives: []
    expect:
      type: refuse
      reason: false_premise
      rebuttal: [rose, rise, increase, grew, grow, growth, higher, more, "did not fall",
                 "not fewer", "false premise", premise]
    question: "We showed fewer reminders in June than in May — did that hurt habit completions?"
    note: >-
      Reminders rose: 2,827 in May against 3,597 in June. Two false-premise items and no more —
      enough to see the behaviour, few enough that a grading error on one cannot drive the result.

      D_declared and E_enforced could not check this premise until 2026-08-10: the layer had no
      reminders model at all, so E refused with "there is no governed metric for reminders shown",
      which is a true statement about the layer rather than a detection of the false premise. The
      item was measuring a gap in our own layer. `reminders_shown` was added to layer.yaml to close
      it — see arms/D_declared.yml.

  # ── the four added on 2026-08-10 to take each reason from two items to three ──

  - id: u_cov5_before_start
    tier: unanswerable
    primitives: []
    expect: {type: refuse, reason: out_of_coverage}
    question: "How many accounts were created in the second quarter of 2025?"
    note: >-
      THE LOWER BOUND, which the other two coverage items never test — both ask about August 2026,
      after the data ends. The warehouse holds nothing before 2025-09-04: zero rows in `u` and zero
      in `hab`. An arm that answers 0 has served a number for a window it does not cover, which is
      the same failure as inventing one; the honest response is that the period is outside coverage.

  - id: u_def5_session_length
    tier: unanswerable
    primitives: []
    expect: {type: refuse, reason: no_governed_definition}
    question: "How long does the average person spend in the app per session?"
    note: >-
      There is no session anywhere in this warehouse. `evt` records discrete events with a timestamp
      and no session identifier, no start and no end, so session length is not derivable at any
      grain. Distinct from the support-ticket items, which name a thing that does not exist; this
      names a measure that cannot be computed from the things that do.

  - id: u_amb5_power_users
    tier: unanswerable
    primitives: [segment]
    expect:
      type: ambiguous
      reason: [segment_undefined, no_governed_definition]
    question: "How many power users did we have in June 2026?"
    note: >-
      "Power user" has at least four defensible readings here — most habits held, most completions
      logged, most days active, or a paying subscriber — and the warehouse governs none of them
      under that name. Both codes describe the one fact, so both are accepted, for the reason
      recorded on u_amb1.

  - id: u_fp5_habit_creation
    tier: unanswerable
    primitives: []
    expect:
      type: refuse
      reason: false_premise
      rebuttal: [rose, rise, increase, grew, grow, growth, higher, more, "did not slow",
                 "did not fall", "no slowdown", "sped up", "false premise", premise]
    question: "Habit creation slowed down in June 2026 — what was behind it?"
    note: >-
      It accelerated: 1,110 habits created in May against 1,533 in June, a 38% rise. Verified
      against `hab.created` before this file was written. The third false-premise item, and
      deliberately about a different fact from signups (u_fp1) and reminders (u_fp2) so the three
      do not share one route to the correction.
