      gold_sql: "SELECT round(sum(m.mrr_amount),2) FROM _star.fct_subscription_months m JOIN u ON m.user_id = u.uid WHERE m.snapshot_month = DATE '2026-06-01' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "What was the monthly recurring revenue in June 2026? Do not count staff or test accounts."
    note: >-
      Gold 2,465.03. REBUILT ON A PERIODIC SNAPSHOT 2026-08-10. The first version asked the same
      question of `fct_subscriptions`, an accumulating snapshot whose time dimension is the date a
      term STARTED; monthly recurring revenue is a stock, so that table cannot answer it for a month
      and the layer advertised the illegal slice as a feature. E_enforced picked the right metric,
      added `period=last_week`, and returned 127.37 against a true book of 2,685.08. The item was
      measuring our modelling error. `fct_subscription_months` holds one row per subscription per
      month it was live, and the annual-over-twelve normalisation lives there once, at the grain
      where it is true. THE TRAP IS THE RUNG BELOW: summing the billed amounts on live terms gives
      10,795.42,
      which is an annual lump added to a monthly charge and sits far outside tolerance.
