# EXPERIMENT QUESTIONS — TWELVE FAMILIES OF THREE RUNGS, two controls, twelve with no answer.
#
# FIFTY ITEMS. The count is the design, and it changed on 2026-08-10 after a power analysis.
#
# WHY RUNG 1 IS GONE. Every arm scored 15/15 on the entity-only rung in every run: six warehouses,
# three runs, including the raw extract with no documentation at all. That is a finished measurement,
# not a weak one, and re-confirming it cost twelve items. Entity resolution is still exercised — it
# sits inside all three remaining rungs, because the ladder is cumulative — it is simply no longer
# measured alone. The two controls below hold the "an easy question is answered by everything" claim.
#
# WHY TWELVE FAMILIES AND NOT FIVE. McNemar's exact test on k discordant item pairs has a minimum
# two-sided p of 2 x 0.5^k. At five items per rung that floor is 0.0625: significance is UNREACHABLE
# even if one arm answers all five correctly and the other none. Six discordant pairs is the hard
# floor and discordance is a fraction of items, so twelve per rung is the minimum that can carry a
# separation claim at all. `../FINDINGS.md` §30.1 is the reason it matters — C_modelled, D_declared
# and E_enforced tie at 57 of 60, and a five-item rung cannot tell whether that tie is real.
#
# WHY REPETITIONS WERE TRADED FOR ITEMS. Repeat runs of one question are not independent
# observations: measured intraclass correlation is 0.30-0.43, so a third repetition buys about 40%
# of a new data point while a new item buys a whole one. At a fixed call budget, 15 items x 1 rep
# beats 5 items x 3 reps on the null band (26.7pp against 33.3pp). This file's previous header
# already argued exactly that and the run configuration contradicted it.
#
# THE SEGMENT RUNG IS FOUR MEASUREMENTS, NOT ONE. This is the structural change that matters most.
# A segment can be handed to the agent in words, or it can be a value the agent must repair, and
# those are different skills that were previously averaged into one score. The four kinds below are
# ordered by how much repair the value needs: stated, case, code, synonym. Report them separately.
#
# NESTING. Rung N is rung N-1 plus exactly one primitive, so the most likely wrong answer at each
# rung IS THE RUNG BELOW's GOLD and a failure names the step that caused it. Every gold below was
# executed against the warehouse before this file was written.
#
# NO CROSS-FAMILY COLLISIONS. All twelve families were checked pairwise on all three rungs: no two
# golds sit within the 2% tolerance of each other, so an agent that resolves the wrong family cannot
# score. Re-run that check after any warehouse reseed.

cases:

  # ================================================================================================
  # STATED SEGMENT. The question hands the filter over in words and the agent has only to apply
  # it. This kind measures instruction following, NOT value resolution. Its steps are the weakest
  # in the set (3.3-4.2%) because staff and test accounts are 3.4% of users, and that is a
  # property of the data rather than of the wording. Kept deliberately: the documentation finding
  # rests on having questions that do and do not name this exclusion.

  - id: pl_f_staff_segment
    tier: primitive_load
    segment_kind: stated
    primitives: [entity, segment]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h JOIN u ON h.uid = u.uid WHERE h.cat = 'fitness' AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "How many habits are in the fitness category? Count archived habits as well. Do not count staff or test accounts."
    note: >-
      Rung 2 of this family: entity + segment. Gold 1,183, executed against the warehouse before
      this file was written.

  - id: pl_f_staff_grain
    tier: primitive_load
    segment_kind: stated
    primitives: [entity, segment, grain]
