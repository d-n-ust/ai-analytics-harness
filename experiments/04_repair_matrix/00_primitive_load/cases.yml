    segment_kind: stated
    primitives: [entity, segment]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM subs s JOIN u ON s.uid = u.uid WHERE s.st = 1 AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "How many subscriptions are currently active? Do not count staff or test accounts."
    note: >-
      Rung 2: entity + segment. Gold 353.00. Counts subscription TERMS, not people. In this warehouse no one holds two live terms, so terms and subscribers coincide at 371 and this rung cannot detect a grain error — it is the base of the family, not a test of one.

