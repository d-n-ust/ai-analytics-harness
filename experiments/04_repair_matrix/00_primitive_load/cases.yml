  # ================================================================================================
  # FAMILY rv — REVENUE. Four families of three rungs, one per segment kind, added 2026-08-10.
  #
  # WHY IT EXISTS. Every other answerable item in this file is a COUNT. Not one asked the agent to
  # sum a money column, so `measure + aggregation` (primitive 3) and `additivity` (primitive 5) were
  # both unmeasured while the matrix claimed nine primitives. This family fills those two rows.
  #
  # WHY IT IS NOT A FIFTH RUNG ON THE HABIT FAMILIES. It was designed that way first and the design
  # was wrong. Those families define their population by HABIT, and the only aggregatable number in
  # the warehouse — `billed_amount` — sits on subscriptions, which carry no habit key. Aggregating a
  # subscription measure over a habit-defined population crosses a one-to-many join, which is a FAN
  # TRAP rather than an aggregation test: 43 users hold more than one term. The population here is
  # therefore defined on USER attributes only, where the grain is stable.
  #
  # THE LAYER HAD NO MONEY IN IT until this family was built. `layers/D_declared/layer.yaml`
  # modelled habits, reminders, referrals and value moments and no revenue, so a revenue question
  # would have measured our own omission — the failure recorded twice already in ../FINDINGS.md
  # §27.3 and §28.4. `billed_amount`, `total_billed` and a derived `mrr` were added first.

