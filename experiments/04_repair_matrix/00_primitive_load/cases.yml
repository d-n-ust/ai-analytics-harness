      gold_sql: "SELECT round(sum(s.amt),2) FROM subs s JOIN u ON s.uid = u.uid WHERE s.st = 1 AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email) LIKE '%@internal-test.com'))"
