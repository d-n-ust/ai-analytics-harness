    note: >-
      Rung 3: entity + segment + measure + aggregation. Gold 10,795.42. THE FIRST NUMBER IN THIS STUDY THAT IS NOT A COUNT. Every other item counts rows or people; this one sums a money column, which is a different decision and was untested until now. The likely wrong answer is the rung below's gold — a count of terms instead of a sum over them.

