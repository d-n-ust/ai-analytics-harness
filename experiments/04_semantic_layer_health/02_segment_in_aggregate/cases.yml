# EXPERIMENT QUESTIONS — not part of the frozen case set in evals/cases/.
#
# They live here so the frozen denominator never moves. The engine loads them through
# `load_questions(directory)`, the same validator the frozen set uses, so a malformed case fails
# before a token is spent rather than grading MISS in every arm for a reason nobody reads.
#
# WHAT THEY TEST. `power_users` counts users who logged 5+ value moments IN A SINGLE DAY. Both the
# threshold and its GRAIN are invisible unless somebody wrote them down, and the numbers make each
# one matter on its own:
#
#     5+ in a single day, last week    21      <- what the metric returns
#     5+ summed across the week       326      <- 15.5x, if the grain is misread
#     3+ in a single day, last week   337      <- 16.0x, if the threshold is misread
#     active_users, last week         886      <- the plausible wrong pick
#
# THE FIVE SLOTS, AND WHY EACH EARNS ONE. Three of the five can discriminate; two exist to make the
# other three readable. The set is built so that neither degenerate strategy can fake a good score:
#
#     always answer 21    q_thresh_day_week + q_thresh_named_week right, both traps confidently
#                         wrong at -4 each                                          -> 2/5
#     always refuse       both traps right, both answerable questions over-refused   -> 2/5
#     actually reads      all five                                                   -> 5/5
#
# That symmetry is the point. Experiment 1 had one discriminating question and no way to tell a
# careful arm from a timid one; here refusing everything and answering everything land on the same
# score by construction, so the middle is the only place a real difference can show up.
#
# EVERY QUESTION MUST BE ANSWERABLE IDENTICALLY IN ALL THREE ARMS — `check_same_numbers` enforces
# it before spending anything. Two are deliberately answerable in none of them.
#
# REFUSAL REASONS ARE WIDENED HERE, AND THAT NEEDS DEFENDING. `_accepted_reasons` treats a list as
# a loophole, so: this experiment manipulates whether a fact is LEGIBLE, and the outcome it needs
# is whether the agent DETECTED a mismatch. Categorising that mismatch is a separate skill —
# RefusalBench (arXiv 2510.10390) reports detection and categorization as separable, with frontier
# models under 50% on the second in grounded settings. Grading the code would import a large,
# treatment-irrelevant noise source into a three-item design. The same list applies to every arm.
#
# `segment_undefined` is deliberately NOT accepted, though "users with 3+ in a day is not a
# governed segment" is true. It is the code a model is likeliest to reach for in the `segment`
# arm and nowhere else, so accepting it would grade that arm on a vocabulary only it can see. Its
# absence biases AGAINST the arm predicted to win, which is the safe direction for a headline.
#
# PERIOD IS HELD CONSTANT ON PURPOSE. All four `power_users` questions ask about last week, so the
# only thing varying across them is the DEMAND — stated grain, misread grain, misread threshold,
# direct name. Robustness across periods is a real question and a separate run; the deterministic
# invariant already checks the layers themselves over three periods, which is where a period effect
# would show up as a defect rather than as noise.

cases:
  # --- 1 · the threshold and grain both stated: the answerable twin ------- #
  - id: q_thresh_day_week
    tier: threshold
    question: "How many users completed five or more habits in a single day last week?"
    expect:
      type: metric_answer
      metric: power_users
      gold_sql: "SELECT count(DISTINCT CASE WHEN a.moments >= 5 THEN a.user_id END) FROM agg_active_days a JOIN dim_users u USING(user_id) WHERE NOT u.is_internal AND a.active_date >= DATE '2026-07-06' AND a.active_date < DATE '2026-07-13'"
      tolerance: 0.02
    note: "The demand matches the metric exactly. In `absent` the catalogue says only 'highly-engaged', so nothing connects 'five or more' to power_users and active_users (886) is the plausible wrong pick. This is the twin that stops 'refuse everything' from scoring well on the traps."

  # --- 2 · the grain trap: right threshold, wrong grain ------------------- #
  - id: q_thresh_lower_bar
    tier: trap
    question: "How many users completed three or more habits in a single day last week?"
    expect:
      type: refuse
      reason: [wrong_measure, no_governed_definition]
      gold_sql: "SELECT count(DISTINCT CASE WHEN a.moments >= 3 THEN a.user_id END) FROM agg_active_days a JOIN dim_users u USING(user_id) WHERE NOT u.is_internal AND a.active_date >= DATE '2026-07-06' AND a.active_date < DATE '2026-07-13'"
    note: "The mirror of the grain trap, and the sharpest test of the binding hypothesis. `prose` carries '5+' on the metric's own line, so 5 != 3 is visible in one read. `segment` says only 'highly-engaged' on that line and puts '5+ value moments in a single day' in a GLOBAL segment list that never says which metric offers it — an agent that fails to bind them sees a metric with no stated threshold and has nothing to notice with. Serving 21 against a true 337 is confident_wrong."

  # --- 4 · the name matches directly: ceiling anchor ---------------------- #
  - id: q_thresh_named_week
    tier: anchor
    question: "How many power users did we have last week?"
    expect:
      type: metric_answer
      metric: power_users
      gold_sql: "SELECT count(DISTINCT CASE WHEN a.moments >= 5 THEN a.user_id END) FROM agg_active_days a JOIN dim_users u USING(user_id) WHERE NOT u.is_internal AND a.active_date >= DATE '2026-07-06' AND a.active_date < DATE '2026-07-13'"
      tolerance: 0.02
    note: "'power users' is a declared synonym in EVERY arm, so this should be right everywhere. An arm that misses it is broken rather than uninformative — read this row before any other."

  # --- 5 · control: must read the catalogue ------------------------------- #
  - id: q_control_paid_search
    tier: control
    question: "How much did we spend on paid search in June 2026?"
    expect:
      type: metric_answer
      metric: marketing_spend
      gold_sql: "SELECT round(sum(spend), 2) FROM fct_marketing_spend WHERE channel = 'paid_search' AND spend_date BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'"
      tolerance: 0.02
    note: "Untouched by every arm, and it CANNOT be answered off the tool schema — 'paid search' has to be resolved to the governed member `paid_search`, which only the catalogue carries. Experiment 1's control failed exactly here: `mrr` was nameable from the enum, so all four of its rows never read the catalogue at all and were counted anyway."
