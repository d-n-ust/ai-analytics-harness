# The repair: the threshold stops being arithmetic and becomes a named, governed segment.
#
# THE WORDING IS HELD CONSTANT ON PURPOSE. The segment's description is the same phrase the prose
# arm puts in the metric description — "5+ value moments in a single day" — so this arm moves the
# fact WITHOUT rewording it. That is the one comparison the first probe failed to make: its
# decisive arm gained new synonyms along with new structure, and the two can no longer be told
# apart in its results. `absent` and `segment` therefore carry the identical description, and only
# the location of the threshold differs between `prose` and `segment`.
#
# `default_segment` is why this is not a trap. Without it, a caller who names no segment would get
# `count(distinct user_id)` over everyone — 886 rather than 21 — so the repair would trade a hidden
# filter for a silently absent one and hand this arm a disadvantage no reader could see. The
# segment is constitutive of `power_users`, not optional, so the metric declares it and a bare
# call still means what it has always meant.
level: structural
claim: "the threshold is a declared, named segment rather than arithmetic"
patch:
  metrics.power_users.description: "Distinct highly-engaged real users in the period (excludes internal/test)."
  metrics.power_users.agg: "count(distinct user_id)"
  metrics.power_users.segments: [power]
  metrics.power_users.default_segment: power
  governance.segments.power:
    # NO synonyms. The phrase below is lifted verbatim out of the prose arm's description, so the
    # catalogue's total vocabulary is identical across arms and only its LOCATION moves. A synonym
    # list here would be new wording that exists in no other arm — which is the exact confound that
    # cost experiment 1 its headline, reintroduced by the file meant to avoid it.
    description: "5+ value moments in a single day"
    where: ["moments >= 5"]
