# EXPERIMENT QUESTIONS — FIVE NESTED LADDERS of four rungs, plus three controls.
#
# TWENTY-THREE ITEMS. The count is the design. One question per rung made a rung's score three
# repetitions of a single item, which measures the noise inside that item rather than the effect
# across items; three per rung produced a readable curve on gpt-5-mini and left one family of three
# carrying no signal. Five families give five observations per load level, and at reps=1 that is a
# 92-call run — the budget goes to items, which is where the effect lives, and not to repetitions,
# which estimate the noise inside one.
#
# THE HYPOTHESIS. If each primitive is resolved independently with probability p, an n-primitive
# question succeeds at p^n, so the gap between a documented and an undocumented warehouse widens
# superlinearly with n. Measured on the three-family set: 0, 0, 0, +22, +56 pp by load. See
# FINDINGS.md §9.
#
# EACH LADDER IS NESTED — rung N is rung N-1 plus exactly one primitive — so the most likely wrong
# answer at each rung IS THE RUNG BELOW'S GOLD, and a failure names the step that caused it. Every
# gold below was executed against the warehouse before this file was written.
#
#     family                                L1      L2      L3      L4   smallest step
#     h  habits still tracked            6,357   6,147   2,321     382       3.3%
#     a  habits archived                 1,110   1,074     868     125       3.2%
#     r  activated referrals               266     254     236      36       4.5%
#     w  finance habits · web platform   1,236     374     306      49      18%
#     c  mindfulness habits · Germany    1,267     221     171      34      23%
#
# WHY THE TWO NEW FAMILIES STEP SO MUCH HARDER. Families h, a and r segment on staff-and-test
# accounts, which is 3.4% of users — so their segment rung barely moves the number, and the measured
# A-to-B gap at load 2 was +0 pp on both models. That is a property of the data, not of the wording.
# Families w and c segment on an enum recorded in several spellings instead: `u.plat` holds three
# platforms in nine spellings with 72 NULLs, `u.ctry` holds DE beside de. An arm that matches one
# spelling returns 114 where the gold is 390. Both defects are real, both are documented in
# warehouse/docs/messy_load.sql, and neither was invented for this study.
#
# THE PAIR THAT DEFEATS A FIXED STRATEGY: family a is family h with the NULL polarity inverted, on
# the same column. An arm that has learned `IS NULL` as a reflex answers one and misses the other.
#
# A FAMILY WAS BUILT AND CUT — the annual-plan ladder on `subs`, whose rungs stepped 5.3%, 2.5% and
# 2.5%. A 2.5% step against a 2% tolerance is a coin toss. `subs` has too few users holding several
# terms for the grain rung to bite.
#
# GRADEABILITY. Every item is one number from one terminal call. No item asks for a breakdown as
# well as a total; ../05_additivity lost nine runs to a question shaped that way.
#
# VOCABULARY. Business words only — never `arch`, `cat`, `plat`, `ctry`, `internal`, `subs`, `uid`,
# `distinct`, `row`. The audit's longest span must be short and equal across arms.
#
# THE CONTROLS ARE THE ROWS TO READ FIRST. One table, one date column, one row per thing, nothing
# coded and nothing to join. Two of them state the population because their two readings sit 2.5%
# and 2.8% apart, which is outside the tolerance — a control an arm can lose by making a defensible
# choice is not a control, and that is exactly what this study's first control was.
#
# POWER. 23 items, 20 of them on the ladder, 5 per load level. Still a pilot: the measured noise
# floor is 13% of cells and the smallest detectable difference at this size is far above the
# per-rung differences. The SHAPE of the curve across five load levels is the claim, not any single
# rung's rate.

cases:

  # ══ family h · habits still tracked ══
  - id: pl_h1_entity
    tier: primitive_load
    primitives: [entity]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h WHERE h.arch IS NULL"
      tolerance: 0.02
    question: "How many habits have not been archived?"
    note: >-
      True 6,357. `hab.arch` holds an archive date and is NULL while the habit is still tracked, so absence of a value is the fact; counting every row gives 7,467. This is ../01_entity's `e_ent_active_habits`, on which A_implicit scores 3/3, which is what gives the ladder headroom.
  - id: pl_h2_segment
    tier: primitive_load
    primitives: [entity, segment]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many habits have not been archived?"
    note: >-
      True 6,147. Dropping the population gives 6,357 — this family's L1 gold.
  - id: pl_h3_grain
    tier: primitive_load
    primitives: [entity, segment, grain]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many people have at least one habit they have not archived?"
    note: >-
      True 2,321. One row is one habit and a person keeps several, so counting rows returns 6,147, L2's gold.
  - id: pl_h4_join_path
    tier: primitive_load
    primitives: [entity, segment, grain, join_path]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com')) AND h.uid IN (SELECT uid FROM subs)"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription have at least one habit they have not archived?"
    note: >-
      True 382. Dropping the subscription condition gives 2,321 (L3's gold); counting habits rather than people gives 1,042; joining to the subscription table rather than testing membership gives 1,151, because 43 users hold more than one term.

  # ══ family a · habits archived — the inverse of h ══
  - id: pl_a1_entity
    tier: primitive_load
    primitives: [entity]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h WHERE h.arch IS NOT NULL"
      tolerance: 0.02
    question: "How many habits have been archived?"
    note: >-
      True 1,110. The inverse of h1 on the same column, so an arm that has learned `IS NULL` as a reflex rather than as a meaning answers one of the pair and misses the other. This is the pair that defeats a fixed-polarity strategy.
  - id: pl_a2_segment
    tier: primitive_load
    primitives: [entity, segment]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NOT NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many habits have been archived?"
    note: >-
      True 1,074. Dropping the population gives 1,110.
  - id: pl_a3_grain
    tier: primitive_load
    primitives: [entity, segment, grain]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NOT NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many people have archived at least one habit?"
    note: >-
      True 868. Counting rows returns 1,074, L2's gold.
  - id: pl_a4_join_path
    tier: primitive_load
    primitives: [entity, segment, grain, join_path]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NOT NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com')) AND h.uid IN (SELECT uid FROM subs)"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription have archived at least one habit?"
    note: >-
      True 125. Dropping the subscription condition gives 868.

  # ══ family r · activated referrals ══
  - id: pl_r1_entity
    tier: primitive_load
    primitives: [entity]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM ref r WHERE r.st = 'activated'"
      tolerance: 0.02
    question: "How many referrals reached the activated stage?"
    note: >-
      True 266. `ref.st` carries readable stages — pending, joined, activated — so this is deliberately the easiest entity rung in the set. A base rung the undocumented arm cannot do leaves the ladder no headroom, which is how the first build of this study failed.
  - id: pl_r2_segment
    tier: primitive_load
    primitives: [entity, segment]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM ref r JOIN u ON r.referred = u.uid WHERE r.st = 'activated' AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "How many referrals reached the activated stage where the person who was referred is not a staff or test account?"
    note: >-
      True 254. NAMES WHICH SIDE OF THE REFERRAL the population applies to. `ref` carries two user columns, so 'excluding staff and test accounts' alone has two readings and would measure ambiguity rather than segment resolution.
  - id: pl_r3_grain
    tier: primitive_load
    primitives: [entity, segment, grain]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT r.referrer) FROM ref r JOIN u ON r.referred = u.uid WHERE r.st = 'activated' AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "Counting each referrer once, how many different people have made a referral that reached the activated stage where the person referred is not a staff or test account?"
    note: >-
      True 236. Only 19 referrers made more than one activated referral, so the step is 7.1% — the tightest grain step in the set, and clear of the 2% tolerance. Counting rows returns 254.
  - id: pl_r4_join_path
    tier: primitive_load
    primitives: [entity, segment, grain, join_path]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT r.referrer) FROM ref r JOIN u ON r.referred = u.uid WHERE r.st = 'activated' AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com')) AND r.referrer IN (SELECT uid FROM subs)"
      tolerance: 0.02
    question: "Counting each referrer once, how many different people who have ever had a paid subscription themselves have made a referral that reached the activated stage where the person referred is not a staff or test account?"
    note: >-
      True 36. Dropping the subscription condition gives 236.

  # ══ family w · fitness habits on the web platform ══
  - id: pl_w1_entity
    tier: primitive_load
    primitives: [entity]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h WHERE h.cat = 'finance'"
      tolerance: 0.02
    question: "Counting archived ones as well, how many habits are in the finance category?"
    note: >-
      True 1,236. `hab.cat` carries readable category names, so the entity rung is easy by design. CATEGORY CHANGED FROM `fitness` TO `finance` after run 20260809-212756: `hab.cat` holds both `fitness` and `health`, and the arm read "fitness" as a topic — `cat IN ('fitness','health','exercise') OR nm LIKE '%fitness%'` — answering 774 against a gold of 390. `finance` has no near-synonym in the column. The wording also now closes the archive status, which the first version left open.
  - id: pl_w2_segment
    tier: primitive_load
    primitives: [entity, segment]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h JOIN u ON h.uid = u.uid WHERE h.cat = 'finance' AND lower(u.plat) = 'web'"
      tolerance: 0.02
    question: "Counting archived ones as well, how many finance habits belong to people using the web platform?"
    note: >-
      True 374. THE SEGMENT IS AN ENUM RECORDED IN NINE SPELLINGS: web, Web and WEB are one platform, and 72 rows are NULL. An arm matching a single spelling returns 96 — 3.90x from the gold. This is the strongest segment rung in the set; the staff-exclusion families step only 3.2% here, because internal accounts are 3.4% of users, and that is a property of the data rather than of the questions.
  - id: pl_w3_grain
    tier: primitive_load
    primitives: [entity, segment, grain]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.cat = 'finance' AND lower(u.plat) = 'web'"
      tolerance: 0.02
    question: "How many people using the web platform have at least one finance habit, archived or not?"
    note: >-
      True 306. Counting habits rather than people returns 374.
  - id: pl_w4_join_path
    tier: primitive_load
    primitives: [entity, segment, grain, join_path]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.cat = 'finance' AND lower(u.plat) = 'web' AND h.uid IN (SELECT uid FROM subs)"
      tolerance: 0.02
    question: "How many people using the web platform who have ever had a paid subscription have at least one finance habit, archived or not?"
    note: >-
      True 49. Dropping the subscription condition gives 306.

  # ══ family c · learning habits in Germany ══
  - id: pl_c1_entity
    tier: primitive_load
    primitives: [entity]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h WHERE h.cat = 'mindfulness'"
      tolerance: 0.02
    question: "Counting archived ones as well, how many habits are in the mindfulness category?"
    note: >-
      True 1,267. A second readable-category entity rung, on a different category from w1 so the two families share no question. CHANGED FROM `learning` TO `mindfulness` alongside w's change, and the archive status is closed in the wording.
  - id: pl_c2_segment
    tier: primitive_load
    primitives: [entity, segment]
    # `segment` here includes resolving Germany to DE. The country-code vocabulary is documented in
    # warehouse/docs/*.sql, so the documented arms are told and the implicit arm must discover it by
    # inspecting values — which is what a segment rung IS when the population is named in business
    # terms and stored as a code.
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h JOIN u ON h.uid = u.uid WHERE h.cat = 'mindfulness' AND upper(u.ctry) = 'DE'"
      tolerance: 0.02
    question: "Counting archived ones as well, how many mindfulness habits belong to people in Germany?"
    note: >-
      True 221. TWO THINGS AT ONCE, and the first was undeclared until run 20260809-212756 exposed it. The question names a country and the column holds an ISO code: three arms filtered `ctry = 'Germany'` and returned 0. That mapping is now DOCUMENTED — warehouse/docs/messy_load.sql and star_schema.sql both list DE = Germany — so it is a fact the documented arms are told and the implicit arm must find by inspecting values, which is what a segment rung is when a population is named in business terms and stored as a code. The casing defect is the second: DE and de are one country.
  - id: pl_c3_grain
    tier: primitive_load
    primitives: [entity, segment, grain]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.cat = 'mindfulness' AND upper(u.ctry) = 'DE'"
      tolerance: 0.02
    question: "How many people in Germany have at least one mindfulness habit, archived or not?"
    note: >-
      True 171. Counting habits rather than people returns 221.
  - id: pl_c4_join_path
    tier: primitive_load
    primitives: [entity, segment, grain, join_path]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.cat = 'mindfulness' AND upper(u.ctry) = 'DE' AND h.uid IN (SELECT uid FROM subs)"
      tolerance: 0.02
    question: "How many people in Germany who have ever had a paid subscription have at least one mindfulness habit, archived or not?"
    note: >-
      True 34. Dropping the subscription condition gives 171.

  # ══ controls · load 0 ══
  - id: pl_c1_accounts
    tier: primitive_load
    primitives: []
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM u WHERE CAST(u.created AS DATE) BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'"
      tolerance: 0.02
    question: "How many accounts were created in June 2026?"
    note: >-
      True 553. Excluding staff and test accounts gives 543 — 0.98x, inside the tolerance — so both defensible readings grade correct and the wording needs no population clause.
  - id: pl_c2_habits
    tier: primitive_load
    primitives: []
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h WHERE CAST(h.created AS DATE) BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'"
      tolerance: 0.02
    question: "Counting every account, including staff and test accounts, how many habits were created in June 2026?"
    note: >-
      True 1,533. The population IS stated, because excluding staff gives 1,495 — 2.5% away and outside the tolerance. 'Counting every account' asks the arm to do nothing rather than to look something up, so the item stays at load 0.
  - id: pl_c3_subs
    tier: primitive_load
    primitives: []
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM subs s WHERE CAST(s.start AS DATE) BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'"
      tolerance: 0.02
    question: "Counting every account, including staff and test accounts, how many subscriptions started in June 2026?"
    note: >-
      True 106. Same reason: excluding staff gives 103, 2.8% away.

  # ══ THE SECOND PILE · questions with no answer ══════════════════════════════════════════════ #
  #
  # WHY THEY EXIST. Every item above is answerable, so "always answer" is a strategy that scores.
  # ../../.claude/experts/harness-eval-items.md puts it plainly: without the pair, both "always
  # refuse" and "always answer" score, and the set measures a disposition rather than an
  # understanding. Eight of thirty-one items — 26% — is enough to punish always-answering and not
  # enough for always-refusing to win.
  #
  # WHAT THIS MAKES MEASURABLE. `evals/selective.py` already implements the four numbers an agent
  # with a reject option is judged on, and until now this study could compute none of them, because
  # they all need both piles:
  #
  #     coverage           of the answerable pile, how much did it attempt
  #     silent_error       of everything, how often was it wrong while looking right
  #     balanced_accuracy  the mean of the two piles' accuracies — immune to the question mix
  #     grounded_answers   NOT AVAILABLE HERE: it needs the claims protocol, which this study runs
  #                        with off on purpose, because switching it on changes the tool surface for
  #                        D and E alone. Four metrics here, five elsewhere.
  #
  # THE SHALLOW/DEEP PAIRS ASK SOMETHING NOBODY HAS MEASURED. Each reason appears twice: once bare,
  # once wrapped in three primitives the agent CAN resolve. `u_cov1` and `u_cov3` are unanswerable
  # for exactly the same reason. If refusal degrades with load, that says complexity does not only
  # make an agent wrong — it stops the agent noticing it should stop.
  #
  # ONE REASON WAS DESIGNED AND CUT. `ungoverned_dimension_value` — "how many accounts in Japan",
  # where Japan has zero rows. Under the closed-world assumption every warehouse makes, absence of a
  # row means false, so ZERO IS THE CORRECT ANSWER and refusing is over-caution. The item would have
  # measured an assumption we have never stated rather than the agent. `ambiguous` replaces it: the
  # grader accepts a refusal OR a clarifying question there, so the code-choice risk is gone by
  # construction.
  #
  # COVERAGE IS FAIR ACROSS ARMS. Every arm's system prompt opens "Today is 2026-07-16; data is
  # complete through 2026-07-12", so no arm is asked to know something only some of them are told.

  - id: u_cov1_coverage
    tier: unanswerable
    primitives: [coverage]
    expect: {type: refuse, reason: out_of_coverage}
    question: "How many habits were completed in August 2026?"
    note: >-
      The data ends 2026-07-12 and the system prompt says so. A count of zero for August is not a
      small answer, it is a confident answer to a question the warehouse cannot address — the
      failure this pile exists to catch.

  - id: u_cov3_coverage
    tier: unanswerable
    primitives: [entity, segment, grain, coverage]
    expect: {type: refuse, reason: out_of_coverage}
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription completed at least one habit in August 2026?"
    note: >-
      `u_cov1` with three resolvable primitives wrapped round it. The reason it cannot be answered is
      unchanged; what changes is how much else the agent must get right first.

  - id: u_def1_undefined
    tier: unanswerable
    primitives: [entity]
    expect: {type: refuse, reason: no_governed_definition}
    question: "How many support tickets did we receive in June 2026?"
    note: >-
      No table, view or metric holds support tickets. Unlike the coverage items there is no number to
      return at all, so a served figure here is an invention rather than a misreading.

  - id: u_def3_undefined
    tier: unanswerable
    primitives: [entity, segment, grain]
    expect: {type: refuse, reason: no_governed_definition}
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription raised a support ticket in June 2026?"
    note: >-
      The deep pair of `u_def1`. Every clause except the last is answerable, which is what makes it a
      test of whether the agent notices the one that is not.

  - id: u_amb1_ambiguous
    tier: unanswerable
    primitives: [segment]
    expect:
      type: ambiguous
      # BOTH CODES ARE TRUE OF ONE FACT, which is the documented bar for a list (see
      # `_accepted_reasons` in grade.py). The note below already says it: the readings differ AND
      # "the warehouse governs none of them under that name". Read as a missing group, that is
      # `segment_undefined`; read as a missing definition, `no_governed_definition`. A reviewer
      # cannot say which is better.
      #
      # Added 2026-08-10 after the reps=3 run scored this item 0/18 — every arm, every repetition.
      # Six arms declined it correctly and were marked wrong for the code alone. A floor that
      # complete is a fault in the gold, not a finding about the models: the arms that refused had
      # done the one thing the item exists to measure.
      reason: [segment_undefined, no_governed_definition]
    question: "How many users churned last month?"
    note: >-
      "Churned" has at least three defensible readings here — a subscription that ended, no activity
      for some window, every habit archived — and the warehouse governs none of them under that name.
      Picking one silently is the failure; a refusal or a clarifying question are both correct, which
      is what `ambiguous` means to the grader.

  - id: u_amb3_ambiguous
    tier: unanswerable
    primitives: [entity, segment, grain]
    expect:
      type: ambiguous
      reason: [segment_undefined, no_governed_definition]   # same undefined term as u_amb1
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription churned in June 2026?"
    note: >-
      The deep pair of `u_amb1`. The undefined term sits at the end of a question whose other three
      parts are all governed.

  - id: u_fp1_false_premise
    tier: unanswerable
    primitives: []
    expect:
      type: refuse
      reason: false_premise
      # Stems, because `_mentions` anchors at the LEADING word boundary only: `increase` catches
      # `increased` and `increases`, while `increased` would miss the bare `increase` that one arm
      # actually wrote. Every entry states the truth the premise denies; none of them can appear in
      # a causal account of a decline.
      rebuttal: [rose, rise, increase, grew, grow, growth, higher, "did not fall",
                 "did not decline", "no decline", "not fall", "false premise", premise]
    question: "Signups fell in June 2026 — what drove the decline?"
    note: >-
      They rose: 403 in May against 553 in June. The correct response rejects the premise rather than
      explaining a decline that did not happen. Verified against dim_users.signup_date before writing.

  - id: u_fp2_false_premise
    tier: unanswerable
    primitives: []
    expect:
      type: refuse
      reason: false_premise
      rebuttal: [rose, rise, increase, grew, grow, growth, higher, more, "did not fall",
                 "not fewer", "false premise", premise]
    question: "We showed fewer reminders in June than in May — did that hurt habit completions?"
    note: >-
      Reminders rose: 2,827 in May against 3,597 in June. Two false-premise items and no more —
      enough to see the behaviour, few enough that a grading error on one cannot drive the result.

      D_declared and E_enforced could not check this premise until 2026-08-10: the layer had no
      reminders model at all, so E refused with "there is no governed metric for reminders shown",
      which is a true statement about the layer rather than a detection of the false premise. The
