# EXPERIMENT QUESTIONS — a NESTED LADDER of four, one rung per primitive, plus a control.
#
# REBUILT 2026-08-09 after the first run. FINDINGS.md §2-3 records what was wrong with the first
# set and both defects are fixed here rather than argued away:
#
#   the control was not a control    `spend.chan` spells one channel four ways, so the question
#                                    tested enum resolution — a primitive, and the very one the
#                                    documented arm is handed. A_implicit scored 0/3 on it.
#   the ladder started on the floor  it was built on `evt.etype`, which A_implicit cannot resolve
#                                    at all: 0/3 at L1, with no room left for a gap to widen.
#
# WHY THIS LADDER SITS ON `hab` AND `subs`. Reading ../01_entity per item shows exactly which
# primitives the undocumented arm can and cannot do:
#
#     a NULL that means "still active"   (hab.arch)     3/3
#     a status code that means "live"    (subs.st)      3/3
#     which of three event kinds         (evt.etype)    0-1/3
#
# The base rung must be a primitive the undocumented arm resolves MOST of the time, or the effect
# this study exists to measure has nowhere to appear. L1 below is `../01_entity`'s own
# `e_ent_active_habits`, on which A_implicit scored 3/3 — so the ladder starts at the top and has
# somewhere to fall.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THE HYPOTHESIS. If each primitive is resolved independently with probability p, an n-primitive
# question succeeds at p^n, so the gap between a documented and an undocumented warehouse widens
# superlinearly with n. At n=4 the predicted gap reaches the 59-63pp this design can actually
# detect (../FINDINGS.md §2), which makes depth a cheaper route out of the power problem than
# thirty more single-primitive items.
#
# THE LADDER IS NESTED, and that is what makes a failure attributable. Each item is the previous
# plus exactly one primitive, so the most likely wrong answer at each rung IS THE PREVIOUS RUNG'S
# GOLD — verified against the data, not assumed:
#
#     L1  entity / NULL semantics    6,357     archived counted too ->  7,467
#     L2  + segment                  6,147     segment ignored      ->  6,357   <- L1's gold
#     L3  + grain                    2,321     grain ignored        ->  6,147   <- L2's gold
#     L4  + join path                  382     join ignored         ->  2,321   <- L3's gold
#
# An arm that answers 2,321 at L4 has resolved three primitives and lost the fourth. Every
# degenerate strategy at every rung was checked against the 2% tolerance before this file was
# written; the closest is 1.03x and it clears.
#
# A COMPOSITION RUNG WAS DESIGNED AND CUT, and the reason is worth keeping: its traps landed at
# 22.4%, 22.7%, 23.0% and 24.8%. A ratio divides the error into both numerator and denominator, so
# three of four missed primitives would have graded CORRECT.
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# VOCABULARY. Business words only. Never `arch`, `internal`, `subs`, `uid`, `distinct`, `row`.
# "Archived" appears in the `hab.arch` comment, so the documented arm has a lexical match on L1 —
# accepted because ../01_entity's undocumented arm already scores 3/3 there, which shows the word
# is not carrying the answer.
#
# THE CONTROL IS THE ROW TO READ FIRST. One table, one date column, one row per account, no coded
# value and nothing to join. It is also safe under BOTH readings: counting every account gives 553
# and excluding staff gives 543, which is 0.98x and inside the tolerance — so an arm cannot lose it
# by making a defensible choice. That property is what the previous control lacked.

cases:

  # --- L1 · entity / NULL semantics -------------------------------------------------------- #
  - id: pl_l1_entity
    tier: primitive_load
    primitives: [entity]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h WHERE h.arch IS NULL"
      tolerance: 0.02
    question: "How many habits have not been archived?"
    note: >-
      True 6,357. `hab.arch` holds an archive date and is NULL while the habit is still tracked, so
      absence of a value is the fact. Counting every row gives 7,467. Identical to
      ../01_entity's `e_ent_active_habits`, deliberately: A_implicit scores 3/3 on it, which is what
      gives this ladder headroom.

  # --- L2 · + segment ---------------------------------------------------------------------- #
  - id: pl_l2_segment
    tier: primitive_load
    primitives: [entity, segment]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many habits have not been archived?"
    note: >-
      True 6,147. Ignoring the population gives 6,357 — L1's gold. The staff flag is 0, 1 or NULL,
      and 271 NULLs include internal accounts identifiable only by their email domain, so the
      segment is not a single equality test.

  # --- L3 · + grain ------------------------------------------------------------------------ #
  - id: pl_l3_grain
    tier: primitive_load
    primitives: [entity, segment, grain]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com'))"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many people have at least one habit they have not archived?"
    note: >-
      True 2,321. One row is one habit and a person keeps several, so counting rows answers L2's
      question instead — 6,147, 2.65x. "How many people" against L2's "how many habits" is the whole
      treatment of this rung.

  # --- L4 · + join path -------------------------------------------------------------------- #
  - id: pl_l4_join
    tier: primitive_load
    primitives: [entity, segment, grain, join_path]
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(DISTINCT h.uid) FROM hab h JOIN u ON h.uid = u.uid WHERE h.arch IS NULL AND NOT ((coalesce(u.internal,0) = 1) OR (lower(u.email) LIKE '%@internal-test.com')) AND h.uid IN (SELECT uid FROM subs)"
      tolerance: 0.02
    question: "Excluding staff and test accounts, how many people who have ever had a paid subscription have at least one habit they have not archived?"
    note: >-
      True 382. Four ways to be wrong, each the failure of one named primitive: dropping the
      subscription condition gives 2,321 (L3's gold), counting habits rather than people gives
      1,042, joining to the subscription table rather than testing membership gives 1,151 because
      43 users hold more than one term, and ignoring the archive rule gives 393.

  # --- the control ------------------------------------------------------------------------- #
  - id: pl_control_signups
    tier: primitive_load
    primitives: []
    expect:
      type: metric_answer
      no_governed_metric: true
      gold_sql: "SELECT count(*) FROM u WHERE CAST(u.created AS DATE) BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'"
      tolerance: 0.02
    question: "How many accounts were created in June 2026?"
    note: >-
      True 553. One table, one date column, one row per account, no coded value, nothing to join.
      Excluding staff and test accounts gives 543 — 0.98x, inside the tolerance — so both defensible
      readings grade correct and no arm can lose this row by making a reasonable choice. It must be
      flat across every arm and every model tier; if it moves, nothing else in the set can be read.
