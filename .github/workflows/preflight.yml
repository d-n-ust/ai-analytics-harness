name: preflight

# preflight lives outside the uv workspace and is extraction-ready, so it carries its own CI:
# lint + type-check + test on every push/PR that touches it. The install is core + dev tools only
# (no sentence-transformers, no torch), which also keeps CI fast and proves detection needs no heavy
# deps. On extraction to its own repo this file moves to that repo's .github/workflows/ unchanged
# except for dropping the `preflight/` path scoping and working-directory.
on:
  push:
    paths: ["preflight/**", ".github/workflows/preflight.yml"]
  pull_request:
    paths: ["preflight/**", ".github/workflows/preflight.yml"]

defaults:
  run:
    working-directory: preflight

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync (core + dev tools, no torch)
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy src/preflight

      - name: Test (pytest)
        run: uv run pytest -q
