    category: "labor tagged to worked store, headcount to home store"
    confusable_because: "Hours are recorded against the worked location_id while employees carry a home store_id; the docs warn headcount-by-store and hours-by-store will not agree. A store-productivity number can mix home-store headcount with worked-store hours."
    detectability: invisible
    danger: medium
    uncertain: false

  # ============================ TIME / CALENDAR ============================

  - id: fiscal_period_vs_calendar_month
    items:
      - {ref: "dim_date.fiscal_period / fiscal_week / fiscal_year", layer: warehouse, where: "dim_date"}
      - {ref: "Data dictionary header", layer: docs, where: "'period means a fiscal period, not a calendar month; retail 4-5-4'"}
      - {ref: "inventory_turns", layer: semantic, where: "metrics (grain: month)"}
    category: "'period'/'month' as fiscal vs calendar"
    confusable_because: "The docs insist 'period' is a fiscal 4-5-4 period, not a calendar month, yet semantic metrics use grain: month and grain: day on calendar dates with no fiscal grain exposed. A monthly aggregation lands on calendar months while reporting is on fiscal periods, shifting week boundaries and period totals."
    detectability: invisible
    danger: medium
    uncertain: false
