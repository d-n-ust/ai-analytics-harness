    items:
      - {ref: "pos_line_items.qty / unit_price / extended_price / line_amount", layer: warehouse, where: "pos_line_items"}
      - {ref: "fct_transaction_lines.quantity / unit_retail / extended_retail", layer: docs, where: "line docs"}
      - {ref: "merch_sales / units_sold / units", layer: semantic, where: "metrics (ext_ring_amt, quantity, qty)"}
    category: "line quantity and amount have four names across layers"
    confusable_because: "The scanned quantity is qty (schema), quantity (docs), qty and quantity (both in fct_sales_line), and the line amount is extended_price / line_amount (schema, two columns), extended_retail (docs), ext_ring_amt (semantic). An agent picks a name and may hit a differently-computed column (pre- vs post-discount)."
    detectability: invisible
    danger: high
    uncertain: false

  - id: extended_price_vs_line_amount
    items:
      - {ref: "pos_line_items.extended_price / line_amount", layer: warehouse, where: "pos_line_items (both present)"}
      - {ref: "fct_sales_line.extended_price / line_amount / gross_sales / net_sales", layer: warehouse, where: "fct_sales_line (four money columns)"}
      - {ref: "fct_transaction_lines.extended_retail", layer: docs, where: "quantity*unit_retail BEFORE line discount"}
    category: "line dollar value: extended (pre-discount) vs line_amount (post-discount)"
    confusable_because: "extended_price/extended_retail is quantity*price before line discount, while line_amount is presumably after discount, and both sit on the same line table; fct_sales_line adds gross_sales and net_sales too. Line-level 'sales' can be any of four columns differing by discount treatment."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: dual_measure_columns_pick_wrong
    items:
      - {ref: "fct_sales_line.qty / quantity", layer: warehouse, where: "fct_sales_line (both)"}
      - {ref: "fct_orders.gross_sales / net_sales / amount", layer: warehouse, where: "fct_orders (three money columns)"}
      - {ref: "fct_inventory_daily.on_hand / qty_on_hand", layer: warehouse, where: "fct_inventory_daily (both)"}
    category: "duplicated measure columns invite picking an unpopulated twin"
    confusable_because: "Fact tables carry duplicate columns (qty and quantity; on_hand and qty_on_hand; gross_sales, net_sales, and amount). If only one twin is populated or they are computed differently, choosing the other silently changes the number with no error."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: status_value_settled_vs_completed
    items:
      - {ref: "v_settled_transactions / v_net_sales", layer: warehouse, where: "VIEWS (WHERE txn_status='settled' / status='settled')"}
      - {ref: "fct_transactions.status", layer: docs, where: "enum completed/voided/suspended/training; count uses status='completed'"}
      - {ref: "pos_transactions.txn_status", layer: warehouse, where: "pos_transactions"}
    category: "'settled' vs 'completed' as the good-transaction status value"
    confusable_because: "The views filter status='settled' but the dictionary enum and the transaction-count definition use status='completed' (no 'settled' value is documented). An agent filtering 'completed' against a view built on 'settled' (or vice versa) can return empty or mismatched sets."
    detectability: invisible
    danger: high
    uncertain: false

  - id: void_exclusion_mechanisms
    items:
      - {ref: "pos_transactions.txn_status / void_flag", layer: warehouse, where: "pos_transactions (status enum AND boolean)"}
      - {ref: "fct_transactions.status", layer: warehouse, where: "fct_transactions (status only, no void_flag)"}
      - {ref: "baskets", layer: semantic, where: "metrics (base pos_line_items, no void filter)"}
    category: "voids excluded via status vs void_flag vs not at all"
    confusable_because: "Voided baskets can be dropped by txn_status, by void_flag, or by fct status, and pos_line_items has its own void_flag; the baskets metric applies none. Depending on which mechanism a query uses, voids are in or out, changing counts and sums."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: discount_vs_markdown_reduces_sales
    items:
      - {ref: "pos_transactions.discount_amount", layer: warehouse, where: "pos_transactions"}
      - {ref: "pos_line_items.markdown_amount", layer: warehouse, where: "pos_line_items"}
      - {ref: "online_orders.discount_total / online_order_lines.line_discount", layer: warehouse, where: "online tables"}
      - {ref: "fct_coupon_redemptions.discount_value", layer: docs, where: "coupon amount off"}
    category: "discount vs markdown vs coupon: which reduction hits sales"
    confusable_because: "Register discounts (discount_amount, already in the rung price), post-sale markdowns (markdown_amount, subtracted from net), coupons (discount_value), and online discounts are separate reductions. net_sales subtracts markdowns but not register discounts; conflating them double-counts or omits a reduction when reconstructing net."
    detectability: invisible
    danger: medium
    uncertain: false

  # ============================ LABOR ============================

  - id: labor_hours_vs_hours_worked
    items:
      - {ref: "labor_hours.hours / hours_worked", layer: warehouse, where: "labor_hours (both columns)"}
      - {ref: "fct_labor_hours", layer: docs, where: "hours = paid; hours_worked excludes breaks; productivity uses hours_worked"}
    category: "paid hours vs hours worked"
    confusable_because: "labor_hours carries both hours (paid) and hours_worked (excludes breaks). Sales-per-labor-hour uses net/hours_worked in ops but gross/hours in store-ops, so productivity differs by which hours column and which sales basis."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: labor_hours_three_sources
    items:
      - {ref: "store_sales_daily.labor_hours", layer: warehouse, where: "store_sales_daily (a labor column on the sales table)"}
      - {ref: "labor_hours", layer: warehouse, where: "labor_hours table"}
      - {ref: "fct_labor_hours", layer: docs, where: "one row per employee per shift"}
    category: "labor hours live in three places"
    confusable_because: "Labor hours appear on the legacy store_sales_daily table, in the labor_hours table, and as fct_labor_hours in the docs. The three need not reconcile, so 'labor hours' for a store can differ by source."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: labor_location_vs_home_store
    items:
