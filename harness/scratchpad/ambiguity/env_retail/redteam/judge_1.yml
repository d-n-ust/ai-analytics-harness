    detectability: loud
    danger: low
    uncertain: false

  # ============================ CROSS-LAYER / STATUS / SYSTEMIC ============================

  - id: table_name_mismatch_systemic
    items:
      - {ref: "pos_line_items / pos_transactions / online_orders / suppliers", layer: warehouse, where: "schema.sql table names"}
