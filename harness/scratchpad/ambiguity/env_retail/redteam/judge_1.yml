  # ============================ LOYALTY ============================

  - id: member_populations_four_metrics
    items:
      - {ref: "loyalty_members", layer: semantic, where: "metrics (description 'Enrolled', but counts all member_id rows)"}
      - {ref: "enrolled_members", layer: semantic, where: "metrics (filter enrolled=true)"}
      - {ref: "active_members", layer: semantic, where: "metrics (90-day purchase)"}
      - {ref: "member_count", layer: semantic, where: "metrics (count_distinct customer_id)"}
      - {ref: "Members / active members / enrolled", layer: docs, where: "three populations quoted interchangeably"}
    category: "member vs active member vs enrolled: four metrics, three populations, mislabeled"
    confusable_because: "loyalty_members is described as 'Enrolled' yet counts every account (broadest), colliding with the distinct enrolled_members metric; member_count counts customer_id (different cardinality than member_id); active_members is a fourth. 'How many members?' resolves to any of four very different numbers."
    detectability: invisible
    danger: high
    uncertain: false

  - id: active_member_window_90_vs_365
    items:
      - {ref: "active_members", layer: semantic, where: "metrics (last 90 days)"}
