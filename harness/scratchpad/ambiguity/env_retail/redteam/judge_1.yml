# Red-team panel — Judge 1 (retail-finance data auditor, 20y)
# Company: Harborstone Market. Cold read of BRIEF / schema.sql / data_dictionary.md / semantic_layer.yml.
# Goal: colliding / confusable groundings where an agent can produce a believable-but-wrong number,
# or get different answers depending on which artifact/column/metric it reads.

findings:

  # ============================ SALES / REVENUE ============================

  - id: sales_gross_vs_net
    items:
      - {ref: "gross_sales", layer: semantic, where: "metrics"}
      - {ref: "net_sales", layer: semantic, where: "metrics"}
      - {ref: "fct_transactions.gross_sales", layer: docs, where: "Transactions, baskets & online orders"}
      - {ref: "fct_transactions.net_sales", layer: docs, where: "Transactions, baskets & online orders"}
    category: "gross vs net 'sales' collision"
    confusable_because: "The bare word 'sales' resolves to Merchandising gross (before returns/markdowns, ex-tax) or Finance net (of returns, markdowns, tax). Both are first-class metrics named 'sales'; an agent asked 'what were sales?' picks one and is silently on the wrong basis, off by returns+markdowns+tax."
    detectability: invisible
    danger: high
    uncertain: false

  - id: semantic_net_sales_tax_treatment
    items:
      - {ref: "net_sales", layer: semantic, where: "metrics (expr gross_amt - return_amt - markdown_amt)"}
      - {ref: "net_sales_finance", layer: semantic, where: "metrics (net of returns, markdowns AND sales tax)"}
      - {ref: "fct_transactions.net_sales", layer: docs, where: "net of tax; older partitions have tax folded in"}
    category: "net sales: is tax in or out (and time-dependent)"
    confusable_because: "Semantic net_sales subtracts returns and markdowns but NOT tax; net_sales_finance also subtracts tax; the dictionary says net_sales is net of tax except in pre-summer-refactor partitions where tax is folded in. Three different net figures for one name, and the correct one depends on the partition date. Trailing-year comparisons drift by the tax rate."
    detectability: invisible
    danger: high
    uncertain: false

  - id: gross_from_pos_total_taxin
    items:
      - {ref: "pos_transactions.total", layer: warehouse, where: "pos_transactions (has total, net_sales, tax_amount; NO gross column)"}
      - {ref: "gross_sales", layer: semantic, where: "metrics (measure gross_amt, base pos_transactions)"}
      - {ref: "fct_transactions.tax_amount", layer: docs, where: "gross_sales + tax_amount is roughly what the customer paid"}
    category: "no gross column in raw POS; 'total' is tax-inclusive"
    confusable_because: "The gross_sales metric is based on pos_transactions with measure gross_amt, but pos_transactions has no gross/gross_amt column — only total (tax-in) and net_sales. An agent grounding gross to pos_transactions.total returns a tax-INCLUSIVE figure, contradicting the tax-exclusive gross definition, inflating 'sales' by the tax rate."
    detectability: invisible
    danger: high
    uncertain: false

  - id: gross_sales_no_status_filter
    items:
      - {ref: "gross_sales", layer: semantic, where: "metrics (base pos_transactions, no status/void filter)"}
      - {ref: "fct_transactions.status", layer: docs, where: "completed/voided/suspended/training; training must be excluded"}
      - {ref: "pos_transactions.void_flag", layer: warehouse, where: "pos_transactions"}
    category: "headline sales metric does not exclude void/suspended/training"
    confusable_because: "The gross_sales metric applies no status or void filter, so voided, suspended, and register-training baskets are summed into 'sales.' The dictionary says these must be excluded and the count metric filters status='completed', so the dollar metric and the count metric disagree on which baskets are real."
    detectability: invisible
    danger: high
    uncertain: false

  - id: store_ops_sales_tax_in
    items:
      - {ref: "retail_sales", layer: semantic, where: "metrics (measure sales_amount, base store_ops_daily)"}
      - {ref: "store_ops.daily_sales.sales", layer: docs, where: "Legacy store-ops; sales INCLUDES sales tax"}
      - {ref: "store_sales_daily.sales", layer: warehouse, where: "store_sales_daily (raw/source)"}
    category: "legacy store-ops sales is tax-inclusive and reconciles to nothing"
    confusable_because: "The long-watched leadership 'sales by store' number (retail_sales / store_ops.daily_sales.sales / store_sales_daily.sales) is gross rung tax-IN, which ties neither to fct_transactions.gross_sales (tax-out) nor to net. An agent that pulls the familiar store-ops feed reports a number several percent above the POS-model gross."
    detectability: invisible
    danger: high
    uncertain: false

  - id: store_sales_name_collision
    items:
      - {ref: "store_sales", layer: semantic, where: "metrics (gross_amt, filter channel='store')"}
      - {ref: "retail_sales", layer: semantic, where: "metrics (store-ops daily feed)"}
      - {ref: "store_sales_daily", layer: warehouse, where: "raw/source table"}
    category: "three 'store sales' groundings"
    confusable_because: "'Store sales' matches the store_sales metric (POS gross filtered to channel='store', tax-out), the retail_sales metric (legacy store-ops, tax-in), and the store_sales_daily raw table. Different bases and tax treatments; the agent chooses by name similarity."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: revenue_multiple_candidates
    items:
      - {ref: "total_revenue", layer: semantic, where: "metrics (measure revenue, base fct_sales, filter order_status='completed')"}
      - {ref: "net_sales_finance", layer: semantic, where: "metrics"}
      - {ref: "Revenue — Finance default", layer: docs, where: "Business metrics & definitions"}
    category: "'revenue' has several conflicting definitions"
    confusable_because: "Revenue maps to total_revenue (a metric on base fct_sales — which is not in the schema — with measure revenue that exists on no table, filtered order_status='completed'), to net_sales_finance, or to the dictionary 'Revenue = net sales + recognized online revenue.' The candidates use different bases and the total_revenue definition cannot be executed against the warehouse as written."
    detectability: loud
    danger: high
    uncertain: false

  - id: total_revenue_online_status_never_completed
    items:
      - {ref: "total_revenue", layer: semantic, where: "metrics (entity order, filter order_status='completed')"}
      - {ref: "fct_online_orders.order_status", layer: docs, where: "cart/placed/picking/fulfilled/cancelled/refunded; revenue filters to fulfilled"}
      - {ref: "online_orders.order_status", layer: warehouse, where: "order_status VARCHAR(30)"}
    category: "revenue filter value that no online row can satisfy"
    confusable_because: "total_revenue is an order-entity metric filtered order_status='completed', but online orders never carry status 'completed' — the enum is cart/placed/picking/fulfilled/cancelled/refunded and revenue is recognized at 'fulfilled.' The filter silently returns zero online rows, so 'total revenue' undercounts online to nothing while looking valid."
    detectability: invisible
    danger: high
    uncertain: false

  - id: merch_sales_vs_gross_sales
    items:
      - {ref: "merch_sales", layer: semantic, where: "metrics (line level, measure ext_ring_amt, base pos_line_items)"}
      - {ref: "gross_sales", layer: semantic, where: "metrics (transaction level, base pos_transactions)"}
    category: "line-level vs transaction-level 'merchandise sales'"
    confusable_because: "merch_sales and gross_sales both claim 'merchandise rung at the register' but sum different grains (line extended-ring vs transaction gross) from different tables. They should tie yet will not (line markdown/discount handling differs), so 'merch sales' can be answered two ways."
    detectability: invisible
    danger: medium
    uncertain: false

  # ============================ MARGIN ============================

  - id: margin_which_cost
    items:
      - {ref: "gross_margin_pct", layer: semantic, where: "metrics (uses landed_cost)"}
      - {ref: "margin_standard", layer: semantic, where: "metrics (uses std_cost)"}
      - {ref: "dim_product cost columns", layer: docs, where: "landed_cost (finance) / standard_cost (merch) / last_cost (deals)"}
    category: "gross margin depends on which of three costs"
    confusable_because: "Margin is computed on landed (Finance), standard (Merch), or last (deal reports) cost, giving three different margins. gross_margin_pct hardcodes landed, margin_standard uses standard; an agent asked 'gross margin' picks one and silently reports Finance's or Merch's number, which never agree."
    detectability: invisible
    danger: high
    uncertain: false

  - id: gross_margin_pct_num_denom_mismatch
    items:
      - {ref: "gross_margin", layer: semantic, where: "metrics (expr ext_ring_amt - ext_cost; which cost is ext_cost?)"}
      - {ref: "gross_margin_pct", layer: semantic, where: "metrics (numerator ext_ring_amt - landed*qty over net_sales_amt)"}
    category: "margin percent mixes gross ring numerator with net-sales denominator"
    confusable_because: "gross_margin_pct puts gross ring less landed cost over NET sales, so the percent is not the gross_margin dollars divided by any consistent sales base. gross_margin dollars use an unspecified ext_cost. The two margin metrics do not compose, and the percent is inflated by the gross-over-net mismatch."
    detectability: invisible
    danger: high
    uncertain: false

  - id: precomputed_margin_columns
    items:
      - {ref: "store_sales_daily.gross_margin", layer: warehouse, where: "store_sales_daily (raw), exposed by v_comp_store_sales"}
      - {ref: "fct_sales_line.gross_margin", layer: warehouse, where: "fct_sales_line (mart)"}
      - {ref: "gross_margin", layer: semantic, where: "metrics (computed)"}
    category: "pre-computed margin dollars of unknown cost basis"
    confusable_because: "gross_margin exists as a stored column on the legacy daily table and on fct_sales_line, and also as a computed semantic metric. The stored columns' cost basis (landed/standard/last) is undocumented, so reading the column versus recomputing the metric can disagree without any error surfacing."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: fct_sales_line_three_costs
    items:
      - {ref: "fct_sales_line.unit_cost / landed_cost / standard_cost", layer: warehouse, where: "fct_sales_line (mart)"}
      - {ref: "fct_inventory_daily.unit_cost / standard_cost", layer: warehouse, where: "fct_inventory_daily"}
    category: "three cost columns on one fact line"
    confusable_because: "The sales fact line carries unit_cost, landed_cost, and standard_cost side by side. Any margin query must choose one; picking unit_cost (last PO cost, drifts) versus landed versus standard changes COGS and margin on the same rows."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: null_cost_100pct_margin
    items:
      - {ref: "dim_product cost columns", layer: docs, where: "null cost coalesced to 0 -> ~100% margin on new items"}
      - {ref: "Gross margin", layer: docs, where: "Business metrics & definitions"}
    category: "null cost coalesced to zero inflates margin"
    confusable_because: "Cost columns can be null on new/one-off SKUs and the margin models coalesce null to 0, showing ~100% margin. An agent reporting category margin will read a cost-gap spike as a real margin win."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: markup_vs_margin
    items:
      - {ref: "Markup", layer: docs, where: "Business metrics & definitions"}
      - {ref: "Gross margin", layer: docs, where: "Business metrics & definitions"}
    category: "markup and margin used interchangeably"
    confusable_because: "'Markup' ((retail-cost)/cost) and 'margin' ((sales-cost)/sales) are said interchangeably in merch conversations but have different denominators. A target phrased as one could be computed as the other."
    detectability: loud
    danger: low
    uncertain: true

  # ============================ COMP / SAME-STORE ============================

  - id: comp_flag_column_sprawl
    items:
      - {ref: "store_sales_daily.is_comp / store_sales_daily.comp_flag", layer: warehouse, where: "store_sales_daily (two comp columns on one table: CHAR 'Y' vs BOOLEAN)"}
      - {ref: "stores.comparable / dim_store.is_comparable", layer: warehouse, where: "stores, dim_store"}
      - {ref: "fct_transactions.is_comp / online_orders.is_comp", layer: warehouse, where: "fct_transactions, online_orders"}
      - {ref: "dim_store.comp_flag", layer: docs, where: "Stores, regions & banners"}
    category: "the comparable-store flag has six names (and two on one table)"
    confusable_because: "Comp is stored as is_comp (CHAR 'Y'), comp_flag (BOOLEAN), comparable, and is_comparable across tables — and store_sales_daily carries BOTH is_comp and comp_flag, which can disagree. An agent filtering 'comp stores' must guess the column, and the raw daily table offers two that may not match."
    detectability: invisible
    danger: high
    uncertain: false

  - id: comp_definition_three_rules
    items:
      - {ref: "Comparable-store sales (comp / same-store)", layer: docs, where: "Business metrics (Finance 13 periods / Merch 12 months / Ops 52 weeks + no remodel)"}
      - {ref: "dim_store.comp_flag", layer: docs, where: "Set true after 13 full fiscal periods (Finance rule)"}
    category: "comparable-store qualification has three incompatible rules"
    confusable_because: "Finance (13 fiscal periods, follows comp_flag), Merchandising (12 months open), and the ops scorecard (52 weeks and no remodel/relocation) each define comp differently, so the comp base differs by rule. The dictionary explicitly declines to resolve it; the agent will silently adopt whichever flag or metric it finds."
    detectability: loud
    danger: high
    uncertain: false

  - id: comp_metrics_gross_vs_net_disagree
    items:
      - {ref: "comparable_store_sales", layer: semantic, where: "metrics (gross_amt, filter months_open>=13)"}
      - {ref: "same_store_sales", layer: semantic, where: "metrics (net expr, segment comp_stores/comp_flag)"}
      - {ref: "comp_sales", layer: semantic, where: "metrics (gross, comp_flag=1 AND months_open>=12)"}
    category: "four comp metrics, different populations and different sales basis"
    confusable_because: "Three comp metrics (plus v_comp_store_sales) each pick a different store qualifier AND a different sales basis: comparable_store_sales on gross with months>=13, same_store_sales on net with comp_flag, comp_sales on gross with comp_flag AND months>=12. Comp is normally reported on net, so two of these are on the wrong basis, and all three cover different store sets."
    detectability: invisible
    danger: high
    uncertain: false

  - id: comp_months_vs_periods
    items:
      - {ref: "comparable_store_sales", layer: semantic, where: "metrics (description '13 months', filter store.months_open >= 13)"}
      - {ref: "dim_store.comp_flag", layer: docs, where: "13 full FISCAL PERIODS, open before start of prior fiscal year"}
    category: "13 calendar months implemented for a 13-fiscal-period rule"
    confusable_because: "The metric labelled the Finance comp rule filters on months_open>=13 (calendar months), while the Finance rule is 13 fiscal periods (open before the prior fiscal year began). With a 4-5-4 calendar these are not the same span, so the metric admits or excludes stores the flag would not."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: comp_sales_over_restrictive
    items:
      - {ref: "comp_sales", layer: semantic, where: "metrics (comp_flag=1 AND store.months_open >= 12)"}
      - {ref: "Comparable-store sales", layer: docs, where: "Finance vs Merch rules"}
    category: "comp_sales conjoins two rules, matching neither"
    confusable_because: "comp_sales requires comp_flag=1 (Finance) AND months_open>=12 (Merch) together, which is stricter than either rule alone and excludes stores that either team would count as comp. An agent using 'comp_sales' reports a smaller base than any real definition."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: comp_segments_two
    items:
      - {ref: "comparable_stores", layer: semantic, where: "segments (filter store.months_open >= 13)"}
      - {ref: "comp_stores", layer: semantic, where: "segments (filter store.comp_flag = 1)"}
    category: "two 'comparable stores' segments with different filters"
    confusable_because: "Both segments mean 'comparable stores' but one filters on months_open>=13 and the other on comp_flag=1. Applying 'the comparable stores segment' yields different populations depending on which is chosen."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: v_net_sales_hidden_comp_filter
    items:
      - {ref: "v_net_sales", layer: warehouse, where: "VIEWS (WHERE status='settled' AND is_comp=true)"}
      - {ref: "net_sales", layer: semantic, where: "metrics"}
    category: "a 'net sales' view silently restricted to comp stores"
    confusable_because: "v_net_sales is named for net sales but its WHERE clause restricts to is_comp=true and status='settled', so it returns comp-only net sales. An agent that treats v_net_sales as total net sales drops every non-comp store with no visible signal."
    detectability: invisible
    danger: high
    uncertain: false

  - id: comp_views_use_different_flags
    items:
      - {ref: "v_comp_store_sales", layer: warehouse, where: "VIEWS (store_sales_daily WHERE is_comp='Y')"}
      - {ref: "v_net_sales", layer: warehouse, where: "VIEWS (fct_transactions WHERE is_comp=true)"}
    category: "two comp views filter different comp columns on different tables"
    confusable_because: "v_comp_store_sales filters store_sales_daily.is_comp='Y' (legacy daily, gross tax-in) while v_net_sales filters fct_transactions.is_comp=true (POS mart, net). 'Comp sales' from these two views differs by table, basis, and which comp flag was used."
    detectability: invisible
    danger: medium
    uncertain: false

  # ============================ UNITS / BASKETS / TRANSACTIONS ============================

  - id: transactions_vs_transaction_count
    items:
      - {ref: "transactions", layer: semantic, where: "metrics (count_distinct transaction_id)"}
      - {ref: "transaction_count", layer: semantic, where: "metrics (count txn_id, non-distinct)"}
      - {ref: "pos_transactions.transaction_id / txn_id", layer: warehouse, where: "pos_transactions (BIGINT PK and separate VARCHAR txn_id)"}
    category: "two transaction-count metrics on two different id columns"
    confusable_because: "transactions counts distinct transaction_id; transaction_count does a plain count of txn_id (a different, non-unique VARCHAR id). If txn_id repeats or is null the two metrics diverge, and 'transaction count' can be answered either way."
    detectability: invisible
    danger: high
    uncertain: false

  - id: baskets_vs_transactions_grain
    items:
      - {ref: "baskets", layer: semantic, where: "metrics (count_distinct basket_id on pos_line_items)"}
      - {ref: "transactions", layer: semantic, where: "metrics (count_distinct transaction_id on pos_transactions)"}
      - {ref: "fct_transactions", layer: docs, where: "'Basket and transaction used interchangeably'"}
    category: "basket count at line grain vs transaction count at header grain"
    confusable_because: "baskets is counted from pos_line_items (which has no void filter) while transactions is counted from pos_transactions (voids/suspended excluded). Although the docs say basket=transaction, the two counts come from different tables with different exclusions and will not match."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: units_two_metrics_wrong_base
    items:
      - {ref: "units_sold", layer: semantic, where: "metrics (description 'all channels', measure quantity, base pos_line_items)"}
      - {ref: "units", layer: semantic, where: "metrics (measure qty, model fct_sales, filter line_type='sale')"}
    category: "two unit metrics, different bases/columns, and a mislabeled scope"
    confusable_because: "units_sold is described as 'across all channels' but its base is pos_line_items (in-store only, so online units are missing); units uses a different column (qty) on a base (fct_sales) that is not in the schema. The two 'units' answers differ and one silently omits online."
    detectability: invisible
    danger: high
    uncertain: false

  - id: units_weighed_pounds_mixed
    items:
      - {ref: "fct_transaction_lines", layer: docs, where: "weighed items carry weight (pounds) in quantity, not eaches"}
      - {ref: "units_sold", layer: semantic, where: "metrics (sum quantity)"}
      - {ref: "Units", layer: docs, where: "Business metrics; unit counts blend eaches and pounds"}
    category: "summing quantity mixes pounds and pieces"
    confusable_because: "For produce/deli/bulk, quantity holds pounds, not a count. Every units metric sums quantity blindly, so 'units sold' overstates item count by folding in weights, invisibly."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: basket_size_dollars_vs_items
    items:
      - {ref: "fct_transactions.basket_size", layer: warehouse, where: "fct_transactions (NUMERIC column of unstated meaning)"}
      - {ref: "average_basket_value", layer: semantic, where: "metrics (dollars)"}
      - {ref: "items_per_basket", layer: semantic, where: "metrics (units per basket)"}
      - {ref: "Average basket / average transaction value", layer: docs, where: "'basket size' means dollars OR items"}
    category: "'basket size' is dollars or items, plus a raw column of unknown units"
    confusable_because: "The docs admit 'basket size' means average dollars (average_basket_value) to some and units-per-basket (items_per_basket) to others, and fct_transactions carries a literal basket_size column whose unit (dollars or items) is unstated. 'Basket size went up' cannot be grounded reliably."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: aov_mislabeled_and_overlapping
    items:
      - {ref: "aov", layer: semantic, where: "metrics (sum net_sales_amt / count distinct transaction_id, base pos_transactions)"}
      - {ref: "average_basket_value", layer: semantic, where: "metrics (average of basket_total)"}
      - {ref: "average_order_value", layer: semantic, where: "metrics (average order_total, fct_online_orders)"}
    category: "'AOV' names an in-store net average; three overlapping average metrics"
    confusable_because: "aov ('average order value') actually computes in-store net sales over POS transactions, not online order value; average_order_value is the real online metric; average_basket_value uses a basket_total column and gross basis. The dictionary also splits merch (gross/txn) vs finance (net/txn) averages. Four crossed definitions for 'average basket/order.'"
    detectability: invisible
    danger: high
    uncertain: false

  # ============================ ONLINE / CHANNEL ============================

  - id: online_counts_as_transactions_or_not
    items:
      - {ref: "fct_transactions", layer: docs, where: "'blended all-channel view unions online in; some counts include web and some do not'"}
      - {ref: "transactions", layer: semantic, where: "metrics (POS base only)"}
      - {ref: "Transactions & baskets", layer: docs, where: "'whether online orders are added depends on the view'"}
    category: "online orders sometimes counted as transactions, sometimes not"
    confusable_because: "A blended all-channel transactions view exists alongside the POS-only fct_transactions, so transaction counts include or exclude web depending on the source. An agent cannot tell whether its transaction total already contains online."
    detectability: invisible
    danger: high
    uncertain: false

  - id: channel_column_phantom_on_pos
    items:
      - {ref: "store_sales", layer: semantic, where: "metrics (filter channel='store' on pos_transactions)"}
      - {ref: "store_channel / online_channel", layer: semantic, where: "segments (filter channel=...)"}
      - {ref: "channel", layer: semantic, where: "dimensions (expr channel, no source)"}
      - {ref: "pos_transactions", layer: warehouse, where: "pos_transactions has no channel column"}
    category: "channel filters/segments reference a column POS lacks"
    confusable_because: "store_sales, the store/online segments, and the channel dimension all filter on channel, but pos_transactions has no channel column (the dimension names no source). The filter is unresolvable against POS, so an agent may silently drop the filter (returning all channels) or error, and results diverge from any channel-scoped intent."
    detectability: loud
    danger: high
    uncertain: false

  - id: online_status_filter_missing
    items:
      - {ref: "online_sales", layer: semantic, where: "metrics (order_total, filter channel='online', no status filter)"}
      - {ref: "fct_online_orders.order_status", layer: docs, where: "revenue filters to 'fulfilled'; cart rows are never money"}
    category: "online sales metric includes carts, cancelled and refunded orders"
    confusable_because: "online_sales sums order_total with no order_status filter, so abandoned carts, cancelled and refunded orders are counted as sales; the dictionary says revenue must be restricted to fulfilled. Online sales are overstated by non-revenue statuses."
    detectability: invisible
    danger: high
    uncertain: false

  - id: online_gross_after_substitution
    items:
      - {ref: "fct_online_orders", layer: docs, where: "online gross_sales captured AFTER substitutions/out-of-stocks resolved"}
      - {ref: "fct_transactions.gross_sales", layer: docs, where: "merchandise rung at register"}
    category: "online gross is fulfilled-basis, POS gross is rung-basis"
    confusable_because: "Online gross_sales reflects what was actually fulfilled (post-substitution), while POS gross is what was rung. Summing them as one 'gross sales' blends two different capture points; ordered-vs-fulfilled and lost-sales analysis needs raw."
    detectability: invisible
    danger: medium
    uncertain: false

  # ============================ INVENTORY ============================

  - id: inventory_three_numbers
    items:
      - {ref: "inventory_on_hand", layer: semantic, where: "metrics (on_hand_qty)"}
      - {ref: "inventory_available", layer: semantic, where: "metrics (on_hand_qty - reserved_qty)"}
      - {ref: "Inventory position (on-hand / available / owned)", layer: docs, where: "three inventory numbers; owned = on_hand + in_transit (or + on_order)"}
    category: "on-hand vs available vs owned inventory"
    confusable_because: "Inventory reads three ways (on-hand physical, available = on-hand minus reserved, owned = on-hand plus in-transit/on-order). Only on-hand and available exist as metrics; 'owned' has no metric and two competing formulas. An unqualified 'inventory' number can differ substantially by which is meant."
    detectability: invisible
    danger: high
    uncertain: false

  - id: on_hand_dual_columns
    items:
      - {ref: "inventory_snapshot.on_hand / qty_on_hand", layer: warehouse, where: "inventory_snapshot (two on-hand columns)"}
      - {ref: "fct_inventory_daily.on_hand / qty_on_hand", layer: warehouse, where: "fct_inventory_daily (two on-hand columns)"}
      - {ref: "inventory_on_hand", layer: semantic, where: "metrics (measure on_hand_qty, a third name)"}
    category: "on-hand stored under two column names (and a third in semantic)"
    confusable_because: "Both inventory tables carry on_hand AND qty_on_hand; the semantic metric measures on_hand_qty (matching neither exactly). If the two stored columns are not kept identical, on-hand totals differ by which column is summed, with no error."
    detectability: invisible
    danger: medium
