    category: "store identified by store_id / store_code / store_number / legacy 3-letter code"
    confusable_because: "The warehouse key is store_id, the spoken id is a four-digit store_number (which the schema does not actually have — it has store_code), and the legacy store-ops list uses three-letter codes joined by an incomplete crosswalk. Resolving a store the user names by number/code can hit the wrong or no row."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: online_store_9999_counting
    items:
      - {ref: "dim_store", layer: docs, where: "web has synthetic store_number 9999 in some rollups, excluded in others"}
      - {ref: "stores", layer: warehouse, where: "~80 physical stores"}
    category: "online included as store 9999 or excluded; store counts move"
    confusable_because: "The web channel appears as a synthetic store 9999 in some rollups and is omitted in others, so 'number of stores' and per-store denominators change by report. An agent computing an average-per-store can divide by the wrong store count."
    detectability: invisible
    danger: medium
    uncertain: false

