    confusable_because: "Banner (HM/HX/HG) and format are distinct but 'the Express banner' and 'the express format' are used interchangeably, and HG spans two footprints where only the larger is a superstore. Grouping by banner vs format gives different cuts, and the format dimension references a column (format) that is named store_format."
