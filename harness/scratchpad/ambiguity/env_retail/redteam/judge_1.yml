      - {ref: "dim_department", layer: docs, where: "category strings on dim_product 'supposed to match' but merch renames faster than updates"}
    category: "category strings on products drift from the hierarchy table"
    confusable_because: "The docs say category/subcategory strings on dim_product are supposed to match dim_department but do not, and to trust distinct data values over the written list. Grouping by category can split or merge categories differently than the hierarchy, so category totals are unstable."
