    confusable_because: "The docs warn that a 'by region' report may be grouping on district (14 districts) and mislabeling it region. The region dimension also references region_name, which the schema does not have (the column is region). Grouping intent and column can both be wrong."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: banner_vs_format
    items:
      - {ref: "banner", layer: semantic, where: "dimensions (expr banner)"}
      - {ref: "store_format", layer: semantic, where: "dimensions (expr format — schema column is store_format)"}
