    items:
      - {ref: "dim_store.region", layer: docs, where: "historically 5 regions; really 6 after Inland split (Inland/High Desert); many dashboards still 5"}
      - {ref: "region", layer: semantic, where: "dimensions (expr region_name, source dim_store)"}
    category: "region is five or six values depending on vintage"
    confusable_because: "Region was five, is now six (Inland split into Inland and High Desert), but many dashboards still roll to the old five. A 'by region' breakout can silently merge High Desert into Inland, and totals-by-region depend on which taxonomy was used."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: region_vs_district_mislabel
    items:
      - {ref: "region", layer: semantic, where: "dimensions (expr region_name — schema column is region, no region_name)"}
      - {ref: "dim_store.region / dim_store.district", layer: docs, where: "'by region' may actually group on district; ops weekly mislabels it"}
