    confusable_because: "The same 'store' concept appears as store_id, location_id (both on dim_store), site_id, fulfillment_store, and home_store across tables; the semantic layer adds store/location/site/market dims, two sourced from a dim_location that is not in the schema. Joining or grouping 'by store' on the wrong key mismatches rows."
    detectability: invisible
    danger: high
    uncertain: false

