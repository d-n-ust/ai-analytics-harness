    confusable_because: "Merch counts active as a purchase in the trailing 90 days; Finance/CRM use 12 months, giving roughly double. The metric hardcodes 90 days, so the Finance active count is unavailable and 'active members' silently reports the merch (smaller) figure."
    detectability: invisible
    danger: high
    uncertain: false

  - id: active_members_phantom_column
    items:
      - {ref: "active_members", layer: semantic, where: "metrics (filter last_purchase_date >= -90d, base loyalty_members)"}
      - {ref: "loyalty_members", layer: warehouse, where: "has active_flag/enrolled_flag/member_status, NO last_purchase_date"}
      - {ref: "dim_member.last_transaction_date", layer: docs, where: "column is last_transaction_date"}
    category: "active_members filters a date column that does not exist under that name"
    confusable_because: "active_members filters last_purchase_date, but loyalty_members has no such column and the documented one is last_transaction_date. The filter cannot be executed as written; a substitution (e.g. active_flag, which defaults to active) yields a completely different count."
    detectability: loud
    danger: high
    uncertain: false

  - id: enrolled_definition_three_ways
    items:
      - {ref: "enrolled_members", layer: semantic, where: "metrics (filter enrolled=true, model dim_member)"}
      - {ref: "loyalty_members.enrolled_flag", layer: warehouse, where: "loyalty_members"}
      - {ref: "dim_member.status", layer: docs, where: "'enrolled' = marketing_optin=true AND valid email"}
    category: "'enrolled' means a flag, or optin+email, or loosely 'members'"
    confusable_because: "enrolled_members filters enrolled=true (schema column is enrolled_flag), but the CRM definition of enrolled is marketing_optin=true with a valid email — a narrower, different population — and the word is also used loosely for all members. Three enrolled counts."
    detectability: invisible
    danger: high
    uncertain: false

  - id: v_active_members_flag_based
    items:
      - {ref: "v_active_members", layer: warehouse, where: "VIEWS (active_flag=true AND enrolled_flag=true)"}
      - {ref: "active_members", layer: semantic, where: "metrics (90-day purchase)"}
      - {ref: "dim_member.status", layer: docs, where: "active = recent transaction (90d/12m)"}
    category: "a third 'active members' definition (flag-based, no time window)"
    confusable_because: "v_active_members defines active by active_flag AND enrolled_flag, with no recency window, while the metric uses 90-day purchase and the docs use 90d/12m transaction. Since active_flag defaults to active on card creation, the view can count never-shopped cards as active. Three incompatible active-member sets."
    detectability: invisible
    danger: high
    uncertain: false

  - id: member_status_three_columns
    items:
      - {ref: "loyalty_members.active_flag / enrolled_flag / member_status", layer: warehouse, where: "loyalty_members"}
      - {ref: "dim_member.status", layer: docs, where: "active/inactive/closed, DEFAULTS to active on creation"}
    category: "three overlapping member-status columns, default-active"
    confusable_because: "loyalty_members carries active_flag, enrolled_flag, and member_status; the documented status defaults to 'active' at creation until a nightly re-score. Which column is authoritative is unstated, and any of them can label a never-shopped card active."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: loyalty_identity_keys
    items:
      - {ref: "pos_transactions.member_id (fka loyalty_id, rewards_id)", layer: docs, where: "fct_transactions.member_id aliases"}
      - {ref: "online_orders.loyalty_id", layer: warehouse, where: "online_orders (VARCHAR, not member_id)"}
      - {ref: "loyalty_members.member_id / customer_id / loyalty_id", layer: warehouse, where: "loyalty_members"}
      - {ref: "member_count", layer: semantic, where: "metrics (count_distinct customer_id)"}
    category: "loyalty joined on member_id vs loyalty_id vs customer_id"
    confusable_because: "POS ties loyalty by member_id (formerly loyalty_id / rewards_id), online by a VARCHAR loyalty_id, and member_count aggregates customer_id. Joining or de-duplicating loyalty across channels on the wrong key over- or under-counts members, and customer_id vs member_id have different cardinality."
    detectability: invisible
    danger: high
    uncertain: false

  - id: loyalty_penetration_basket_vs_dollar
    items:
      - {ref: "Loyalty sales penetration", layer: docs, where: "basket version vs dollar version, several points apart"}
      - {ref: "fct_transactions.member_id", layer: docs, where: "attach rate = non-null member_id over all baskets"}
    category: "loyalty penetration as baskets or as dollars"
    confusable_because: "Penetration is baskets-with-member over all baskets (store scorecard) or loyalty dollars over total dollars (exec deck); loyalty baskets are bigger so the two run several points apart. No metric fixes which, so 'loyalty penetration' is ambiguous."
    detectability: invisible
    danger: medium
    uncertain: false

  # ============================ RETURNS ============================

  - id: returns_amount_phantom_vs_refund
    items:
      - {ref: "returns", layer: semantic, where: "metrics (measure return_amt, base fct_returns)"}
      - {ref: "fct_returns.refund_amount", layer: warehouse, where: "returns_raw.refund_amount / fct_returns.refund_amount (tax-included)"}
      - {ref: "fct_returns.refund_amount", layer: docs, where: "amount refunded, tax INCLUDED"}
    category: "returns at retail value vs refund amount (tax-in)"
    confusable_because: "The returns metric sums return_amt ('at retail value'), but the schema column is refund_amount, which is the actual refund WITH tax. Grounding returns to refund_amount inflates returns by tax and by price differences, and net_sales (which subtracts return_amt) subtracts a different quantity than what was refunded."
    detectability: invisible
    danger: high
    uncertain: false

  - id: return_rate_denominator_vs_net_impact
    items:
      - {ref: "return_rate", layer: semantic, where: "metrics (return_amt / gross_amt)"}
      - {ref: "fct_returns", layer: docs, where: "returns reduce NET sales but not gross"}
    category: "return rate divides by gross, but returns hit net"
    confusable_because: "return_rate is returns over gross_amt, yet returns are subtracted from net (not gross) sales. The denominator is inconsistent with where returns actually apply, so the rate is not comparable to the net-sales impact."
    detectability: invisible
    danger: medium
    uncertain: false

  - id: return_match_key_variants
    items:
      - {ref: "returns_raw.original_txn_id / transaction_id", layer: warehouse, where: "returns_raw (VARCHAR original_txn_id AND BIGINT transaction_id)"}
