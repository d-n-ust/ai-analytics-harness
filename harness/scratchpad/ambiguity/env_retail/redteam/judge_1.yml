    category: "return-to-original matching key has three spellings/types"
    confusable_because: "Returns reference original_txn_id (VARCHAR), transaction_id (BIGINT), and a documented original_transaction_id. Matching returns to original baskets on the wrong key leaves matched returns unmatched (refunded at current retail) and distorts store/day net."
    detectability: invisible
    danger: medium
    uncertain: false

  # ============================ STORE / DIMENSIONS ============================

  - id: store_key_sprawl
    items:
