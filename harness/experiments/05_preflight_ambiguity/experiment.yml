# Experiment 5 — preflight ambiguity: does fixing what the detector finds improve the agent?
#
# Experiments 1-3 improve the AGENT; 4 and 5 change the WAREHOUSE. This one measures the BENEFIT of
# static ambiguity detection end to end: scan the definitions, fix what is flagged, and measure the
# agent BEFORE vs AFTER on the same questions.
#
# The detector's own recall/precision (scratchpad/ambiguity + the extracted preflight package)
# answers "does it find the confusions". This experiment answers the question a buyer actually
# asks: "does fixing what it finds make my agent measurably more trustworthy".

title: "Preflight ambiguity — does fixing what the detector finds improve the agent?"
question: >-
  When a static scan flags confusable definitions in a warehouse and they are fixed, how much does
  the agent's wrong-grounding rate fall, and what share of the harm is left in problems the scan
  cannot read?
status: shipped

article:
  slug: why-ai-analysts-pick-the-wrong-metric
  repo: decisionspine-site

runs: code

evidence:
  - results/published/2026-08-preflight-ambiguity/   # the published board: scan 11->0, and the before/after agent (final 2026-08-21 run)
  - one_warehouse/            # THE experiment: one warehouse, both floors, one agent
  - one_warehouse/scan.md     # the static dose: 11 findings before, 0 after
  - one_warehouse/result__gpt-5-mini.json
  - one_warehouse/result__gpt-5.6-terra.json
  - study_01_governed_layer/  # superseded: metric selection over a governed layer alone
  - study_02_no_semantic_layer/  # superseded: column selection over raw tables alone

# THE DESIGN, as of the 2026-08-21 rebuild. One dbt-shaped warehouse per arm: dimension and fact
# models carrying table-level sprawl, with a metrics layer defined OVER those models carrying
# metric-level sprawl. The agent runs at rung 3 with both query_metric and run_sql, so it uses a
# governed metric where one exists and writes SQL where none does — which is how the model floor's
# problems become reachable at all.
#
#   before   all ten problems present
#   after    the same warehouse with the ten repaired
#
# Studies 01 and 02 split those two floors into separate experiments and are kept as the record of
# how the design got here. They are not the published measurement.
notes:
  - "The measurement uses the EMBEDDINGS gate, pre-registered: the lexical fallback misses
     meaning-alike names (monthly_recurring_revenue ~ recurring_revenue), which are exactly the
     pressure-built kind."
  - "Three finding types were added to preflight because this experiment exposed blind spots:
     structural pairing (0.2.0), VERSIONED_TWIN (0.3.0), FACT_TWIN (0.4.0)."
