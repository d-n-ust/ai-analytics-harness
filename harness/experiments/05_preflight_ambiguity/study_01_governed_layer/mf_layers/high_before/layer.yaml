# high_before -- sprawl on MetricFlow: governed metrics + confusable siblings, descriptions stripped.
---
semantic_model:
  name: user_activity
  description: "One row is one user-day of activity."
  node_relation: {schema_name: _star, alias: agg_active_days}
  defaults: {agg_time_dimension: active_date}
  entities:
    - {name: activity, type: primary, expr: "user_id || '|' || CAST(active_date AS VARCHAR)"}
    - {name: user, type: foreign, expr: user_id}
  dimensions:
    - {name: active_date, type: time, type_params: {time_granularity: day}}
    - {name: platform, type: categorical}
    - {name: country, type: categorical}
  measures:
    - {name: moments, agg: sum, expr: moments}
    - {name: active_user_count, agg: count_distinct, expr: user_id}
---
semantic_model:
  name: users
  description: "The user dimension: one row is one user (a signup)."
  node_relation: {schema_name: _star, alias: dim_users}
  defaults: {agg_time_dimension: signup_date}
  entities: [{name: user, type: primary, expr: user_id}]
  dimensions:
    - {name: signup_date, type: time, type_params: {time_granularity: day}}
    - {name: is_internal, type: categorical}
  measures:
    - {name: signup_count, agg: count, expr: user_id}
---
semantic_model:
  name: sub_snapshot
  description: "One row is one subscription in one monthly snapshot (a periodic snapshot of the active book)."
  node_relation: {schema_name: _star, alias: fct_subscription_months}
  defaults: {agg_time_dimension: snapshot_month}
  entities: [{name: sub_month, type: primary, expr: "subscription_id || snapshot_month"}]
  dimensions:
    - {name: snapshot_month, type: time, type_params: {time_granularity: month}}
    - {name: plan, type: categorical}
  measures:
    - {name: mrr_amount, agg: sum, expr: mrr_amount, non_additive_dimension: {name: snapshot_month, window_choice: max}}
    - {name: paying_user_count, agg: count_distinct, expr: user_id, non_additive_dimension: {name: snapshot_month, window_choice: max}}
---
semantic_model:
  name: habit_snapshot
  description: "One row is one habit in one monthly snapshot (active as of month-end)."
  node_relation: {schema_name: _star, alias: fct_habit_months}
  defaults: {agg_time_dimension: snapshot_month}
  entities: [{name: habit_month, type: primary, expr: "habit_id || snapshot_month"}]
  dimensions:
    - {name: snapshot_month, type: time, type_params: {time_granularity: month}}
    - {name: category, type: categorical}
  measures:
    - {name: active_habit_count, agg: count, expr: habit_id, non_additive_dimension: {name: snapshot_month, window_choice: max}}
---
semantic_model:
  name: habits_raw
  description: "Raw habit rows (created_date grain) -- the naive, un-snapshotted view."
  node_relation: {schema_name: _star, alias: dim_habits}
  defaults: {agg_time_dimension: created_date}
  entities: [{name: habit, type: primary, expr: habit_id}]
  dimensions: [{name: created_date, type: time, type_params: {time_granularity: day}}]
  measures: [{name: habit_count, agg: count, expr: habit_id}]
---
semantic_model:
  name: marketing
  description: "One row is one channel-day of marketing spend."
  node_relation: {schema_name: _star, alias: fct_marketing_spend}
  defaults: {agg_time_dimension: spend_date}
  entities: [{name: spend_row, type: primary, expr: "spend_date || channel"}]
  dimensions:
    - {name: spend_date, type: time, type_params: {time_granularity: day}}
    - {name: channel, type: categorical}
  measures:
    - {name: spend_amount, agg: sum, expr: spend}
---
semantic_model:
  name: sub_raw
  description: "Raw subscription rows (started_date grain)."
  node_relation: {schema_name: _star, alias: fct_subscriptions}
  defaults: {agg_time_dimension: started_date}
  entities: [{name: subscription, type: primary, expr: subscription_id}]
  dimensions: [{name: started_date, type: time, type_params: {time_granularity: day}}, {name: is_active, type: categorical}]
  measures: [{name: billed_amount_raw, agg: sum, expr: billed_amount}]
---
metric: {name: value_moments, type: simple, type_params: {measure: moments}}
---
metric:
  name: real_value_moments
  type: simple
  type_params: {measure: moments}
  filter: "{{ Dimension('user__is_internal') }} = false"
---
metric:
  name: active_users
  type: simple
  type_params: {measure: active_user_count}
  filter: "{{ Dimension('user__is_internal') }} = false"
---
metric: {name: mrr, type: simple, type_params: {measure: mrr_amount}}
---
metric: {name: paying_users, type: simple, type_params: {measure: paying_user_count}}
---
metric: {name: active_habits, type: simple, type_params: {measure: active_habit_count}}
---
metric: {name: new_signups, type: simple, type_params: {measure: signup_count}}
---
metric: {name: marketing_spend, type: simple, type_params: {measure: spend_amount}}
---
metric: {name: recurring_revenue, type: simple, type_params: {measure: billed_amount_raw}, filter: "{{ Dimension('subscription__is_active') }} = true"}
---
metric: {name: monthly_recurring_revenue, type: simple, type_params: {measure: mrr_amount}}
---
metric: {name: total_habits, type: simple, type_params: {measure: habit_count}}
---
metric: {name: new_users, type: simple, type_params: {measure: signup_count}, filter: "{{ Dimension('user__is_internal') }} = false"}
---
metric: {name: actives, type: simple, type_params: {measure: active_user_count}}
---
metric: {name: total_moments, type: simple, type_params: {measure: moments}}
---
metric: {name: monthly_active_users, type: simple, type_params: {measure: active_user_count}}
---
metric: {name: dau, type: simple, type_params: {measure: active_user_count}}
---
metric: {name: mau, type: simple, type_params: {measure: active_user_count}}
---
metric: {name: engaged_users, type: simple, type_params: {measure: active_user_count}}
---
metric: {name: subscribers, type: simple, type_params: {measure: paying_user_count}}
