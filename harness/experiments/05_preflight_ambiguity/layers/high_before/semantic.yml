# The habit-tracking semantic layer AS A PRESSURED TEAM LEFT IT — the HIGH-sprawl arm.
#
# Same domain and warehouse as the governed layer; the numbers are fine, the ambiguity is in the
# definitions. Three teams each added the metric they needed, nobody reconciled the names, half are
# undocumented. It is authored to exercise EVERY confusion preflight detects, so the high arm shows
# the tool's full range, not one trap. Clusters are labelled by the finding type they trigger.
#
# NOTE: the synonym-based clusters (revenue, active-users) fire on the EMBEDDING gate, not the lexical
# one — they are exactly the pressure-built kind (mrr ~ recurring_revenue reads alike by MEANING, not
# spelling). Scan with `--gate embeddings`.

metrics:

  # ══ VALUE MOMENTS ══ scope trap + duplicates + siblings + grain
  value_moments:                                   # bare name — the trap
    description: "Value moments in the period."
    entity: value_moments
    segment: all
    unit: count
    synonyms: ["value moments", "activity"]
    base: agg_active_days
    agg: "sum(moments)"
    time_column: active_date
  real_value_moments:                              # SCOPE_TRAP vs value_moments (NOT is_internal)
    description: "Value moments from real users."
    entity: value_moments
    segment: active
    unit: count
    synonyms: ["real value moments", "north star"]
    base: agg_active_days
    agg: "sum(moments)"
    default_filters: ["NOT is_internal"]
    time_column: active_date
  total_moments:                                   # DUPLICATE of value_moments
    description: "Total moments logged."
    entity: value_moments
    segment: all
    unit: count
    synonyms: ["total moments", "moments"]
    base: agg_active_days
    agg: "sum(moments)"
    time_column: active_date
  ios_value_moments:                               # SIBLING vs android (incomparable scopes)
    description: "Value moments on iOS."
    entity: value_moments
    segment: all
    unit: count
    synonyms: ["ios value moments"]
    base: agg_active_days
    agg: "sum(moments)"
    default_filters: ["platform = 'ios'"]
    time_column: active_date
  android_value_moments:
    description: "Value moments on Android."
    entity: value_moments
    segment: all
    unit: count
    synonyms: ["android value moments"]
    base: agg_active_days
    agg: "sum(moments)"
    default_filters: ["platform = 'android'"]
    time_column: active_date
  weekly_value_moments:                            # GRAIN_MISMATCH vs monthly (same measure, diff grain)
    description: "Value moments, weekly."
    entity: value_moments
    segment: active
    unit: count
    synonyms: ["weekly value moments"]
    base: agg_active_days
    agg: "sum(moments)"
    default_filters: ["NOT is_internal"]
    grain: week
    time_column: active_date
  monthly_value_moments:
    description: "Value moments, monthly."
    entity: value_moments
    segment: active
    unit: count
    synonyms: ["monthly value moments"]
    base: agg_active_days
    agg: "sum(moments)"
    default_filters: ["NOT is_internal"]
    grain: month
    time_column: active_date

  # ══ ACTIVE USERS ══ scope trap + duplicate + grain mismatch (semi-additive) + name collision
  active_users:
    description: "Distinct real users active in the period."
    entity: users
    segment: active
    unit: count
    synonyms: ["active users", "actives", "MAU", "WAU"]
    base: agg_active_days
    agg: "count(distinct user_id)"
    default_filters: ["NOT is_internal"]
    time_column: active_date
  actives:                                         # SCOPE_TRAP vs active_users (drops NOT is_internal)
    description: "Active users."
    entity: users
    segment: all
    unit: count
    synonyms: ["actives", "active users"]
    base: agg_active_days
    agg: "count(distinct user_id)"
    time_column: active_date
  monthly_active_users:                            # DUPLICATE of active_users
    description: "MAU."
    entity: users
    segment: active
    unit: count
    synonyms: ["MAU", "monthly active users"]
    base: agg_active_days
    agg: "count(distinct user_id)"
    default_filters: ["NOT is_internal"]
    time_column: active_date
  dau:                                             # GRAIN_MISMATCH vs mau: distinct count is semi-additive
    description: "Daily active users."
    entity: users
    segment: active
    unit: count
    synonyms: ["DAU", "daily active users"]
    base: agg_active_days
    agg: "count(distinct user_id)"
    default_filters: ["NOT is_internal"]
    grain: day
    time_column: active_date
  mau:
    description: "Monthly active users."
    entity: users
    segment: active
    unit: count
    synonyms: ["MAU"]
    base: agg_active_days
    agg: "count(distinct user_id)"
    default_filters: ["NOT is_internal"]
    grain: month
    time_column: active_date
  engaged_users:                                   # NAME_COLLISION / concept vs active_users
    description: "Engaged users (any moment)."
    entity: users
    segment: active
    unit: count
    synonyms: ["engaged users", "active users"]
    base: agg_active_days
    agg: "count(distinct user_id)"
    default_filters: ["NOT is_internal", "moments >= 1"]
    time_column: active_date

  # ══ RECURRING REVENUE ══ concept fork + duplicate + name collision (embedding gate)
  mrr:
    description: "Monthly recurring revenue (annual plans / 12)."
    entity: revenue
    segment: active_subscription
    unit: currency
    synonyms: ["MRR", "monthly recurring revenue"]
    base: fct_subscriptions
    agg: "sum(case when plan = 'annual' then billed_amount / 12.0 else billed_amount end)"
    default_filters: ["is_active"]
  recurring_revenue:                               # CONCEPT_FORK vs mrr (same base/agg, diff column)
    description: "Recurring revenue from active subscriptions."
    entity: revenue
    segment: active_subscription
    unit: currency
    synonyms: ["recurring revenue"]
    base: fct_subscriptions
    agg: "sum(billed_amount)"
    default_filters: ["is_active"]
  monthly_recurring_revenue:                       # DUPLICATE of mrr
    description: "MRR."
    entity: revenue
    segment: active_subscription
    unit: currency
    synonyms: ["monthly recurring revenue"]
    base: fct_subscriptions
    agg: "sum(case when plan = 'annual' then billed_amount / 12.0 else billed_amount end)"
    default_filters: ["is_active"]
  gross_revenue:                                   # SCOPE_TRAP / concept vs net_revenue
    description: "Gross subscription revenue."
    entity: revenue
    segment: all
    unit: currency
    synonyms: ["gross revenue", "revenue"]
    base: fct_subscriptions
    agg: "sum(billed_amount)"
  net_revenue:
    description: "Net subscription revenue (active only)."
    entity: revenue
    segment: active_subscription
    unit: currency
    synonyms: ["net revenue", "revenue"]
    base: fct_subscriptions
    agg: "sum(billed_amount)"
    default_filters: ["is_active"]

  # ══ SIGNUPS ══ duplicate + scope trap
  new_signups:
    description: "Signups in the period."
    entity: signups
    segment: all
    unit: count
    synonyms: ["signups", "new signups"]
    base: dim_users
    agg: "count(*)"
    time_column: signup_date
  signups:                                         # DUPLICATE of new_signups
    description: "Signups."
    entity: signups
    segment: all
    unit: count
    synonyms: ["signups", "registrations"]
    base: dim_users
    agg: "count(*)"
    time_column: signup_date
  new_users:                                       # SCOPE_TRAP vs signups (NOT is_internal)
    description: "New real users."
    entity: signups
    segment: active
    unit: count
    synonyms: ["new users"]
    base: dim_users
    agg: "count(*)"
    default_filters: ["NOT is_internal"]
    time_column: signup_date

  # ══ PAYING USERS ══ duplicate
  paying_users:
    description: "Distinct users with an active subscription."
    entity: users
    segment: paying
    unit: count
    synonyms: ["paying users", "subscribers"]
    base: fct_subscriptions
    agg: "count(distinct user_id)"
    default_filters: ["is_active"]
  subscribers:                                     # DUPLICATE of paying_users
    description: "Subscribers."
    entity: users
    segment: paying
    unit: count
    synonyms: ["subscribers", "paying users"]
    base: fct_subscriptions
    agg: "count(distinct user_id)"
    default_filters: ["is_active"]

  # ── unambiguous supporting metrics ──
  active_subscriptions:
    description: "Count of active subscriptions."
    entity: subscriptions
    segment: active_subscription
    unit: count
    synonyms: ["active subscriptions"]
    base: fct_subscriptions
    agg: "count(*)"
    default_filters: ["is_active"]
  marketing_spend:
    description: "Total marketing spend."
    entity: spend
    segment: all
    unit: currency
    synonyms: ["marketing spend", "ad spend"]
    base: fct_marketing_spend
    agg: "sum(spend)"
    time_column: spend_date
