# Study 02 — before/after on the WAREHOUSE (no semantic layer; the agent answers by raw SQL).
# The trap families are study 01's, rendered as columns: recurring (raw billed vs a modelled mrr),
# scope (is_internal vs is_test), gross/net revenue, overloaded moments. Gold is one gold_sql oracle
# against the clean star. `wrong_grounding` lists SQL substrings that mark a wrong COLUMN/table choice
# (Mode-1 selection at the column level), recovered from the agent's run_sql.
cases:
  - id: s2_recurring
    tier: flagged
    family: recurring_revenue
    question: "What is our current recurring revenue?"
    expect: {type: metric_answer, metric: mrr, tolerance: 0.02,
             gold_sql: "SELECT sum(CASE WHEN plan='annual' THEN billed_amount/12.0 ELSE billed_amount END) FROM fct_subscriptions f JOIN dim_users u USING(user_id) WHERE f.is_active AND NOT u.is_internal"}
    wrong_grounding: ["billed_amount"]   # summing raw billed (no /12) instead of a modelled mrr
    right_grounding: ["mrr", "/12", "/ 12"]
  - id: s2_total_revenue
    tier: flagged
    family: gross_net
    question: "What was our total subscription revenue?"
    expect: {type: metric_answer, metric: net_revenue, tolerance: 0.02,
             gold_sql: "SELECT sum(billed_amount) FROM fct_subscriptions f JOIN dim_users u USING(user_id) WHERE f.is_active AND NOT u.is_internal"}
    wrong_grounding: []
  - id: s2_active_users
    tier: flagged
    family: internal_scope
    question: "How many active users did we have in June 2026?"
    expect: {type: metric_answer, metric: active_users, tolerance: 0.02,
             gold_sql: "SELECT count(DISTINCT user_id) FROM agg_active_days WHERE active_date BETWEEN DATE '2026-06-01' AND DATE '2026-06-30' AND NOT is_internal"}
    wrong_grounding: ["is_test"]         # filtering the wrong internal flag
    right_grounding: ["is_internal"]
  - id: s2_value_moments
    tier: flagged
    family: value_moments
    question: "How many value moments were completed in June 2026?"
    expect: {type: metric_answer, metric: value_moments, tolerance: 0.02,
             gold_sql: "SELECT sum(moments) FROM agg_active_days WHERE active_date BETWEEN DATE '2026-06-01' AND DATE '2026-06-30' AND NOT is_internal"}
    wrong_grounding: ["daily_rollup"]    # the overloaded second table
  # ---- typical-sprawl species, added 2026-08-19 (pre-registered before any scan or run) ----
  # Authored from the industry-recognisable sprawl list, not from the scanner's strengths. The
  # migration-leftover trap is table-level, which static definition analysis is weak on by design;
  # whatever the scan and the agents do with these is reported as measured.
  - id: s2_users_v2_april
    tier: flagged
    family: migration_leftover
    question: "How many users signed up in April 2026?"
    expect: {type: metric_answer, metric: new_signups, tolerance: 0.02,
             gold_sql: "SELECT count(*) FROM dim_users WHERE signup_date BETWEEN DATE '2026-04-01' AND DATE '2026-04-30' AND NOT is_internal"}
    wrong_grounding: ["users_v2"]        # the 80%-finished migration table (silently excludes ~7%)
    right_grounding: ["from users ", "from users\n", "join users ", "users u", "users as"]
  - id: s2_users_v2_total
    tier: flagged
    family: migration_leftover
    question: "How many users do we have in total?"
    expect: {type: metric_answer, metric: total_users, tolerance: 0.02,
             gold_sql: "SELECT count(*) FROM dim_users WHERE NOT is_internal"}
    wrong_grounding: ["users_v2"]
    right_grounding: ["from users ", "from users\n", "join users ", "users u", "users as"]
  - id: s2_active_subs
    tier: flagged
    family: stale_status
    question: "How many active subscriptions do we have right now?"
    expect: {type: metric_answer, metric: active_subscriptions, tolerance: 0.02,
             gold_sql: "SELECT count(*) FROM fct_subscriptions f JOIN dim_users u USING(user_id) WHERE f.is_active AND NOT u.is_internal"}
    wrong_grounding: ["status = 'active'", "status='active'", "status in ("]   # the stale batch column
    right_grounding: ["is_active", "active = true", "active=true", "where active", "and active", "(active"]
  - id: s2_subs_book
    tier: flagged
    family: stale_status
    question: "How many paying subscriptions do we have at the moment?"
    expect: {type: metric_answer, metric: active_subscriptions, tolerance: 0.02,
             gold_sql: "SELECT count(*) FROM fct_subscriptions f JOIN dim_users u USING(user_id) WHERE f.is_active AND NOT u.is_internal"}
    wrong_grounding: ["status = 'active'", "status='active'", "status in ("]
    right_grounding: ["is_active", "active = true", "active=true", "where active", "and active", "(active"]
  - id: s2_march_joins
    tier: flagged
    family: date_columns
    question: "How many users joined us in March 2026?"
    expect: {type: metric_answer, metric: new_signups, tolerance: 0.02,
             gold_sql: "SELECT count(*) FROM dim_users WHERE signup_date BETWEEN DATE '2026-03-01' AND DATE '2026-03-31' AND NOT is_internal"}
    wrong_grounding: ["created_at"]      # row creation, not joining (a bulk import created rows late)
    right_grounding: ["signup_date"]
  - id: s2_march_new
    tier: flagged
    family: date_columns
    question: "How many new users did we add in March 2026?"
    expect: {type: metric_answer, metric: new_signups, tolerance: 0.02,
             gold_sql: "SELECT count(*) FROM dim_users WHERE signup_date BETWEEN DATE '2026-03-01' AND DATE '2026-03-31' AND NOT is_internal"}
    wrong_grounding: ["created_at"]
    right_grounding: ["signup_date"]
  - id: s2_marketing
    tier: clean
    family: marketing_spend
    question: "How much did we spend on marketing in June 2026?"
    expect: {type: metric_answer, metric: marketing_spend, tolerance: 0.02,
             gold_sql: "SELECT sum(spend) FROM fct_marketing_spend WHERE spend_date BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'"}
    wrong_grounding: []
  - id: s2_plan_mix
    tier: clean
    family: plan_mix
    question: "How many annual subscriptions have we sold in total?"
    expect: {type: metric_answer, metric: annual_subscriptions, tolerance: 0.02,
             gold_sql: "SELECT count(*) FROM fct_subscriptions f JOIN dim_users u USING(user_id) WHERE f.plan = 'annual' AND NOT u.is_internal"}
    wrong_grounding: []
