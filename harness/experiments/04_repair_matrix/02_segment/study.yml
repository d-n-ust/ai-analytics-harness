# Study 01 — A SEGMENT PROMOTED TO A METRIC. Two instances of one defect, in one study.
#
# WHAT THE DEFECT IS. Two governed metrics share an entity, a base table, a grain and a measure, and
# differ only in which population they count. That is one measure and two segments, shipped as two
# metrics — so the agent chooses between two metric NAMES where it should be choosing between two
# values of one argument.
#
# TWO HIDING PLACES, MERGED FROM WHAT WERE STUDIES 01 AND 02:
#
#     in the NAME        value_moments / real_value_moments — identical in source, aggregation and
#                        grain; the population survives only where a description happens to mention
#                        it, and the catalogue never renders a segment
#     in the AGGREGATE   power_users restricts to 5+ moments in a day INSIDE its `agg`, so the
#                        predicate that decides who is counted is arithmetic no reader can see
#
# WHY ONE STUDY AND NOT TWO. They are the same defect and they filled the same row of
# ../primitives_matrix.md with the same three columns. Two studies agreeing is a weaker claim than
# one study with an internal replication, and merging takes the item count from four to eight —
# which is the binding constraint on everything in this experiment, not the number of arms.
#
# The arms compose without conflict: 01's strip removes WHO IS COUNTED, 02's removes the THRESHOLD,
# and their repairs touch different metrics. A_implicit now strips both.
#
# THE FIRST INSTANCE, kept verbatim from when this was study 01 on its own: the segment is
# encoded in the metric NAME (rule S1).
#
# Two governed metrics measure the same thing over the same rows at the same grain:
#
#     value_moments        entity value_moments · agg sum(moments) · no default filter
#     real_value_moments   entity value_moments · agg sum(moments) · NOT is_internal
#
# Identical in entity, measure, agg and grain. They differ in SEGMENT and nothing else, and the
# catalogue never renders a segment — it survives only where a description happens to mention it.
# So the agent is asked to choose between two metrics where it should be choosing between two
# arguments, and the only clue is the word "real" in a name. A name is not a definition.
#
# MIGRATED 2026-08-06 from `experiments/probe_population.py` + four forked layers under
# `semantic/layers/` (1,474 lines) to four patch arms (~40). The treatments are UNCHANGED — the
# patches were generated by diffing the forked files against the base, not retyped — so the twelve
# stored runs under `results/probes/` remain comparable. Question ids keep their `p_` prefix for the
# same reason: renaming them would break the link to every number already cited in the write-ups.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THIS EXPERIMENT'S HEADLINE CANNOT BE ATTRIBUTED, AND THE ARMS ARE KEPT THAT WAY ON PURPOSE.
#
# Two confounds were found in review, after the numbers were produced. Both are preserved here
# exactly as they ran, because a migration that quietly fixed them would destroy the only record of
# what the stored results actually measured. What is new is that the runner now REPORTS them:
#
#   1. candidate count.  The `segment` arm deletes the twin, so it offers 14 metrics where the
#      others offer 15. Under random choice between two confusable options that is worth ~50 points
#      before any treatment exists. The arm now has to declare `changes_candidate_count: true`, and
#      the runner refuses the whole experiment if an arm shrinks without saying so.
#   2. vocabulary.  The `segment` arm's synonyms carry `customers`, `genuine users`,
#      `excluding staff`, `including staff` — wording that appears in the questions and in no other
#      arm. The vocabulary audit prints the longest verbatim span per arm per question every run, so
#      this is now visible before the money is spent rather than six weeks after.
#
# THE TWO ARMS THAT WOULD SETTLE IT ARE NOT BUILT YET: `segment_neutral` (the same structure with
# the bespoke synonyms removed) and `prose_minus` (the prose arm with an UNRELATED metric deleted,
# so it offers 14 too). Until both exist, read this experiment as an instrument-development run.
# ────────────────────────────────────────────────────────────────────────────────────────────────

title: "A segment promoted to a metric — two instances, one defect"
base: semantic/semantic_layer.yml

# Recorded here rather than in the folder name because the mapping is not one-to-one; see
# experiments/engine.py on what the folder number does and does not mean.
tests_rules: [S1]

# Rung 3 with R7 (`governed_numbers`), matching experiment 02 so the two are comparable: the
# catalogue is the only thing that can carry the segment, and the model must declare which metric
# its number came from.
rung: 3
guardrails: 7

# ARM NAMES CHANGED 2026-08-09 so a letter names a matrix column rather than this study's own
# vocabulary. Stored runs under results/ carry the old names:
#     A_absent -> A_implicit · B_prose -> B_documented · C_segment -> D_declared
#
# WHAT EACH MATRIX COLUMN IS, FOR THIS PRIMITIVE. See 01_entity/study.yml for the convention. A
# value opening with CONSTANT, ABSENT or OPEN means there is NO arm for that column. PARTIAL means
# an arm exists but is a weaker form of the column. See ../primitives_matrix.md.
columns:
  A_implicit:   "descriptions stripped — dim_users.is_internal exists and nothing names it"
  B_documented: "the layer as it ships: each metric description states who is counted"
  C_modelled:   "CONSTANT — dim_users.is_internal (warehouse/star.sql:39), a resolved boolean on a
                 conformed dimension, present and identical in every arm. The only way to make this
                 column vary is to remove an attribute from a conformed dimension, which measures a
                 damaged star rather than a segment."
  D_declared:   "governance.segments — a named, described, reusable segment offered on the metric"
  E_enforced:   "OPEN — R9 scope-match: the population used against the population asked for.
                 Expect little: it catches a wrong filter, not a missing one, so it cannot help
                 A_implicit, where no population is stated anywhere to compare against."

# Three arms, three matrix columns: implicit, documented, declared. The position control
# B_prose_swapped was retired here (see B_prose_swapped.yml.retired) — it could not
# separate position from noise, and the runner now reports the noise directly.
arms: [A_implicit, B_documented, D_declared]

# PRE-REGISTERED READINGS. Written before the migration, from the design note rather than from the
# stored results, so this file does not launder a finding into a prediction.
#
#   absent < prose       stating who a metric counts should beat not stating it. This is the
#                        positive control, and it is the one comparison free of both confounds.
#
#   prose vs segment     THE FINDING, and the one the confounds attack. A win for `segment` is
#                        currently unattributable between three causes: structure, vocabulary, and
#                        one fewer wrong answer to pick from.
#
#   prose vs prose_swapped   a pre-specified NULL. The two arms are the same layer with the twin
#                        pair the other way round, so any difference is position bias, not content.
#                        It returned identical picks and values on all five questions at reps=1.
#                        Report that as "not detected at n=5, reps=1" and never as a refutation:
#                        a seven-model position-bias effect is published (BiasBusters, ICLR 2026).
#
#   p_pop_control_mrr    KNOWN BROKEN, and kept so the breakage stays visible. `mrr` is nameable
#                        straight off the `query_metric` enum, so all four arms answered it without
#                        ever reading the catalogue. A control that can be answered without the
#                        treatment surface controls for nothing. Experiment 02's control was written
#                        to need a governed dimension member instead — and 8 of its 9 rows STILL
#                        never read the catalogue, because the enum defeats that too. Fixing this
#                        needs a change to the R7 tool surface, not a better question.
#
# POWER. Only one of the five questions discriminated between arms, so paired discordance is
# b+c = 1 and the smallest attainable exact McNemar p is 1.0000 — not "underpowered" but unable to
# produce a significant result at ANY number of repetitions, because reps estimate noise WITHIN an
# item while the effect lives ACROSS items. Six discordant items is the floor for p < 0.05. This is
# the lesson that shaped experiment 02's question set, where three of five can discriminate.