# The governance overlay — the whole of what is written by hand.
#
# Everything here is a fact the MetricFlow layer, the dbt models and the warehouse do NOT state, so
# nothing can compute it. The layer's own comment admits as much: owner and the concept a metric
# claims "get shoved into the description because there is nowhere else to put them". This file is
# that "nowhere else", made structured. Its size is a primary output of the experiment — it is the
# exact shape of what a governed layer is missing.
#
# It never restates a generated fact. It adds three things:
#   1. sibling annotations on generated measures/attributes (owner, status, additivity, population)
#   2. whole sections the base cannot produce (populations, vocabulary, relationships)
#   3. member_source: which raw column a normalised attribute was collapsed from, so the generator
#      can read the raw spellings the layer hides.

# ── which raw column each normalised attribute came from ─────────────────────────────────────
# The layer declares a clean member set; staging SQL collapsed a messier raw column into it. Naming
# that raw column is knowledge the layer does not hold. The generator reads its DISTINCT values, and
# the gap between raw and mart is the member-normalisation nobody declared.
member_source:
  platform: {raw: "_source.u.plat"}
  channel: {raw: "_source.u.chan"}

# ── named segments (MetricFlow calls these metric filters; Cube calls them segments) ───────────
# A metric's scope filter is generated (e.g. `is_internal = false`). What that filter MEANS — the
# concept it stands for, who owns the rule, how firm it is — is not. `customers` is the same filter
# two metrics apply on their own; nothing in the layer forces them to agree, which is how the
# contested pair below came to exist. The section is keyed `populations` because the traverse binds
# to it by that name; each entry is a named, reusable segment.
populations:
  customers:
    kind: segment
    entity: user
    filter: "is_internal = false"
    means: "External accounts: real customers, excluding staff and test accounts."
    owner: Product
    evidence: decided
    status: certified
    note: >-
      The is_internal rule itself rests on two undocumented signals (an internal flag and an
      @internal-test.com email) and reads silence as external — 271 accounts say nothing. That
      judgement lives in stg_users.sql, not in any declaration.
  all_accounts:
    kind: segment
    entity: user
    filter: none
    means: "Every account, internal and test included. Used for load and capacity, not customers."
    owner: Platform
    evidence: decided
    status: certified
  active_book:
    kind: segment
    entity: subscription
    filter: "status = 'active'"
    means: "Subscription terms currently active — the paying book."
    owner: Finance
    evidence: decided
    status: certified

# ── per-measure governance: owner, status, the segment its filter names ────────────────────────
# `population` links a generated scope_filter to a named segment above. Additivity is NOT here: it
# is derived from the aggregate in the base (generate.py `_additivity`), so it cannot drift from the
# `agg` it describes. Owner and status have no home in MetricFlow, which is why they sit here.
measures:
  app_opens:
    owner: Product
    status: certified
    population: customers
  active_users:
    owner: Product
    status: certified
    population: customers
  active_accounts:
    owner: Platform
    status: certified
    population: all_accounts
  value_moments:
    owner: Product
    status: certified
    population: customers

# ── per-attribute governance ───────────────────────────────────────────────────────────────
attributes:
  is_internal:
    status: certified
    note: "The customer/internal split. Derived in staging from two undocumented raw signals."
  platform:
    status: certified
    note: "unknown is a real member: accounts whose raw platform was blank or unrecognised."

# ── vocabulary: a word maps to a CANDIDATE SET, never one object ───────────────────────────────
# kind says what the candidates are, so the traverse knows how to bind them. A term with two
# measure candidates is where a question is silently answered twice.
vocabulary:
  "app opens":      {kind: measure,   candidates: [app_opens]}
  "opens":          {kind: measure,   candidates: [app_opens]}
  "users":          {kind: measure,   candidates: [active_users, active_accounts]}
  "active users":   {kind: measure,   candidates: [active_users, active_accounts]}
  "customers":      {kind: population, candidates: [customers]}
  "android":        {kind: filter,    candidates: ["platform=android"]}
  "ios":            {kind: filter,    candidates: ["platform=ios"]}
  "web":            {kind: filter,    candidates: ["platform=web"]}
  "paid search":    {kind: filter,    candidates: ["channel=paid_search"]}

# ── relationships between definitions, as nodes ────────────────────────────────────────────────
# owner, evidence tier and status make a relation governable. A contested pair carries a policy: who
# gets which definition by default. This is the node that turns "two metrics answer the question"
# from prose into something the traverse can act on.
relationships:
  - id: rel_active_user_definition
    type: contested
    members: [active_users, active_accounts]
    differs_in: population
    means: "Both count distinct active accounts; they differ only on whether internal/test are in."
    owner: unassigned
    evidence: verified
    status: open
    policy:
      default_by_consumer:
        product_review: active_users
        capacity_planning: active_accounts
      note: "No cross-team owner. Absent a consumer, the pair is genuinely ambiguous."

# ── closure: what the warehouse does and does NOT capture ──────────────────────────────────────
# A warehouse is a closed world: a column that is not there was not captured. But an agent reasons
# open-world — it cannot prove the absence of a duration column, so it behaves as if one might exist
# and invents a definition. Closure states the absence explicitly, so "is this measurable" becomes a
# lookup rather than a guess. Without this section a question with no governed metric cannot be told
# apart: COMPUTABLE (the pieces exist, no metric governs them) vs UNINSTRUMENTED (nothing captures it).
closure:
  captured_is_complete: true
  note: "The entities, attributes and measures in this spine are all the marts capture. Absence here means absence in the warehouse, not unknown."

# Concepts a question asks for that no governed metric answers, but whose parts ARE captured, so an
# agent could compute them off the governed path. COMPUTABLE is a distinct verdict from both GOVERNED
# and UNINSTRUMENTED; the honest move on one is to author a definition, not to refuse.
computable:
  "90-day retention":
    terms: ["90-day retention", "90 day retention", "retention"]
    requires: ["user.signup_date", "activity.active_date"]
    joinable: "activity -> user (many_to_one)"
    governed_metric: none
    note: "Signup cohort and activity both exist and are joinable, so retention is computable; no governed metric defines the window, the numerator, or what 'retained' means, so any figure is an authored definition, not a governed one."

# Concepts nothing in the warehouse captures. UNINSTRUMENTED: the honest move is refuse, not compute.
not_captured:
  - concept: "session duration / minutes in app"
    terms: ["minutes in app", "time in app", "session duration", "session length", "time spent"]
    reason: "Every event is a point in time; none carries a duration or an end timestamp, so no elapsed time can be derived."
    evidence: "fixture/models/staging/stg_events.sql — event_ts only, no end_ts or duration column"
  - concept: "page or screen views"
    terms: ["page views", "pageviews", "screen views", "screens"]
    reason: "There is no page or screen event; etype decodes to app_open / value_moment / reminder_click only."
    evidence: "fixture/models/staging/stg_events.sql — the etype CASE has three arms"

# ── parameter phrasings: governed synonyms that GROUND a selectable value ──────────────────────
# A phrase in the question grounds a slot value iff it maps here. This is the vocabulary lookup that
# replaces keyword matching: exact, governed, auditable. Grow it from real questions the check misses.
parameter_phrasings:
  time_grain:
    day:   ["daily", "day by day", "per day", "day over day"]
    week:  ["weekly", "week by week", "per week", "each week", "week over week"]
    month: ["monthly", "month by month", "month over month", "per month", "each month"]
  group_by:
    activity__platform: ["by platform", "by device", "per platform", "across platforms"]
    activity__region:   ["by region", "by geography", "per region", "across regions"]
    activity__channel:  ["by channel", "by acquisition channel", "by acquisition source", "by marketing channel"]
    activity__country:  ["by country", "by market"]
    # only UNAMBIGUOUS trend phrases: "how did" was removed — it also means "in what way" (a
    # breakdown), so it over-grounded a time series on questions that asked for a dimensional split.
    metric_time:        ["change", "changed", "over time", "week by week", "month by month", "trend", "trended", "trajectory"]

# ── methodological rules: a governed default for a slot the question leaves open ────────────────
# When no phrase grounds a slot, a rule may still pick a sensible value — DISCLOSED, never silent.
# Common sense, written down and owned, so it is reproducible. If no rule fits, the protocol clarifies.
methodological_rules:
  - id: trend_granularity
    slot: time_grain
    when: "a time series is requested (group_by includes metric_time) but no bucket is grounded"
    target_points: [15, 40]
    prefer: coarsest_in_range
    rationale: "A trend needs enough points to show its shape and few enough to read: 15-40. Day is
      usually too granular, month too coarse over a short span; the rule computes the fit from the
      span rather than guessing."
    owner: analytics
    status: certified
  - id: canonical_segments
    slot: group_by
    when: "an unspecified breakdown is asked ('by segment', 'across the business') with no dimension named"
    default: [activity__platform, activity__region, activity__channel]
    disclose: "broken down by the standard business segments — platform (product), region (sales), channel (marketing)"
    rationale: "A senior analyst's first-pass breakdown is the canonical high-level business segments,
      not one arbitrary dimension. Showing all three is the analysis; it is not a fork worth a clarify."
    owner: analytics
    status: certified

# ── structural safety: correctness traps the layer can PROVE, from additivity ──────────────────
# Not an opinion the model may override — arithmetic. A metric that is not additive over a dimension
# must not be summed across that dimension's groups; the layer forbids the illegal roll-up and points
# to the safe form. Additivity itself is derived in the base from `agg`.
structural_safety:
  reaggregation:
    rule: "if a metric is not additive over the group_by dimension, summing the groups double-counts"
    over_time: "a distinct count (semi-additive) summed across time buckets counts an entity once per bucket"
    safe_form: "query the period total directly instead of grouping and summing"
