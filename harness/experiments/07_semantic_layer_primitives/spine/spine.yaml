methodological_rules:
- id: trend_granularity
  slot: time_grain
  when: a time series is requested (group_by includes metric_time) but no bucket is
    grounded
  target_points:
  - 15
  - 40
  prefer: coarsest_in_range
  rationale: 'A trend needs enough points to show its shape and few enough to read:
    15-40. Day is usually too granular, month too coarse over a short span; the rule
    computes the fit from the span rather than guessing.'
  owner: analytics
  status: certified
  _from: overlay
- id: canonical_segments
  slot: group_by
  when: an unspecified breakdown is asked ('by segment', 'across the business') with
    no dimension named
  default:
  - activity__platform
  - activity__region
  - activity__channel
  disclose: broken down by the standard business segments — platform (product), region
    (sales), channel (marketing)
  rationale: A senior analyst's first-pass breakdown is the canonical high-level business
    segments, not one arbitrary dimension. Showing all three is the analysis; it is
    not a fork worth a clarify.
  owner: analytics
  status: certified
  _from: overlay
structural_safety:
  reaggregation:
    rule: if a metric is not additive over the group_by dimension, summing the groups
      double-counts
    over_time: a distinct count (semi-additive) summed across time buckets counts
      an entity once per bucket
    safe_form: query the period total directly instead of grouping and summing
    _from: overlay
