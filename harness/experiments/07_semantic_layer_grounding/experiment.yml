# Experiment 7 · semantic layer grounding: is a query to a governed layer governed when only its
# metric is?
#
# Experiment 06 measured what an agent does when two governed definitions both answer a question.
# This one moves from the metric to the rest of the query. A query is a metric plus parameter
# decisions (filters, group-by, time grain, period), and the layer governs few of them. The
# experiment classifies each decision by its basis and whether it was disclosed (milestoneA.md), and
# measures whether grounding the decisions lowers the silent error rate.

title: "Semantic layer grounding: governing every parameter of the query, not only the metric"
question: >-
  Does an agent that grounds each query parameter in the question, a governed declaration or a
  governed principle, and discloses it, have a lower silent error rate at equal or better coverage
  and balanced accuracy than the same agent without that step, and than the same agent told only to
  state its assumptions?
status: in_progress    # measured on four blind sets; the final run is open (findings section 39)

article:
  slug: what-an-ai-analyst-needs-from-your-semantic-layer    # draft
  repo: decisionspine-site

runs: cli

evidence:
  - findings.md                       # the ledger, sections 1-39; section 39 is the open list
  - milestoneA.md                     # the first model of query trust and the three-arm design (2026-09-22)
  - fixture/                          # the dbt project, the MetricFlow layer with modelled attributes, governance.yml
  - 01_parameter_grounding/           # study 01: the agent arms; development, red-team and held-out suites
  - 02_readiness_audit/               # study 02: the reader alone; controlled test, blind sets 1-4, label audits, grid.py
  - 03_typed_reader/design.md         # the typed reader's design
  - 04_value_search/README.md         # candidate search for large dimensions, step A
  - probes/                           # single-run outputs from before the shared runner, cited by findings.md

notes:
  - "ARMS (study 01). R4 is the agent at rung 3 with raw SQL withdrawn. R4+disclose_assumptions adds
     one instruction to state every assumption. R4+parameter_grounding adds the LLM grounding step;
     R4+decision_grounding adds a decision model choosing each parameter from options built by code.
     Held-out v1 (section 19): silent error 0.298, 0.298, 0.193 and 0.053 respectively."
  - "THE READER ALONE (study 02). From section 24 the question reader is graded as a component on
     blind sets: intents written by one model, wordings by another, predictions registered first,
     labels audited after each run. The typed reader replaced the questionnaire reader (sections 30
     to 38). Each set measured a newer version; only set 1 compares the two readers on one set."
  - "MEASURES. Silent error, balanced accuracy and coverage (harness/evals/selective.py), applied to
     the reader's action and parameters. Regrading from stored readings costs nothing."
  - "SELF-SUFFICIENT FIXTURE. fixture/ began as a copy of experiment 06's dbt project and MetricFlow
     layer. This experiment added modelled attributes (device_type, country_name, seasons,
     hemisphere), value meanings, complete lists and governance.yml."
  - "LIMITS. One synthetic warehouse, one metric (app_opens) in the blind sets, and short value lists:
     candidate search for large dimensions is a prototype only."
