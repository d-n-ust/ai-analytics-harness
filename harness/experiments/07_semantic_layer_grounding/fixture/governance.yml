# Governance for this fixture: the facts the MetricFlow layer cannot express.
#
# `semantic_models.yml` declares measures, dimensions and metric filters. It has no field for who
# owns a definition, what a filter means, which words map to which definitions, which definitions
# compete, or which default fills a parameter the question leaves open. MetricFlow users put these
# facts in free-text descriptions. This file states them as structured data, and its content is the
# list of what the layer is missing (milestoneA.md, "Outputs of the experiment").
#
# It never restates a fact the layer, the models or the warehouse already hold. Members, coverage
# and joins are derived from those sources at run time (ontology.parameters). Additivity is derived
# from each measure's `agg` (agent.core.measure). Absence is derived from the complete list of what
# the warehouse captures (ontology.graph), so no list of absent concepts is kept here.
#
# Read by: ground.py (methodological_rules). The other sections are the documented overlay and the
# source for the contested case in 01_parameter_grounding/cases.yml.

# ── named segments (Cube: segment; MetricFlow: metric filter) ─────────────────────────────────
# The layer applies `is_internal = false` inside two metrics' filters. What the filter means, who
# owns it and how firm it is are not declared anywhere, which is how the contested pair came about.
segments:
  customers:
    kind: segment
    entity: user
    filter: "is_internal = false"
    means: "External accounts: real customers, excluding staff and test accounts."
    owner: Product
    evidence: decided
    status: certified
    note: >-
      The is_internal rule itself rests on two undocumented signals (an internal flag and an
      @internal-test.com email) and reads silence as external: 271 accounts say nothing. That
      judgement lives in stg_users.sql, not in any declaration.
  all_accounts:
    kind: segment
    entity: user
    filter: none
    means: "Every account, internal and test included. Used for load and capacity, not customers."
    owner: Platform
    evidence: decided
    status: certified
  active_book:
    kind: segment
    entity: subscription
    filter: "status = 'active'"
    means: "Subscription terms currently active: the paying book."
    owner: Finance
    evidence: decided
    status: certified

# ── per-measure governance: owner, status, and the segment its filter applies ──────────────────
measures:
  app_opens:
    owner: Product
    status: certified
    segment: customers
  active_users:
    owner: Product
    status: certified
    segment: customers
  active_accounts:
    owner: Platform
    status: certified
    segment: all_accounts
  value_moments:
    owner: Product
    status: certified
    segment: customers

# ── per-attribute governance ──────────────────────────────────────────────────────────────────
attributes:
  is_internal:
    status: certified
    note: "The customer/internal split. Derived in staging from two undocumented raw signals."
  platform:
    status: certified
    note: "unknown is a real member: accounts whose raw platform was blank or unrecognised."

# ── vocabulary: a term maps to a SET of candidates, never to one object ────────────────────────
# A term with two measure candidates is a question that has two governed answers.
vocabulary:
  "app opens":      {kind: measure,   candidates: [app_opens]}
  "opens":          {kind: measure,   candidates: [app_opens]}
  "users":          {kind: measure,   candidates: [active_users, active_accounts]}
  "active users":   {kind: measure,   candidates: [active_users, active_accounts]}
  "customers":      {kind: segment, candidates: [customers]}
  "android":        {kind: filter,    candidates: ["platform=android"]}
  "ios":            {kind: filter,    candidates: ["platform=ios"]}
  "web":            {kind: filter,    candidates: ["platform=web"]}
  "paid search":    {kind: filter,    candidates: ["channel=paid_search"]}

# ── relationships between definitions ─────────────────────────────────────────────────────────
# A contested pair carries a policy: which definition each consumer gets by default.
relationships:
  - id: rel_active_user_definition
    type: contested
    members: [active_users, active_accounts]
    differs_in: segment
    means: "Both count distinct active accounts; they differ only on whether internal/test are in."
    owner: unassigned
    evidence: verified
    status: open
    policy:
      default_by_consumer:
        product_review: active_users
        capacity_planning: active_accounts
      note: "No cross-team owner. Absent a consumer, the pair is genuinely ambiguous."

# ── methodological rules: a governed default for a parameter the question leaves open ──────────
# The model names the rule; ground.py applies its value deterministically and discloses it. If no
# rule fits, the parameter is left unset or the agent asks.
methodological_rules:
  - id: trend_granularity
    slot: time_grain
    when: "a time series is requested (group_by includes metric_time) but no bucket is grounded"
    target_points: [15, 40]
    prefer: coarsest_in_range
    # Every bucket must lie wholly inside the period. Without this, the engine answers "the first half
    # of 2026 by week" with whole weeks, so the first and last points silently include 29-31 Dec 2025
    # and 1-5 Jul 2026 (404 and 2,059 instead of 221 and 615). Among grains that fit, the range applies.
    buckets_within_period: true
    rationale: "A trend needs enough points to show its shape and few enough to read: 15-40. Day is
      usually too granular, month too coarse over a short span; the rule computes the fit from the
      span rather than guessing. A bucket that crosses the period's edge reports data from outside
      the period, so only grains whose buckets line up with the period are considered."
    owner: analytics
    status: certified
  - id: canonical_segments
    slot: group_by
    when: "an unspecified breakdown is asked ('by segment', 'across the business') with no dimension named"
    default: [activity__platform, activity__region, activity__channel]
    # One breakdown per dimension, not a cross-table: "the standard segments" means three views an
    # analyst reads side by side, and a single group_by over all three returns every combination.
    combine: separate
    disclose: "broken down by the standard business segments: platform (product), region (sales), channel (marketing)"
    rationale: "A senior analyst's first-pass breakdown is the canonical high-level business segments,
      not one arbitrary dimension. Showing all three is the analysis; it is not a fork worth a clarify."
    owner: analytics
    status: certified
