# (02_readiness_audit/tests_dev.yml, 28) and controlled-test item (controlled_items.yml, 18).
#
# figures:   one item per separate number asked for; an item lists its terms as [quote, keep].
#            keep: false = "everything except". The thing counted (the metric) and time words are
#            not terms. A quote matches when one of the two contains the other (case ignored).
# time:      TIMEX3-style values: YYYY-MM, YYYY-Qn, YYYY-Hn, YYYY, YYYY-SP|SU|FA|WI (seasons).
#            Empty when the question names no period.
# series:    null (one number per figure), "trend" (change over time, no unit stated), or a unit.
# breakdown: quotes naming a category to split by.
