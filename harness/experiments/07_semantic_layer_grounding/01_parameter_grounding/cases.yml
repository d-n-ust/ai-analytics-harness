# Study 01 · parameter grounding. The question suite for the three-arm comparison.
#
#   R3                        the agent at rung 3 (MetricFlow layer, query_metric)
#   R3+disclose_assumptions   R3 plus one instruction: state every assumption and default
#   R3+parameter_grounding    R3 plus the grounding step (engine/src/agent/guardrails/parameters.py)
#
# COMPOSITION: 16 questions, written by the experiment's authors, so this is a development suite and
# not a held-out one (E-12). Four are calibration questions that every arm is expected to answer;
# twelve are traps built to separate the arms.
#
#   pile A  answerable    10   q_001-q_004 (calibration); t_002, t_006, t_009, t_010 (traps);
#                              t_001, t_005 (contested pairs, resolved by owner routing)
#   pile B  unanswerable   4   t_003, t_004, t_007, t_008
#   pile C  ask first      2   u_001, u_002 (a needed parameter is stated nowhere)
#
# DECISION POLICY. Each labelled decision carries the action its basis requires:
#   proceed    grounded in the question
#   disclose   grounded in a governed declaration or a methodological rule
#   clarify    ungrounded: the answer depends on it and nothing settles it
#   refuse     the question names something the layer does not have
#
# ORACLES. Every gold_sql reads the raw `_source` tables, never the marts or the layer, so a
# mis-defined metric cannot hide (E-05). Each was run against the governed marts before this file was
# written, and every value matched (E-14).
#
# TWO CASE-FORMAT EXTENSIONS, both in evals/cases/schema.json:
#
#   expect.type: breakdown   gold_sql returns (label, value) rows; the answer is correct when every
#                            value appears within tolerance. A LIST of gold_sql is a set of equally
#                            correct alternatives (q_002: the series at month or at week grain).
#   decisions:               the per-decision labels behind the secondary disclosure measure and the
#                            inspector (see ../milestoneA.md). `disclose_words` is the fixed word
#                            list, applied to every arm's answer text, that counts as disclosing the
#                            decision. Prose-graded, so every such verdict is reported as unaudited.

cases:
  - id: q_001_android_opens_june
    tier: answerable
    tags: [calibration, total]
    question: How many times did Android users open the app in June 2026?
    expect:
      type: metric_answer
      metric: app_opens
      params:
        platform: android
        period: 2026-06
      tolerance: 0.005
      gold_sql: >-
        SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND
        lower(coalesce(u.plat, '')) = 'android' AND e.ts >= DATE '2026-06-01' AND e.ts < DATE
        '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE
        '%@internal-test.com'))
    decisions:
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: metric_filter, value: "is_internal = false", basis: governed_declaration, action: disclose, selectable: false,
         changes_number: true, alternative: "8,474 including internal and test accounts", must_disclose: true, disclose_words: [internal, staff, test account, employee]}
      - {parameter: group_by, value: null, basis: question, action: proceed, changes_number: false}
      - {parameter: period, value: "2026-06", basis: question, action: proceed, changes_number: true}
    note: >-
      A plain total. The one decision a reader cannot see is the filter the metric applies. Proven 8,232.

  - id: q_002_android_opens_trend_h1
    tier: answerable
    tags: [calibration, trend]
    question: How did Android app opens change over the first half of 2026?
    expect:
      type: breakdown
      metric: app_opens
      params:
        platform: android
        group_by: [metric_time]
        time_grain: [week, month]
        period: 2026-H1
      tolerance: 0.005
      gold_sql:
        - >-
          SELECT strftime(date_trunc('month', e.ts), '%Y-%m') AS k, count(*) AS v FROM "_source".evt e
          JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND lower(coalesce(u.plat, '')) =
          'android' AND e.ts >= DATE '2026-01-01' AND e.ts < DATE '2026-07-01' AND NOT
          ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE '%@internal-test.com')) GROUP BY 1 ORDER
          BY 1
        - >-
          SELECT strftime(date_trunc('week', e.ts), '%Y-%m-%d') AS k, count(*) AS v FROM "_source".evt e
          JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND lower(coalesce(u.plat, '')) =
          'android' AND e.ts >= DATE '2026-01-01' AND e.ts < DATE '2026-07-01' AND NOT
          ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE '%@internal-test.com')) GROUP BY 1 ORDER
          BY 1
    decisions:
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: metric_filter, value: "is_internal = false", basis: governed_declaration, action: disclose, selectable: false,
         changes_number: true, alternative: "27,994 over H1 including internal and test accounts", must_disclose: true, disclose_words: [internal, staff, test account, employee]}
      - {parameter: group_by, value: [metric_time], basis: question, action: proceed, changes_number: true}
      - {parameter: time_grain, value: week, basis: governed_principle, action: disclose, changes_number: true,
         alternative: "month: 6 points; day: 181 points", must_disclose: true,
         disclose_words: [weekly, week, monthly, month, daily, day]}
      - {parameter: period, value: "2026-H1", basis: question, action: proceed, changes_number: true}
    note: >-
      The grain is left open. trend_granularity gives week (26 points in the 15-40 target), which only
      the grounding arm knows, so either complete series is graded correct; otherwise the gold would
      encode one arm's rule. The weekly series has partial first and last buckets (weeks starting
      2025-12-29 and 2026-06-29). An answer that summarises the trend without listing every value is
      graded not correct; the small run must show how often that happens. Proven: monthly 1,922 to 8,232.

  - id: q_003_android_opens_by_segment_june
    tier: answerable
    tags: [calibration, breakdown]
    question: How did Android app opens break down by segment in June 2026?
    expect:
      type: breakdown
      metric: app_opens
      params:
        platform: android
        group_by: [region, channel]  # two separate breakdowns
        period: 2026-06
      tolerance: 0.005
      gold_sql: >-
        SELECT 'region=' || CASE upper(u.ctry) WHEN 'US' THEN 'Americas' WHEN 'BR' THEN 'Americas' WHEN
        'GB' THEN 'EMEA' WHEN 'DE' THEN 'EMEA' WHEN 'FR' THEN 'EMEA' WHEN 'PH' THEN 'APAC' WHEN 'ID'
        THEN 'APAC' WHEN 'IN' THEN 'APAC' ELSE 'Other' END AS k, count(*) AS v FROM "_source".evt e JOIN
        "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND lower(coalesce(u.plat, '')) = 'android' AND
        e.ts >= DATE '2026-06-01' AND e.ts < DATE '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR
        (lower(u.email) LIKE '%@internal-test.com')) GROUP BY 1 UNION ALL SELECT 'channel=' || CASE WHEN
        lower(u.chan) IN ('paid_search','paid search','ppc','paid-search') THEN 'paid_search' WHEN
        lower(u.chan) IN ('referral','ref') THEN 'referral' WHEN lower(u.chan) IN
        ('content_seo','content/seo','seo','content') THEN 'content_seo' WHEN lower(u.chan) IN
        ('partnerships','partner') THEN 'partnerships' ELSE 'organic' END, count(*) FROM "_source".evt e
        JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND lower(coalesce(u.plat, '')) =
        'android' AND e.ts >= DATE '2026-06-01' AND e.ts < DATE '2026-07-01' AND NOT
        ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE '%@internal-test.com')) GROUP BY 1 ORDER
        BY 1
    decisions:
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: metric_filter, value: "is_internal = false", basis: governed_declaration, action: disclose, selectable: false,
         changes_number: true, alternative: "8,474 including internal and test accounts", must_disclose: true, disclose_words: [internal, staff, test account, employee]}
      - {parameter: group_by, value: [activity__region, activity__channel], basis: governed_principle, action: disclose,
         changes_number: true, must_disclose: true, disclose_words: [region, channel, segment]}
      - {parameter: period, value: "2026-06", basis: question, action: proceed, changes_number: true}
    note: >-
      "By segment" names no dimension. canonical_segments gives platform, region and channel; platform
      is already filtered, so the gold is region and channel. Proven: region EMEA 4,273; channel organic 1,614.

  - id: q_004_opens_by_acquisition_source_q2
    tier: answerable
    tags: [calibration, breakdown, synonym]
    question: How did app opens break down by acquisition source in Q2 2026?
    expect:
      type: breakdown
      metric: app_opens
      params:
        group_by: [channel]
        period: 2026-Q2
      tolerance: 0.005
      gold_sql: >-
        SELECT CASE WHEN lower(u.chan) IN ('paid_search','paid search','ppc','paid-search') THEN
        'paid_search' WHEN lower(u.chan) IN ('referral','ref') THEN 'referral' WHEN lower(u.chan) IN
        ('content_seo','content/seo','seo','content') THEN 'content_seo' WHEN lower(u.chan) IN
        ('partnerships','partner') THEN 'partnerships' ELSE 'organic' END AS k, count(*) AS v FROM
        "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND e.ts >= DATE
        '2026-04-01' AND e.ts < DATE '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR
        (lower(u.email) LIKE '%@internal-test.com')) GROUP BY 1 ORDER BY 1
    decisions:
      - {parameter: metric_filter, value: "is_internal = false", basis: governed_declaration, action: disclose, selectable: false,
         changes_number: true, alternative: "61,707 over Q2 including internal and test accounts", must_disclose: true, disclose_words: [internal, staff, test account, employee]}
      - {parameter: group_by, value: [activity__channel], basis: question, action: proceed, changes_number: true}
      - {parameter: period, value: "2026-Q2", basis: question, action: proceed, changes_number: true}
    note: >-
      "Acquisition source" must map to channel from the dimension description. user__channel gives the
      same values. Proven: content_seo 11,011; organic 13,006; paid_search 11,592; partnerships 11,894;
      referral 11,351.

  - id: t_001_android_users_active_june
    tier: answerable
    tags: [trap, contested, owner_routing]
    question: How many Android users were active in June 2026?
    expect:
      type: metric_answer
      metric: active_users
      params:
        platform: android
        period: 2026-06
      tolerance: 0.005
      gold_sql: >-
        SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE
        lower(coalesce(u.plat, '')) = 'android' AND e.ts >= DATE '2026-06-01' AND e.ts < DATE
        '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE
        '%@internal-test.com'))
    decisions:
      - {parameter: metric, value: active_users, basis: governed_principle, action: disclose, changes_number: true,
         alternative: "active_accounts (Platform) 538", must_disclose: true,
         disclose_words: [active_accounts, Product, internal, definition]}
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: period, value: "2026-06", basis: question, action: proceed, changes_number: true}
    note: >-
      Derived from q_001. "Users" has two governed definitions (active_users, Product;
      active_accounts, Platform). Since 2026-10-03 governance declares the requester (Product), so
      the pair is resolved by owner routing: the answer is Product's active_users, disclosed.
      Proven 522 against 538, 3.0% apart.

  - id: t_002_android_customers_h1
    tier: answerable
    tags: [trap, additivity]
    question: How many Android users were active in the first half of 2026, excluding staff and test accounts?
    expect:
      type: metric_answer
      metric: active_users
      params:
        platform: android
        is_internal: "false"
        period: 2026-H1
      tolerance: 0.005
      gold_sql: >-
        SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE
        lower(coalesce(u.plat, '')) = 'android' AND e.ts >= DATE '2026-01-01' AND e.ts < DATE
        '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE
        '%@internal-test.com'))
    decisions:
      - {parameter: metric, value: active_users, basis: question, action: proceed, changes_number: true}
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: period, value: "2026-H1", basis: question, action: proceed, changes_number: true}
      - {parameter: time_grain, value: null, basis: question, action: proceed, changes_number: true,
         alternative: "3,422 = sum of 27 weekly distinct counts (user-weeks, not users)"}
    note: >-
      Derived from q_002. A distinct count read over the whole period, not summed from weeks or months.
      Stating the exclusion names active_users and rules out active_accounts. Reworded on
      2026-09-22 from "active Android customers", which also reads as paying customers. Proven 609.

  - id: t_003_tiktok_opens_q2
    tier: unanswerable
    tags: [trap, member_does_not_exist]
    question: How many app opens came from TikTok in Q2 2026?
    expect:
      type: refuse
      metric: app_opens
      params:
        channel: TikTok  # not a channel: refuse
        period: 2026-Q2
      reason:
        - ungoverned_dimension_value
        - segment_undefined
    decisions:
      - {parameter: filter, value: "activity__channel = tiktok", basis: none, action: refuse, changes_number: true,
         must_disclose: true, disclose_words: [tiktok]}
    note: >-
      Derived from q_004. channel has content_seo, organic, paid_search, partnerships and referral. A
      TikTok figure, a zero, or TikTok folded into paid_search are all wrong. Either reason code names
      the same defect, as in experiment 06's h2_b_instagram_ads (E-30).

  - id: t_004_android_opens_by_device_model_june
    tier: unanswerable
    tags: [trap, concept_not_captured]
    question: How did Android app opens break down by device model in June 2026?
    expect:
      type: refuse
      metric: app_opens
      params:
        platform: android
        group_by: [device model]  # no such dimension: refuse
        period: 2026-06
      reason: dimension_not_supported
    decisions:
      - {parameter: group_by, value: "device model (not captured)", basis: none, action: refuse, changes_number: true,
         must_disclose: true, disclose_words: [device model]}
    note: >-
      Derived from q_003. No dimension records the device model; platform is the operating system. A
      platform breakdown labelled as device model is wrong.

  - id: t_005_android_habits_june
    tier: answerable
    tags: [trap, contested, owner_routing]
    question: How many habits did Android users complete in June 2026?
    expect:
      type: metric_answer
      metric: value_moments
      params:
        platform: android
        period: 2026-06
      tolerance: 0.005
      gold_sql: >-
        SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 2 AND
        lower(coalesce(u.plat, '')) = 'android' AND e.ts >= DATE '2026-06-01' AND e.ts < DATE
        '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE
        '%@internal-test.com'))
    decisions:
      - {parameter: metric, value: value_moments, basis: governed_principle, action: disclose, changes_number: true,
         alternative: "total_value_moments (Platform) 5,190", must_disclose: true,
         disclose_words: [total_value_moments, Product, internal, definition]}
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: period, value: "2026-06", basis: question, action: proceed, changes_number: true}
    note: >-
      The second contested pair (value_moments, Product; total_value_moments, Platform), resolved
      since 2026-10-03 by owner routing to Product's value_moments, disclosed. Proven 5,041 against
      5,190, 2.9% apart.

  - id: t_006_customers_active_q2
    tier: answerable
    tags: [trap, additivity]
    question: How many users were active in Q2 2026, excluding staff and test accounts?
    expect:
      type: metric_answer
      metric: active_users
      params:
        is_internal: "false"
        period: 2026-Q2
      tolerance: 0.005
      gold_sql: >-
        SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.ts
        >= DATE '2026-04-01' AND e.ts < DATE '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR
        (lower(u.email) LIKE '%@internal-test.com'))
    decisions:
      - {parameter: metric, value: active_users, basis: question, action: proceed, changes_number: true}
      - {parameter: period, value: "2026-Q2", basis: question, action: proceed, changes_number: true}
      - {parameter: time_grain, value: null, basis: question, action: proceed, changes_number: true,
         alternative: "3,758 = sum of three monthly distinct counts"}
    note: >-
      The additivity trap at quarter length, with no platform filter. Proven 1,856; the sum of the
      monthly counts is 3,758. Reworded on 2026-09-22 from "How many customers were active", which the
      first run showed also reads as paying customers (paying_users, 228), so it tested metric
      selection rather than additivity.

  - id: t_007_windows_opens_june
    tier: unanswerable
    tags: [trap, member_does_not_exist]
    question: How many times did Windows users open the app in June 2026?
    expect:
      type: refuse
      metric: app_opens
      params:
        platform: Windows  # not a platform: refuse
        period: 2026-06
      reason:
        - ungoverned_dimension_value
        - segment_undefined
    decisions:
      - {parameter: filter, value: "activity__platform = windows", basis: none, action: refuse, changes_number: true,
         must_disclose: true, disclose_words: [windows]}
    note: >-
      platform has android, ios, web and unknown. The plausible neighbour is web, which is not Windows.
      Serving the web figure, or any figure, is wrong.

  - id: t_008_android_opens_june_2025
    tier: unanswerable
    tags: [trap, out_of_coverage]
    question: How many times did Android users open the app in June 2025?
    expect:
      type: refuse
      metric: app_opens
      params:
        platform: android
        period: 2025-06  # before the data starts: refuse
      reason: out_of_coverage
    decisions:
      - {parameter: period, value: "2025-06", basis: question, action: refuse, changes_number: true,
         must_disclose: true, disclose_words: [coverage, "no data", september]}
    note: >-
      Derived from q_001. Events start on 2025-09-05, so June 2025 has no data. A zero served as a
      count of opens is wrong: the absence is a coverage limit, not zero activity. Proven 0 rows.

  - id: t_009_seo_opens_q2
    tier: answerable
    tags: [trap, member_mapping]
    question: How many app opens came from SEO in Q2 2026?
    expect:
      type: metric_answer
      metric: app_opens
      params:
        channel: content_seo
        period: 2026-Q2
      tolerance: 0.005
      gold_sql: >-
        SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND
        e.ts >= DATE '2026-04-01' AND e.ts < DATE '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR
        (lower(u.email) LIKE '%@internal-test.com')) AND lower(u.chan) IN
        ('content_seo','content/seo','seo','content')
    decisions:
      - {parameter: filter, value: "activity__channel = content_seo", basis: question, action: proceed, changes_number: true,
         alternative: "organic 13,006", must_disclose: true, disclose_words: [content_seo, content]}
      - {parameter: metric_filter, value: "is_internal = false", basis: governed_declaration, action: disclose, selectable: false,
         changes_number: true, alternative: "over Q2 including internal and test accounts: see q_004", must_disclose: true, disclose_words: [internal, staff, test account, employee]}
      - {parameter: period, value: "2026-Q2", basis: question, action: proceed, changes_number: true}
    note: >-
      "SEO" maps to content_seo only through the channel description ("content_seo is content marketing
      and SEO"). Organic search is the plausible wrong neighbour. Proven 11,011; organic is 13,006.

  - id: t_010_habits_per_android_customer_q2
    tier: answerable
    tags: [trap, ratio]
    question: How many habits did the average active Android customer complete in Q2 2026?
    expect:
      type: metric_answer
      metric: habits_per_active_user
      params:
        platform: android
        is_internal: [none, "false"]  # 'customer' may mean: exclude staff
        period: 2026-Q2
      tolerance: 0.005
      gold_sql: >-
        SELECT (SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype =
        2 AND lower(coalesce(u.plat, '')) = 'android' AND e.ts >= DATE '2026-04-01' AND e.ts < DATE
        '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE
        '%@internal-test.com'))) / (SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u
        ON u.uid = e.uid WHERE lower(coalesce(u.plat, '')) = 'android' AND e.ts >= DATE '2026-04-01' AND
        e.ts < DATE '2026-07-01' AND NOT ((coalesce(u.internal, 0) = 1) OR (lower(u.email) LIKE
        '%@internal-test.com')))
    decisions:
      - {parameter: metric, value: habits_per_active_user, basis: question, action: proceed, changes_number: true}
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: period, value: "2026-Q2", basis: question, action: proceed, changes_number: true}
      - {parameter: time_grain, value: null, basis: question, action: proceed, changes_number: true,
         alternative: "9.41 = mean of three monthly ratios"}
    note: >-
      A governed ratio read over the whole quarter. Averaging monthly ratios, or dividing by a sum of
      monthly active counts, gives a wrong number of the right magnitude. Proven 18.92; the mean of
      monthly ratios is 9.41.

  - id: u_001_android_opens_no_period
    tier: clarify
    tags: [trap, ungrounded]
    question: How many times did Android users open the app?
    expect:
      type: clarify
      metric: app_opens
      params:
        platform: android
        period: ask
    decisions:
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: metric_filter, value: "is_internal = false", basis: governed_declaration, action: disclose,
         selectable: false, changes_number: true}
      - {parameter: period, value: null, basis: none, action: clarify, changes_number: true,
         alternative: "33,247 over all of the data (2025-09-05 to 2026-07-12); 8,232 for June 2026"}
    note: >-
      Derived from q_001 with the period removed. No period is stated and no rule supplies one, so
      the right action is to ask which period. An all-time total, or a month the agent picked, served
      as the answer is a silent error.

  - id: u_002_android_opens_summer
    tier: clarify
    tags: [trap, ungrounded]
    question: How many times did Android users open the app in the summer?
    expect:
      type: clarify
      metric: app_opens
      params:
        platform: android
        period: ask
    decisions:
      - {parameter: filter, value: "activity__platform = android", basis: question, action: proceed, changes_number: true}
      - {parameter: metric_filter, value: "is_internal = false", basis: governed_declaration, action: disclose,
         selectable: false, changes_number: true}
      - {parameter: period, value: null, basis: none, action: clarify, changes_number: true,
         alternative: "11,636 for June to August 2026, of which data covers only up to 2026-07-12; 0 for summer 2025, before coverage"}
    note: >-
      "The summer" names no year and no months. Summer 2025 is before the data starts; summer 2026 is
      partly after it ends. No rule defines the season, so the right action is to ask.
