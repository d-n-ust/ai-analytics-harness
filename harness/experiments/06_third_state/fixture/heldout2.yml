# HELD-OUT SUITE 2 — authored 2026-09-02 after the §36-§49 campaign, because the first held-out
# suite stopped being held out: 28 full-suite runs were taken against it while ten mechanisms were
# iterated, several fixes were written against its specific questions, and its headline therefore
# measures FIT (§17's own standard). This file restores the measurement.
#
# Authored from the schema, the metric catalogue and the pile definitions only, under §17's
# protocol. PROTOCOL-BLIND, NOT AUTHOR-BLIND, and that is recorded honestly: the author is the
# same session that built the mechanisms, so blindness is enforced by the procedure (shapes derived
# from the schema and catalogue; every oracle executed and every pile membership PROVED by
# heldout2_prove.py before this file was written), not by ignorance.
#
# What the proofs changed during authoring — the guard doing its job on its author:
#   - plain habit/active-user questions are CONTESTED, not answerable: one drafted as pile A
#     (habits in the Americas in April) diverges 6.3% and was moved to pile C;
#   - the `answerable_cancel` tier is EMPTY here: the proof search over every month-pair (habit
#     deltas, spend deltas) and every last-week slice (region, country, channel) found no cancel
#     slice that suite 1 had not already taken, except a degenerate zero-growth one; the two slots
#     went to pile-A coverage instead of a manufactured case;
#   - a drafted contested spend window (H2 2025) straddles the start of the spend data and was
#     replaced with Q4 2025, which is fully covered.
#
# Piles: A answerable (plain / stated scope / the two readings agree here)  17
#        B unanswerable (adjacent / bare / out of coverage / false premise) 15
#        C contested (level / derived)                                      14

cases:
# ── pile A · answerable ──────────────────────────────────────────────────────────────────────
- id: h2_a_web_opens_march
  tier: answerable
  question: How many times did users on the web open the app in March 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: app_opens
    gold_sql: SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype=1 AND lower(coalesce(u.plat,''))='web'
      AND e.ts >= DATE '2026-03-01' AND e.ts < DATE '2026-04-01' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email)
      LIKE '%@internal-test.com'))
  note: entity + segment (platform) + window; proven 4269
- id: h2_a_referral_signups_q4
  tier: answerable
  question: How many people signed up through referrals in the fourth quarter of 2025?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: new_signups
    gold_sql: SELECT count(*) FROM "_source".u WHERE lower(chan) IN ('referral','ref') AND created >= DATE '2025-10-01'
      AND created < DATE '2026-01-01'
  note: entity + segment (channel, spelled two ways in the raw data) + window; proven 62
- id: h2_a_annual_subs_live
  tier: answerable
  question: How many annual-plan subscriptions are currently live?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: active_subscriptions
    gold_sql: SELECT count(*) FROM "_source".subs WHERE st=1 AND p='a'
  note: entity + segment (plan) + implicit current state; proven 134
- id: h2_a_signups_germany_h1
