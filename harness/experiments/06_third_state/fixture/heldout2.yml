# ── pile A · governed ratio ──────────────────────────────────────────────────────────────────
- id: h2_a_habits_per_user_march
  tier: governed_ratio
  question: On average, how many habits did each active user complete in March 2026?
  expect:
    type: metric_answer
    tolerance: 0.02
    metric: habits_per_active_user
    gold_sql: SELECT (SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype=2 AND
      e.ts >= DATE '2026-03-01' AND e.ts < DATE '2026-04-01' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email)
      LIKE '%@internal-test.com'))) * 1.0 / (SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u
      ON u.uid = e.uid WHERE e.ts >= DATE '2026-03-01' AND e.ts < DATE '2026-04-01' AND NOT ((coalesce(u.internal,0)=1)
      OR (lower(u.email) LIKE '%@internal-test.com')))
  note: the governed ratio metric answers it whole; proven 9.77
