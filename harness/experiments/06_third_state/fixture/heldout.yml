# HELD-OUT SUITE — authored after the mechanisms were frozen, from the schema, the metric
# catalogue and the pile definitions only. No question here was written by looking at which of the
# original sixteen fail, which is the whole point: every guardrail in this experiment was chosen
# after watching `cases.yml` break, so `cases.yml` is now partly a training set and cannot measure
# generalisation.
#
# EVERY ORACLE WAS EXECUTED AND EVERY PILE MEMBERSHIP PROVED BEFORE THIS FILE WAS WRITTEN. An
# `answerable_agree` case must return the SAME figure under both governed readings; a `contested`
# case must return different ones. Three questions failed that check during authoring and were
# moved or replaced — habits May-to-June does not cancel (3,689 against 3,792), no Q2 subscription
# was ever refunded so mrr and gross_mrr agree for that window, and the doubly-contested ratio
# diverges by 0.19%, which is narrower than the default tolerance and needed its own.
#
# The red-teaming is in the SHAPE of the questions, not in knowledge of which ones break. Pile B is
# deliberately loaded: a third of it has plausible adjacent data, which is a stress test rather
# than a natural distribution, and its refusal rate must be read as such.
#
# Piles: A answerable (plain / stated scope / the two readings agree here / the divergence cancels)
#        B unanswerable (nothing adjacent / something adjacent / out of coverage / false premise)
#        C contested (level / derived)

cases:
- id: h_a_ios_opens_may
  tier: answerable
  question: How many times did iOS users open the app in May 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: app_opens
    gold_sql: SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype=1 AND lower(coalesce(u.plat,''))='ios'
      AND e.ts >= DATE '2026-05-01' AND e.ts < DATE '2026-06-01' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email)
      LIKE '%@internal-test.com'))
  note: entity + segment (platform) + window
- id: h_a_seo_signups_q1
  tier: answerable
  question: How many people signed up through content and SEO in the first quarter of 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: new_signups
    gold_sql: SELECT count(*) FROM "_source".u WHERE lower(chan) in ('content_seo','content/seo','seo','content')
      AND created >= DATE '2026-01-01' AND created < DATE '2026-04-01'
  note: entity + segment (channel, spelled four ways in the raw data) + window
- id: h_a_monthly_paying_users
  tier: answerable
  question: How many customers are currently paying us on the monthly plan?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: paying_users
    gold_sql: SELECT count(DISTINCT uid) FROM "_source".subs WHERE st=1 AND p='m'
  note: entity + segment (plan) + implicit current state
- id: h_a_subs_started_june
  tier: answerable
  question: How many subscriptions that started in June 2026 are still live?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: active_subscriptions
    gold_sql: SELECT count(*) FROM "_source".subs WHERE st=1 AND "start" >= DATE '2026-06-01' AND "start" < DATE
      '2026-07-01'
  note: entity + window + state
- id: h_a_apac_signups_q2
  tier: answerable
  question: How many people signed up in the APAC region during the second quarter of 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: new_signups
    gold_sql: SELECT count(*) FROM "_source".u WHERE upper(ctry) IN ('PH','ID','IN') AND created >= DATE '2026-04-01'
      AND created < DATE '2026-07-01'
  note: entity + segment (region, derived from country) + window
- id: h_a_app_opens_emea_h1
  tier: answerable
  question: How many times did users in the EMEA region open the app in the first half of 2026?
  expect:
    type: metric_answer
    metric: app_opens
    tolerance: 0.02
    gold_sql: SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype = 1 AND upper(u.ctry)
      IN ('GB','DE','FR') AND e.ts >= DATE '2026-01-01' AND e.ts < DATE '2026-07-01' AND NOT ((coalesce(u.internal,0)=1)
      OR (lower(u.email) LIKE '%@internal-test.com'))
  note: entity + segment (region, derived from country) + window; app_opens is a clean metric that excludes internal
    accounts by definition, so the oracle does too. Replaces a "which category" question that was mis-typed as metric_answer
    — its answer is a name, not a number.
- id: h_a_active_users_android_stated
  tier: answerable_stated
  question: How many active users, excluding staff and test accounts, did we have on Android last week?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: active_users
    gold_sql: SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE CAST(date_trunc('week',
      e.ts) AS DATE) = DATE '2026-07-06' AND lower(coalesce(u.plat,''))='android' AND NOT ((coalesce(u.internal,0)=1)
      OR (lower(u.email) LIKE '%@internal-test.com'))
  note: contested concept, scope stated by the asker
- id: h_a_habits_emea_june_stated
  tier: answerable_stated
  question: How many habits did real customer accounts complete in EMEA in June 2026, excluding internal and test
    accounts?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: value_moments
    gold_sql: SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype=2 AND upper(u.ctry)
      IN ('GB','DE','FR') AND e.ts >= DATE '2026-06-01' AND e.ts < DATE '2026-07-01' AND NOT ((coalesce(u.internal,0)=1)
      OR (lower(u.email) LIKE '%@internal-test.com'))
  note: contested concept, scope stated
- id: h_a_acquisition_spend_q2_stated
  tier: answerable_stated
  question: What did we spend on real acquisition channels in the second quarter of 2026, excluding the partnerships
    test integration?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: acquisition_spend
    gold_sql: SELECT round(sum(amt),2) FROM "_source".spend WHERE dt >= DATE '2026-04-01' AND dt < DATE '2026-07-01'
      AND NOT lower(chan) in ('partnerships','partner')
  note: contested concept, scope stated
- id: h_a_gross_mrr_ytd_stated
  tier: answerable_stated
  question: Counting every term we sold including the ones later refunded, how much monthly recurring revenue have
    subscriptions started this year brought in?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: gross_mrr
    gold_sql: SELECT round(sum(CASE WHEN p='a' THEN amt/12.0 ELSE amt END),2) FROM "_source".subs WHERE st IN (1,4)
      AND "start" >= DATE '2026-01-01'
  note: contested concept, scope stated on the gross side; the window is chosen so the two readings differ
- id: h_a_mrr_q2_starts_agree
  tier: answerable_agree
  question: How much monthly recurring revenue came from subscriptions that started in the second quarter?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: mrr
    gold_sql: SELECT round(sum(CASE WHEN p='a' THEN amt/12.0 ELSE amt END),2) FROM "_source".subs WHERE st = 1 AND
      "start" >= DATE '2026-04-01' AND "start" < DATE '2026-07-01'
  note: looks contested; no Q2 term was refunded, so mrr and gross_mrr return the same figure
- id: h_a_paid_search_spend_q2
  tier: answerable_agree
  question: What did we spend on paid search in the second quarter of 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: marketing_spend
    gold_sql: SELECT round(sum(amt),2) FROM "_source".spend WHERE lower(chan) in ('paid_search','paid search','ppc','paid-search')
      AND dt >= DATE '2026-04-01' AND dt < DATE '2026-07-01'
  note: LOOKS contested, but the slice excludes partnerships so both spend definitions return the same figure
- id: h_a_seo_spend_june
  tier: answerable_agree
  question: How much did we spend on content and SEO in June 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: marketing_spend
    gold_sql: SELECT round(sum(amt),2) FROM "_source".spend WHERE lower(chan) in ('content_seo','content/seo','seo','content')
      AND dt >= DATE '2026-06-01' AND dt < DATE '2026-07-01'
  note: same shape, different channel and window
- id: h_a_active_users_unknown_plat
  tier: answerable_agree
  question: How many active users did we have last week on devices where the platform is not recorded?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: active_users
    gold_sql: SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE CAST(date_trunc('week',
      e.ts) AS DATE) = DATE '2026-07-06' AND lower(coalesce(u.plat,'')) NOT IN ('ios','android','web') AND NOT ((coalesce(u.internal,0)=1)
      OR (lower(u.email) LIKE '%@internal-test.com'))
  note: contested pair, slice containing no internal account, so the two agree
- id: h_a_active_users_growth
  tier: answerable_cancel
  question: By how many did active users grow last week compared with the week before?
  expect:
    type: metric_answer
    tolerance: 0.005
    no_governed_metric: true
    gold_sql: SELECT (SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE
      CAST(date_trunc('week', e.ts) AS DATE) = DATE '2026-07-06' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email)
      LIKE '%@internal-test.com'))) - (SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid
      = e.uid WHERE CAST(date_trunc('week', e.ts) AS DATE) = DATE '2026-06-29' AND NOT ((coalesce(u.internal,0)=1)
      OR (lower(u.email) LIKE '%@internal-test.com')))
  note: built on a contested metric; the internal population is stable so the DIFFERENCE is identical under both
    readings
- id: h_a_active_users_growth_web
  tier: answerable_cancel
  question: By how many did active users on the web platform grow last week compared with the week before?
  expect:
    type: metric_answer
    tolerance: 0.005
    no_governed_metric: true
    gold_sql: SELECT (SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE
      CAST(date_trunc('week', e.ts) AS DATE) = DATE '2026-07-06' AND lower(coalesce(u.plat,''))='web' AND NOT ((coalesce(u.internal,0)=1)
      OR (lower(u.email) LIKE '%@internal-test.com'))) - (SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN
      "_source".u u ON u.uid = e.uid WHERE CAST(date_trunc('week', e.ts) AS DATE) = DATE '2026-06-29' AND lower(coalesce(u.plat,''))='web'
      AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email) LIKE '%@internal-test.com')))
  note: same shape on one platform
