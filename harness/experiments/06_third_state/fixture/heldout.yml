    - false_premise
    rebuttal:
    - no enterprise
    - don't have an enterprise
    - not a plan
    - no such plan
    - annual
    - monthly
    - billing interval
  note: '''enterprise plan'' has no referent: `plan` is a billing interval (annual/monthly), not a tier. Refusing
    with any of {ungoverned_dimension_value, segment_undefined, false_premise} is correct; answering is correct
    only if it rebuts the premise rather than fabricating a count.'
