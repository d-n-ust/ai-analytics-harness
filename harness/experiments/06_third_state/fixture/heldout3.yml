  expect:
    type: metric_answer
    tolerance: 0.005
    metric: gross_mrr
    gold_sql: SELECT round(sum(CASE WHEN p='a' THEN amt/12.0 ELSE amt END),2) FROM "_source".subs WHERE st IN (1,4)
  note: scope names the gross (include-refunded) reading; proven 2754.0
- id: h3_a_habits_per_user_may
  tier: governed_ratio
  question: On average, how many habits did each active user complete in May 2026?
  expect:
    type: metric_answer
    tolerance: 0.02
    metric: habits_per_active_user
    gold_sql: SELECT (SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype=2 AND e.ts >= DATE '2026-05-01' AND e.ts < DATE '2026-06-01' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email) LIKE '%@internal-test.com'))) * 1.0 / (SELECT count(DISTINCT e.uid) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.ts >= DATE '2026-05-01' AND e.ts < DATE '2026-06-01' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email) LIKE '%@internal-test.com')))
  note: the governed ratio metric answers it whole; proven 9.70
