# HELD-OUT SUITE 3 — authored 2026-09-03 after heldout2 became a dev suite (27+ full-suite runs,
# fixes written against its traces; its headline now measures FIT). heldout3 restores a held-out
# measurement under the same §17 protocol: FRESH slices (months and segments heldout2 did not use),
# authored from the schema, the metric catalogue and the pile definitions only, mechanisms frozen.
# PROTOCOL-BLIND, NOT AUTHOR-BLIND: every oracle was executed and every pile membership PROVED by
# heldout3_prove.py before this file was written. Tier distribution matches heldout2 exactly.
cases:
- id: h3_a_android_opens_may
  tier: answerable
  question: How many times did users on Android open the app in May 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: app_opens
    gold_sql: SELECT count(*) FROM "_source".evt e JOIN "_source".u u ON u.uid = e.uid WHERE e.etype=1 AND e.ts >= DATE '2026-05-01' AND e.ts < DATE '2026-06-01' AND lower(coalesce(u.plat,''))='android' AND NOT ((coalesce(u.internal,0)=1) OR (lower(u.email) LIKE '%@internal-test.com'))
  note: entity+segment(platform)+window; proven 5674
- id: h3_a_paid_search_signups_q1
  tier: answerable
  question: How many people signed up through paid search in the first quarter of 2026?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: new_signups
    gold_sql: SELECT count(*) FROM "_source".u WHERE lower(chan) IN ('paid_search','paid-search','ppc','paid search') AND created >= DATE '2026-01-01' AND created < DATE '2026-04-01'
  note: entity+segment(channel)+window; proven 132
- id: h3_a_monthly_subs_live
