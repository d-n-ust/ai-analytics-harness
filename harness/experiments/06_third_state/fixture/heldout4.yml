  tier: answerable
  question: How many people signed up through referrals in October 2025?
  expect:
    type: metric_answer
    tolerance: 0.005
    metric: new_signups
    gold_sql: SELECT count(*) FROM "_source".u WHERE lower(chan) IN ('referral','ref') AND created>=DATE '2025-10-01' AND created<DATE '2025-11-01'
  note: channel(complete)+window; proven 16
