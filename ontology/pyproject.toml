[project]
name = "ai-analytics-ontology"
version = "0.1.0"
description = "The marts ontology: a closed-world graph of what the warehouse captures, for deciding answerability (instrumented / computable / uninstrumented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Ustimov" }]

# Depends on nothing project-internal: it reads a cursor's information_schema and takes the metric
# list from its caller, so the acyclic edge is agent -> ontology (and semantic stays independent of
# it). pyyaml/duckdb are for the spec and the cursor type only.
dependencies = [
    "pyyaml>=6",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology"]
