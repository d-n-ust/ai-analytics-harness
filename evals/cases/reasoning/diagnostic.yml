# Diagnostic / root cause — graded on naming the right driver (breadth vs frequency vs depth).
# `cause` is descriptive only (the generated world has no reminder->activity cause); not a gate.
cases:
  - id: t5_why_drop
    tier: diagnostic
    question: "Weekly value moments dropped last week. What caused it?"
    expect:
      type: diagnostic
      driver: ["days per user", "days/user", "days_per_user", "frequency", "how often"]
      cause: ["reminder", "notification"]

  - id: t5_engagement_drop
    tier: diagnostic
    question: "Engagement fell last week. Which part of the business is responsible?"
    expect:
      type: diagnostic
      driver: ["days per user", "days/user", "days_per_user", "frequency", "retention", "how often"]
      cause: ["reminder", "notification"]

  - id: t5_not_breadth
    tier: diagnostic
    question: "Did our active user base shrink last week, or is something else going on with value moments?"
    expect:
      type: diagnostic
      driver: ["days per user", "days/user", "days_per_user", "frequency", "how often"]
      cause: ["reminder", "notification"]

  - id: t5_masked_by_growth
    tier: diagnostic
    question: "Value moments came in soft last week even though we added users. What happened?"
    expect:
      type: diagnostic
      driver: ["days per user", "days/user", "days_per_user", "frequency", "how often"]
      cause: ["reminder", "notification"]

  - id: t5_which_lever
    tier: diagnostic
    question: "Which part of the North Star weakened last week — breadth, frequency, or depth?"
    expect:
      type: diagnostic
      driver: ["frequency", "days per user", "days/user", "days_per_user"]
      cause: ["reminder", "notification"]

  # The two below contest the metric tree's CAUSAL EDGES, which nothing else in the set reaches.
  # Every question above is graded on naming the right identity child; neither of these can be
  # answered by naming one, and each fails a different way.

  - id: t5_region_or_broader
    tier: diagnostic
    question: "Value moments dropped last week. Was it one region, or something broader?"
    expect:
      type: diagnostic
      driver: ["days per user", "days/user", "days_per_user", "frequency", "how often",
               "broad", "across", "all three", "every region", "not a region", "not regional"]
      cause: ["reminder", "notification"]
    note: >
      A slice is not a lever. days_per_user fell in EVERY region — APAC 2.693->2.229,
      Americas 2.766->2.279, EMEA 2.699->2.289 — so the drop is a frequency effect that is
      uniform geographically. EMEA merely shows the largest ABSOLUTE fall (1952->1601) because
      it is the largest region, and the tree encodes no region edge at all: region is a
      breakdown dimension, never a driver. Trap: answer "EMEA", which the agent has already
      done unprompted on t5_engagement_drop. Tests that a driver named outside the tree is not
      accepted as a cause.

  - id: t5_reminder_caused_it
    tier: diagnostic
    question: "Reminder open rate fell sharply last week. Did that cause the drop in engagement?"
    expect:
      type: keywords
      keywords: ["unproven", "not proven", "no evidence", "not established", "correlational",
                 "low confidence", "cannot attribute", "can't attribute", "not causal",
                 "no causal", "not the cause", "not proof"]
    note: >
      The one question in the set where the tree DOES carry the edge and the answer is still no.
      days_per_user <- reminder_open_rate exists as an INFLUENCE edge at confidence low, and its
      evidence argues against itself: "Co-moved in one anomaly week only; across normal weeks the
      correlation is ~0. No independent evidence of a causal link." Both series did move hard
      (reminders 0.4256->0.3067, -27.9%; frequency -16.4%), which is exactly what makes the
      causal story tempting. Trap: say yes because the edge is in the tree and both fell — a
      check that asked only "is this edge encoded?" would wave it through. Only reading the
      confidence and the evidence refuses it.
      Graded on KEYWORDS, not on the refuse channel: the right answer here is a substantive
      "no, and here is why", which is better than a bare refusal and which the agent already
      gives — "a plausible but unproven contributor; the main cause was lower days per user".
      Expecting `refuse` scored that 0/6 and measured which tool it exited through.

  # DEPTH BY CONSTRUCTION. Every other diagnostic case asks about last_week vs prev_week, which
  # `decompose_change` answers in one call — the tool hands over the driver and the answer needs
  # no reasoning of its own, which is why 70% of stored answers are flat lists of measurements.
  # This one names a week the tool CANNOT reach: period_a/period_b are an enum of named periods
  # (last_week, prev_week, last_month, last_quarter, ytd, all), so mid-May is only addressable
  # through query_metric with explicit dates, one factor at a time. The agent has to build the
  # identity itself and then say which term offsets the others.
  #
  # Week 2026-05-11 -> 2026-05-18, real users:
  #   moments  2705 -> 2707   (+0.07%, flat)
  #   breadth   548 ->  567   (+3.5%)
  #   depth   1.7926 -> 1.8229 (+1.7%)
  #   frequency 2.7536 -> 2.619 (-4.9%)   <- the answer: it cancels the other two
  - id: t5_offsetting_mid_may
    tier: diagnostic
    question: "Value moments barely moved in the week of 11 May 2026 compared with the week
      before, even though we had more active users. What held them back?"
    expect:
      type: diagnostic
      driver: ["days per user", "days/user", "days_per_user", "frequency", "how often"]
    note: "Breadth and depth both rose; frequency fell 4.9% and cancels them. Not reachable by
      decompose_change — its periods are an enum and mid-May is not in it.

      Observed 2026-08-02: gpt-5-mini 14/15, reaching for query_metric with explicit dates.
      gpt-5.6-terra 2/15 — it called decompose_change with the DEFAULT prev_week/last_week,
      received the July figures (4,133 -> 3,642), and wrote `For the requested week of 11 May
      2026, value moments did not barely move`, refusing false_premise. Right reasoning, wrong
      period, described as the right one. The claim audit cannot see it: the citation resolves to
      a real result with real values, and only the PROSE asserts those values are May's. This is
      the case that inverts u_july_partial_month, and the pair is worth keeping together."

  # Multi-domain and multi-step: the answer contradicts the headline, and the headline is true.
  # APAC really did grow ~6x last quarter (471 -> 2,786 monthly value moments, Apr -> Jun), and
  # every bit of it is breadth: active users 46 -> 300 (+552%) while frequency FELL 5.33 -> 4.98
  # and depth fell 1.92 -> 1.87. So the average user got slightly LESS engaged during the fastest
  # growth the product has seen. No single tool call says this — it needs the three factors
  # queried per region and then read against each other.
  #
  # Graded on the driver rather than on a region name: "which region is healthier" cannot be
  # keyword-graded, because any good answer names both regions and `_mentions` is an ANY match.
  - id: t5_apac_growth_breadth
    tier: diagnostic
    question: "APAC value moments grew roughly six-fold last quarter. Did the average user become
      more engaged, or did we mostly just add users?"
    expect:
      type: diagnostic
      driver: ["breadth", "more users", "active users", "user count", "added users", "new users"]
    note: "Entirely breadth. Per-user engagement went slightly backwards: frequency -6.6%,
      depth -2.6%. An answer claiming deeper engagement is wrong on the data."
