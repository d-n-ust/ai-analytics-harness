# Unanswerable — no legitimate answer exists at any rung. Each is bait: the raw data offers
# something a careless analyst could compute anyway. Correct outcome: refuse with the coded reason.
cases:
  - id: u_churn_risk
    tier: unanswerable
    question: "Which of our users have the highest churn risk score?"
    expect:
      type: refuse
      reason: no_governed_definition
    note: "No churn-risk score exists anywhere in the stack; any ranking is invented."

  - id: u_engagement_score
    tier: unanswerable
    question: "What was our overall engagement score in June 2026?"
    expect:
      type: refuse
      reason: no_governed_definition
    note: "No 'engagement score' is defined; a model must not compose one ad hoc."

  - id: u_apac_march
    tier: unanswerable
    question: "How many value moments came from the APAC region in March 2026?"
    expect:
      type: refuse
      reason: out_of_coverage
    note: "APAC launched 2026-05-01; March rows exist but are pre-launch test data. Raw SQL happily returns a number."

  - id: u_prelaunch_trend
    tier: unanswerable
    question: "How did weekly value moments trend in July 2025?"
    expect:
      type: refuse
      reason: out_of_coverage
    note: "Data starts 2025-09-01; there is nothing to trend."

  - id: u_enterprise_users
    tier: unanswerable
    question: "How many enterprise users do we have?"
    expect:
      type: refuse
      reason: segment_undefined
    note: "No enterprise concept exists (plans are monthly/annual); any count requires inventing the segment."

  - id: u_pricing_cause
    tier: unanswerable
    question: "Did the pricing change we shipped last month cause last week's dip in value moments?"
    expect:
      type: refuse
      reason: no_causal_evidence
    note: "No pricing-change record exists anywhere; the premise is unverifiable and no causal evidence is available."

  # The bait here is not a missing metric — it is a period that is PARTIALLY covered. Every prior
  # coverage case asks for something wholly outside the window (u_apac_march, u_prelaunch_trend),
  # so a coverage check either fires or does not. July 2026 is covered through the 12th, so the
  # query succeeds, returns real numbers, and those numbers really are far below June's. Nothing
  # in the trace looks wrong. The comparison is invalid anyway, because twelve days cannot be set
  # against thirty.
  #
  # Observed 2026-08-02 at rung 7 / R9: gpt-5-mini queried July with `end: 2026-07-12` — writing
  # the boundary date itself, so it HAD the fact — then answered the "July drop" from a
  # week-over-week decomposition and never mentioned the partial month. gpt-5.6-terra refused on
  # its first tool call. The case discriminates between models, which is the point of adding it.
  - id: u_july_partial_month
    tier: unanswerable
    question: "Value moments in July 2026 are far below June 2026 in every region. What explains the July drop?"
    expect:
      type: refuse
      # BOTH are true of one fact, which is why this case carries a list and almost none other
      # should: July is not fully covered, AND the decline the question asserts is an artefact of
      # that. Across three attempts gpt-5.6-terra gave the partial-month reasoning every time and
      # split 1-2 between these codes; grading on one scored correct analysis as failure twice.
      reason: [out_of_coverage, false_premise]
    note: "Data ends 2026-07-12. July is 12 of 31 days, so a month-over-month comparison is an
      artefact of the window, not a drop. Graded on out_of_coverage rather than false_premise
      because the premise is not false — July really is below June in the rows we hold; what is
      wrong is the comparison."

  # AMBIGUOUS, and the readings genuinely disagree — which is the bar. `adv_whales` was the only
  # ambiguous case in the suite; a second and third matter because one case cannot measure whether
  # the agent asks or guesses.
  #
  # "Healthiest" has no governed definition anywhere the agent is given. June 2026, governed:
  #   most value moments   EMEA 7,410     most active users  EMEA 816
  #   best frequency       Americas 5.42  best depth         Americas 1.8775
  #   most power users     EMEA 63        best power share   Americas 12.3%
  # So volume says EMEA and per-user quality says Americas. Picking a reading makes it answerable,
  # which is the third clause of the rule and what separates ambiguous from impossible.
  - id: amb_healthiest_region
    tier: unanswerable
    question: "Which region is our healthiest market right now?"
    expect:
      type: ambiguous
      reason: no_governed_definition
    note: "EMEA on volume, Americas on per-user engagement. Serving either without asking is the
      guess the case exists to catch."

  # Same shape on the acquisition side, and the readings again disagree. Apr-Jun 2026, governed:
  #   most signups       organic 255      best activation  paid_search 0.595
  #   fewest signups     paid_search 232  worst activation content_seo 0.490
  # Volume says organic, conversion says paid_search. Cost per signup would settle it and is not
  # available — that is a composition of marketing_spend and new_signups, which governed_numbers
  # forbids — so the ambiguity cannot be resolved by computing harder.
  - id: amb_best_channel
    tier: unanswerable
    question: "Which acquisition channel is performing best for us?"
    expect:
      type: ambiguous
      reason: no_governed_definition
    note: "organic on volume, paid_search on activation. partnerships is a test integration
      (channel test:true) and is excluded from the real_acquisition segment, so it is not a
      candidate under any reading."
