- qid: t4_business_health
  question: Is the app healthy right now — how would you tell?
  answer: 'Short answer: overall the app looks slightly unhealthy this week — weekly
    real value moments fell ~11.9% vs the prior week, driven primarily by a sharp
    drop in frequency (days per user). Active users rose ~6.0% while moments per day
    was flat, so fewer days per user is the main issue. Key figures (last full ISO
    week = 2026-07-06 to 2026-07-12): - Weekly real value moments: 3,642 (last_week)
    — down 11.88% vs prev_week (4,133). Source: real_value_moments. - Active users
    (breadth): 886 last_week, up 5.98% vs prev_week (836). Source: active_users. -
    Days per user (frequency): 2.2709 last_week, down 16.44% vs prev_week (2.7177).
    This is the primary driver of the drop. Source: days_per_user. - Moments per active
    day (depth): 1.8101 last_week, roughly flat (−0.49%). Source: moments_per_day.
    - Reminder open rate also fell (30.67% from 42.56%), but the model flags its evidence
    as low; it co-moved in one anomaly week and is a candidate influence, not proven
    cause. Interpretation: breadth (active users) increased, so user acquisition or
    re-activation is not the problem this week. However frequency collapsed — users
    used the app on far fewer days — causing the North Star to drop. Investigate recent
    changes that could reduce daily usage (notification delivery or content, backend
    reliability, UX changes, timezone-related scheduling, or an external event). Also
    check reminder/notification deliveries and any infra incidents during 2026-07-06
    to 2026-07-12. Claims: 1) Weekly real value moments = 3642 (r2:value). 2) Weekly
    real value moments fell −11.88% vs prev_week (r1:value_a, r1:value_b, r1:pct_change).
    3) Active users = 886 last_week, +5.98% vs prev_week (r3:value; r1:active_users.value_a,
    r1:active_users.value_b, r1:active_users.pct_change). 4) Days per user = 2.270880361173815
    last_week, −16.44% vs prev_week (r4:value; r1:days_per_user.value_a, r1:days_per_user.value_b,
    r1:days_per_user.pct_change). 5) Moments per day = 1.8101391650099403 last_week,
    ≈−0.49% vs prev_week (r5:value; r1:moments_per_day.value_a, r1:moments_per_day.value_b,
    r1:moments_per_day.pct_change). 6) Reminder open rate fell from 42.56% to 30.67%
    and is a low-confidence influence candidate (r1:reminder_open_rate.value_a, r1:reminder_open_rate.value_b).
    Next steps I suggest: 1) check notification delivery and open analytics and any
    infra/feature releases in the week; 2) segment days_per_user by platform/region
    to localize the drop; 3) review UX telemetry and crash rates for that week. If
    you want, I can run the breakdowns (platform, region) for days_per_user and reminder_open_rate
    over the two weeks.'
  judge_passed: true
  panel_says_serve: null
  unanimous: false
  votes:
    strict:
      serve: true
      reason: The answer correctly uses weekly real value moments as the North Star,
        reports the governed figures accurately, attributes the decline to the arithmetic
        frequency component rather than an unproven external cause, and frames possible
        causes as investigations.
    pragmatic:
      serve: true
      reason: The answer correctly uses weekly real value moments as the North Star,
        quantifies the weekly decline, and its frequency/depth/breadth interpretation
        is supported by the supplied decomposition figures.
    skeptical:
      serve: false
      reason: The answer treats active-user growth as evidence that acquisition or
        reactivation is not a problem, but the aggregate active-user metric cannot
        identify or rule out those drivers.
