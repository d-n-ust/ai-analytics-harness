- qid: t4_business_health
  question: Is the app healthy right now — how would you tell?
  answer: No — the app shows a meaningful drop in core engagement last week (real
    value moments fell). Weekly real value moments declined 11.88% from 4,133 (week
    ending 2026-07-05) to 3,642 (week ending 2026-07-12) per the governed metric weekly_value_moments;
    decomposition shows the decline was driven primarily by a 16.44% drop in days_per_user
    (frequency) despite active users rising 5.98%. Recommend investigating recent
    notification/reminder delivery and any product changes that week.
  judge_passed: true
  panel_says_serve: null
  unanimous: false
  votes:
    strict:
      serve: false
      reason: The engagement decline and its arithmetic are supported, but the recommendation
        names notification/reminder delivery and product changes as likely investigation
        targets without evidence in the supplied decomposition.
    pragmatic:
      serve: false
      reason: The computed figures support the weekly value-moment decline and its
        frequency decomposition, but they do not support attributing the decline to
        notification/reminder delivery or product changes.
    skeptical:
      serve: true
      reason: The weekly value-moments decline and the stated active-user and days-per-user
        changes are supported by the governed figures; the investigation recommendation
        is framed as a hypothesis rather than a causal assertion.
