cases:
- id: V001
  question: How many value moments came from the APAC region in the second quarter of 2026 (April–June)?
  metric_used: value_moments
  analyst_added_filters:
    region: APAC
  time_window: 2026-05-01..2026-06-30
  sql: SELECT sum(moments) AS value FROM agg_active_days WHERE active_date >= DATE '2026-05-01' AND active_date
    <= DATE '2026-06-30' AND region = 'APAC'
  query_result: 3852.0
  served_answer: 3852
  human: 'yes'
- id: V002
  question: How many people who signed up in June 2026 reached their first completed habit within a week?
  metric_used: activation_rate
  analyst_added_filters:
    is_internal: false
  time_window: 2026-06-01..2026-06-30
  sql: SELECT avg(CASE WHEN activated THEN 1 ELSE 0 END) AS value FROM agg_user_activation WHERE NOT is_internal
    AND signup_date >= DATE '2026-06-01' AND signup_date <= DATE '2026-06-30' AND is_internal = false
  query_result: 0.5322283609576427
  served_answer: 0.5322283609576427
  human: 'no'
- id: V003
  question: Did our active user base shrink last week, or is something else going on with value moments?
  metric_used: active_users
  analyst_added_filters:
    is_internal: false
  time_window: 2026-06-29..2026-07-12
  sql: SELECT date_trunc('week', active_date)::date AS period, count(distinct user_id) AS value FROM agg_active_days
    WHERE NOT is_internal AND active_date >= DATE '2026-06-29' AND active_date <= DATE '2026-07-12' AND
    is_internal = false GROUP BY period ORDER BY period
  query_result: 836.0
  served_answer: 886
  human: 'no'
- id: V004
