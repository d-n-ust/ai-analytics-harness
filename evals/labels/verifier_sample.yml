  metric_used: reminder_open_rate
  analyst_added_filters:
    is_internal: false
  time_window: 2026-06-13..2026-07-12
  sql: SELECT date_trunc('day', active_date)::date AS period, platform, avg(had_reminder) AS value FROM
    agg_active_days WHERE NOT is_internal AND active_date >= DATE '2026-06-13' AND active_date <= DATE
    '2026-07-12' AND is_internal = false GROUP BY period, platform ORDER BY period, platform
  query_result: 0.3488372093023256
  served_answer: 0.0
  human: 'no'
