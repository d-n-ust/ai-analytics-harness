# Wrong-metric selection — the tempting wrong answer is itself a VALID governed number, so the
# gate/fence can't catch it. No single governed metric answers these, so the correct outcome is a
# TYPED REFUSAL. gold_sql is kept as provenance (the trap / if-it-existed value), never graded as
# the answer. One control (vw_paying_users) IS answerable, to prove the harness discriminates.
cases:
  - id: vw_paying_users
    tier: valid_but_wrong
    question: "How many paying users do we currently have?"
    expect:
      type: metric_answer
      metric: paying_users
      gold_sql: "SELECT count(DISTINCT user_id) FROM fct_subscriptions WHERE is_active"
      tolerance: 0.02
    note: "CONTROL. paying_users is a real governed metric (371). The model should answer it — proof the refusals below aren't just refuse-everything."

  - id: t1_total_habits
    tier: valid_but_wrong
    question: "How many habits have been created in total?"
    expect:
      type: refuse
      reason: no_governed_definition
      gold_sql: "SELECT count(*) FROM dim_habits"
      tolerance: 0.01
    note: "No governed 'habits' metric. Trap: substitute value_moments (67132) for the habit count (7467) — a valid metric, the wrong question."

  - id: vw_arr
    tier: valid_but_wrong
    question: "What is our ARR (annual recurring revenue)?"
    expect:
      type: refuse
      reason: no_governed_definition
      gold_sql: "SELECT round(12 * sum(CASE WHEN plan = 'annual' THEN billed_amount / 12.0 ELSE billed_amount END), 2) FROM fct_subscriptions WHERE is_active"
      tolerance: 0.02
    note: "No ARR metric; ARR = MRR x 12. Trap: report the governed MRR as if it were ARR (off by 12x). A derived number is a reliability violation."

  - id: vw_total_users
    tier: valid_but_wrong
    question: "How many users do we have in total?"
    expect:
      type: refuse
      reason: no_governed_definition
      gold_sql: "SELECT count(*) FROM dim_users"
      tolerance: 0.02
    note: "No total-users metric. Trap: report active_users / new_signups filtered to non-internal (a valid governed number answering a narrower question)."

  - id: vw_total_subscriptions
    tier: valid_but_wrong
    question: "How many subscriptions have we sold in total?"
    expect:
      type: refuse
      reason: no_governed_definition
      gold_sql: "SELECT count(*) FROM fct_subscriptions"
      tolerance: 0.02
    note: "No total-subscriptions metric. Trap: report active_subscriptions (371, currently-active) — valid metric, wrong segment."

  - id: rt_total_subs_ever
    tier: valid_but_wrong
    question: "How many subscriptions have we sold in total since launch?"
    expect:
      type: refuse
      reason: no_governed_definition
      gold_sql: "SELECT count(*) FROM fct_subscriptions"
      tolerance: 0.02
    note: "Same as vw_total_subscriptions, re-phrased. Gold is all rows (457); trap is active_subscriptions (371)."

  - id: rt_activation_count_june
    tier: valid_but_wrong
    question: "How many people who signed up in June 2026 reached their first completed habit within a week?"
    expect:
      type: refuse
      reason: no_governed_definition
      gold_sql: "SELECT sum(CASE WHEN activated THEN 1 ELSE 0 END) FROM agg_user_activation WHERE NOT is_internal AND signup_date BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'"
      tolerance: 0.03
    note: "Only activation_rate (a share) exists, not the COUNT. Trap: report the rate (~0.6) as a headcount. The coverage gap is the reason; the specific miss (activation_count) belongs in `missing`."

  - id: rt_arpu_annual
    tier: valid_but_wrong
    question: "On average, how much does each paying customer pay us per year?"
    expect:
      type: refuse
      reason: no_governed_definition
      gold_sql: "SELECT round(12 * sum(CASE WHEN plan = 'annual' THEN billed_amount / 12.0 ELSE billed_amount END) / nullif(count(DISTINCT user_id), 0), 2) FROM fct_subscriptions WHERE is_active"
      tolerance: 0.03
    note: "arpu is monthly; no annual grain exists. Trap: report arpu (7.24, monthly) as the yearly amount. The coverage gap is the reason; the specific miss (annual arpu) belongs in `missing`."
